/* Topic-row rename/remove controls */
.rowacts{display:inline-flex;gap:2px;align-items:center;margin-left:6px}
.rowact{background:none;border:none;cursor:pointer;font-size:14px;padding:4px 5px;border-radius:7px;opacity:.55;line-height:1}
.rowact:hover{opacity:1;background:rgba(0,0,0,.06)}
.row:hover .rowact{opacity:.8}
/* V1.7 Blueprint panel */
.mgbp{margin:6px 0 2px}
.mgbp-grid{display:flex;flex-wrap:wrap;gap:8px}
.mgbp-in{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim)}
.mgbp-in input{width:52px;padding:3px 5px;border:1px solid var(--line,#e3e0ef);border-radius:7px;font-size:12px}
.mgbp-prev{margin-top:10px;padding:8px 10px;border:1px solid var(--line,#e3e0ef);border-radius:10px;background:rgba(124,58,237,.04)}
.mgbp-h{font-size:13px;margin-bottom:4px}
.mgbp-row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:2px 0}
.mgbp-row.short,.mgbp .short{color:#c0392b}
.selpop{position:fixed;z-index:9000;display:none;flex-direction:column;gap:6px}
.selpop .explbtn{position:static;display:block;box-shadow:0 8px 22px rgba(91,33,182,.4)}
.selpop .vizbtn2{background:linear-gradient(135deg,#7c3aed,#0d9488)!important}
/* Visualize modal */
.vizov{position:fixed;inset:0;z-index:9500;background:rgba(20,12,38,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.vizpanel{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(20,12,38,.5)}
.vizhd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line,#e7e3f2)}
.vizhd b{font-size:15px}.vizhd .x{border:0;background:#f1eef8;border-radius:9px;width:32px;height:32px;font-size:16px;cursor:pointer}
.vizhd .vizq{margin-left:auto;margin-right:10px;font-size:11px;font-weight:800;color:#6d28d9;background:#f1eef8;border-radius:999px;padding:3px 9px}
.vizhd .vizq.low{color:#b45309;background:#fdf1e3}.vizhd .vizq:empty{display:none}
.vizbody{padding:14px 16px}
/* inline "Visualize how to get this answer" under a review card */
.vizmiss{margin-top:14px}
.vizmissbtn{width:100%;border:1px dashed #c9b8f7;background:#faf7ff;color:#6d28d9;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
.vizmissbtn:hover{background:#f3ecff}
.vizsavedbtn{width:100%;border:none;background:#6d28d9;color:#fff;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.vizsavedbtn:hover{background:#5b21b6}
.vizsavedbtn .vsaved{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 9px;border-radius:20px}
.vizinlinehost{margin-top:10px}
.vizgen{display:flex;align-items:center;gap:12px;border:1px solid #eee7fb;background:#faf9fd;border-radius:12px;padding:14px}
.vizgen.err{color:#b4453b;font-size:13px;font-weight:600}
.vizgenspin{display:flex;gap:5px;flex:0 0 auto}
.vizgenspin i{width:8px;height:8px;border-radius:50%;background:#7c3aed;display:inline-block;animation:vizpulse 1s infinite ease-in-out}
.vizgenspin i:nth-child(2){animation-delay:.15s}.vizgenspin i:nth-child(3){animation-delay:.3s}
@keyframes vizpulse{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.vizgentxt{display:flex;flex-direction:column}.vizgentxt b{font-size:14px;color:#3a1d7a}.vizgentxt span{font-size:12px;color:#6b6580}
/* floating non-blocking "building your explainer" pill — reader keeps scrolling while it generates */
.vizfloat{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9600;
  display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:999px;
  background:rgba(24,18,45,.92);backdrop-filter:blur(8px);color:#fff;box-shadow:0 10px 30px rgba(45,20,90,.38);
  font-size:13.5px;font-weight:700;max-width:min(92vw,420px);cursor:default;animation:vfIn .28s cubic-bezier(.2,.9,.3,1.3)}
@keyframes vfIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.vizfloat .vf-core{position:relative;flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 3px 10px rgba(124,58,237,.5)}
.vizfloat.gen .vf-core{animation:vfBounce 1.05s infinite cubic-bezier(.5,.05,.5,.95)}
@keyframes vfBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.vizfloat .vf-badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
  background:#fbbf24;color:#3a1d05;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.35)}
.vizfloat.gen .vf-badge{animation:vfSpin 1.4s linear infinite}
@keyframes vfSpin{to{transform:rotate(360deg)}}
.vizfloat .vf-lab{line-height:1.2}
.vizfloat.ready{cursor:pointer;background:rgba(13,90,72,.95)}
.vizfloat.ready .vf-core{background:linear-gradient(135deg,#10b981,#0d7a68);animation:vfPop .4s ease}
.vizfloat.ready .vf-badge{background:#d1fae5;color:#065f46}
@keyframes vfPop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.vizfloat.err{background:rgba(120,30,30,.94)}
/* podcast host avatar picker */
.pavhost{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.pavh-badge{font-size:10.5px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--primer,#6d28d9);border-radius:999px;padding:2px 9px}
.pavh-badge.b{background:var(--recall,#0d9488)}
.pavgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;margin:8px 0 2px}
.povatar{background:none;border:0;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border-radius:12px}
.povatar:hover{background:rgba(124,58,237,.06)}
.pav-face{position:relative;width:52px;height:52px;border-radius:50%;display:block;box-shadow:0 2px 8px rgba(20,16,38,.18);transition:transform .12s ease}
.pav-face svg{display:block;width:100%;height:100%;border-radius:50%}
.pod-mini{display:inline-block;border-radius:50%;overflow:hidden;vertical-align:middle;flex:0 0 auto;box-shadow:0 1px 3px rgba(20,16,38,.2)}
.pod-mini svg{display:block;width:100%;height:100%;border-radius:50%}
.pod-now{display:flex;align-items:center;gap:12px;margin-top:12px;padding:8px 10px;border-radius:12px;background:var(--panel2,#f1eff8)}
.pod-now-av{position:relative;display:inline-block;line-height:0}
.pod-now-av.live::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid var(--card,#fff);animation:podpulse 1.4s infinite}
@keyframes podpulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}
/* podcast format chooser */
.podmodes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.podmodes{grid-template-columns:1fr}}
.podmode{position:relative;text-align:left;background:var(--card,#fff);border:1.5px solid var(--line,#e7e3f0);border-radius:14px;padding:14px 14px 16px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.podmode:hover{transform:translateY(-2px);border-color:var(--primer,#7c3aed);box-shadow:0 8px 22px rgba(91,33,182,.14)}
.podmode.feat{border-color:var(--primer,#7c3aed)}
.pm-ic{font-size:26px;line-height:1}
.pm-t{font-weight:800;font-size:15px;margin-top:8px;color:var(--text)}
.pm-d{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35}
.pm-badge{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--primer,#7c3aed);border-radius:999px;padding:2px 8px}
/* question bank */
.qbmodes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.qbmodes{grid-template-columns:1fr}}
.qbmode{position:relative;text-align:left;background:var(--card,#fff);border:1.5px solid var(--line,#e7e3f0);border-radius:14px;padding:14px 14px 16px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.qbmode:hover{transform:translateY(-2px);border-color:var(--primer,#7c3aed);box-shadow:0 8px 22px rgba(91,33,182,.14)}
.qbmode.feat{border-color:var(--primer,#7c3aed)}
.qbm-ic{font-size:24px;line-height:1}
.qbm-t{font-weight:800;font-size:15px;margin-top:8px;color:var(--text)}
.qbm-d{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35}
.qbm-badge{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;color:#fff;background:var(--primer,#7c3aed);border-radius:999px;padding:2px 8px}
.qbopts{display:flex;flex-direction:column;gap:9px}
.qbopt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;background:var(--card,#fff);border:1.5px solid var(--line,#e7e3f0);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.4;color:var(--text);cursor:pointer;transition:border-color .12s,background .12s}
.qbopt:hover:not([disabled]){border-color:var(--primer,#7c3aed)}
.qbopt[disabled]{cursor:default}
.qbopt.sel{border-color:var(--primer,#7c3aed);background:rgba(124,58,237,.06)}
.qbopt.right{border-color:#1d9e75;background:rgba(29,158,117,.10)}
.qbopt.wrong{border-color:#e2574b;background:rgba(226,87,75,.10)}
.qbol{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--panel2,#f1eff8);color:var(--text);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.qbopt.right .qbol{background:#1d9e75;color:#fff}
.qbopt.wrong .qbol{background:#e2574b;color:#fff}
.qbrat{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.qbrat-row{font-size:12.5px;line-height:1.45;border-radius:9px;padding:8px 11px;background:var(--panel2,#f4f2fb)}
.qbrat-row.r{background:rgba(29,158,117,.10)}.qbrat-row.r b{color:#0d7a68}
.qbrat-row.w b{color:var(--dim)}
.qbrev{font-size:13px;line-height:1.45;border-radius:9px;padding:8px 11px;margin:5px 0;background:var(--panel2,#f4f2fb)}
.qbrev.r{background:rgba(29,158,117,.10)}.qbrev.w{background:rgba(226,87,75,.10)}
.qbrev-rat{font-size:12px;color:var(--dim);margin-top:4px}
.qbteach{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:10px;padding:9px 12px;border-radius:10px;background:rgba(124,92,255,.08);border:1px solid rgba(124,92,255,.18);font-size:12.5px;line-height:1.45}
.qbteach b{color:var(--brand,#5b3df5)}
.qbnote{flex:0 0 auto;font-size:12px;font-weight:700;border:1px solid var(--line,#e3e0ef);background:var(--card,#fff);color:var(--brand,#5b3df5);border-radius:8px;padding:5px 10px;cursor:pointer}
.qbnote:hover{background:var(--panel2,#f4f2fb)}
/* Q-bank start-screen config + post-answer reveal */
.qbcfgwrap{text-align:left;margin-bottom:14px}
.qbcfg{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.qbcfg-l{font-size:12px;font-weight:700;color:var(--dim);min-width:92px;padding-top:5px}
.qbcfg-c{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.qbchipbtn{border:1px solid var(--line,#e3e0ef);background:var(--card,#fff);color:var(--text);font-size:12px;font-weight:600;border-radius:20px;padding:5px 12px;cursor:pointer}
.qbchipbtn:hover{border-color:var(--brand,#5b3df5)}
.qbchipbtn.on{background:var(--brand,#5b3df5);color:#fff;border-color:var(--brand,#5b3df5)}
.qbreveal{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.qbchip{font-size:11px;font-weight:700;border:1px solid var(--line,#e3e0ef);color:var(--dim);border-radius:20px;padding:3px 10px}
.qbchip.lvl{background:transparent}
.qbtrap{margin-top:8px;padding:8px 12px;border-radius:9px;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.22);font-size:12.5px;line-height:1.45}
.qbtrap b{color:#7c3aed}
.qbexpo{font-size:12px;font-weight:700;color:var(--brand,#5b3df5);background:var(--panel2,#f4f2fb);border-radius:8px;padding:6px 11px;margin-bottom:12px;display:inline-block}
.qbchipbtn.sm{font-size:11px;padding:4px 10px}
.mgdiv{height:1px;background:var(--line,#e3e0ef);margin:12px 0}
.mgtopics{margin:6px 0 4px 102px;display:flex;flex-wrap:wrap;gap:6px}
.mgtsub{flex-basis:100%;font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-top:6px}
@media(max-width:560px){.mgtopics{margin-left:0}.qbcfg{flex-direction:column;gap:4px}.qbcfg-l{min-width:0}.mg .expo{margin-left:0}}
.mgquick{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(0deg,var(--panel2,#f4f2fb),var(--panel2,#f4f2fb))}
.mgq-t{font-weight:800;font-size:16px}
.mgq-s{font-size:12px;color:var(--dim);margin-top:2px}
.mgweak .mgw-h{font-weight:800;margin-bottom:8px}
.mgw-chips{display:flex;flex-wrap:wrap;gap:6px}
.mgw-chip{font-size:11.5px;font-weight:700;border:1px solid var(--line,#e3e0ef);border-radius:20px;padding:3px 10px}
.mgcustom{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin:16px 0 8px}
/* V1.5 — Smart Drill card */
.sdcard{border:1px solid #cdbff5;background:linear-gradient(180deg,#f6f2ff,var(--card,#fff))}
.sdcard.muted{border-color:var(--line,#e3e0ef);background:var(--panel2,#f4f2fb)}
.sd-h{font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px}
.sd-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#6d28d9;background:#ece5ff;border-radius:20px;padding:2px 8px}
.sd-sub{font-size:13px;color:var(--dim);margin-top:6px}
.sd-line{font-size:13px;color:var(--text);margin-top:6px;font-weight:600}
.sd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sd-chip{font-size:11.5px;font-weight:800;border:1px solid var(--line,#e3e0ef);border-radius:20px;padding:3px 10px}
.sd-why{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.5}
/* V1.5 — confidence capture */
.qbconf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line,#e3e0ef)}
.qbconf>span{font-size:12.5px;color:var(--dim);font-weight:700}
.qbconf-b{display:flex;gap:6px}
.qbconf-b button{font-size:18px;line-height:1;background:var(--panel2,#f4f2fb);border:1px solid var(--line,#e3e0ef);border-radius:10px;padding:6px 9px;cursor:pointer;transition:transform .08s}
.qbconf-b button:hover{transform:translateY(-2px);border-color:#8b5cf6}
/* V1.5 — why this? */
.qbwhy{margin-bottom:10px}
.qbwhy>summary{font-size:12px;color:var(--brand,#5b3df5);cursor:pointer;font-weight:700;list-style:none}
.qbwhy>summary::-webkit-details-marker{display:none}
.qbwhy>div{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.5;background:var(--panel2,#f4f2fb);border-radius:10px;padding:9px 11px}
.qbwhy ul{margin:6px 0 0;padding-left:18px}
/* V1.5 — what should I work on */
.sdnext{border:1px solid #cdbff5}
.sdnext-sub{font-size:12px;color:var(--dim);margin:2px 0 10px}
.sdnext-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line,#eee)}
.sdnext-row:first-of-type{border-top:0}
.sdnext-l{display:flex;align-items:center;gap:8px;min-width:0}
.sdnext-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.sdnext-t{font-weight:700;font-size:13.5px}
.sdnext-mis{font-size:10px;font-weight:800;color:#e2574b;background:#fdecea;border-radius:20px;padding:1px 7px}
.sdnext-r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.sdnext-ag{display:inline-flex;gap:2px;align-items:center;font-size:11px;color:var(--dimmer)}
.sdnext-ag .lk{background:none;border:0;cursor:pointer;font-size:14px;line-height:1;padding:1px 3px;border-radius:6px;opacity:.55;transition:opacity .1s,transform .08s}
.sdnext-ag .lk:hover{opacity:1;transform:translateY(-1px)}
.pilotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
@media(max-width:640px){.pilotgrid{grid-template-columns:repeat(2,1fr)}}
.pilotstat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.pilotstat b{display:block;font-size:26px;font-weight:900;line-height:1.05}
.pilotstat span{font-size:12px;color:var(--dimmer);font-weight:600}
.pilottbl{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:14px}
.pilottbl th{text-align:left;color:var(--dimmer);font-size:12px;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.pilottbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
.pilotnote{border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;margin:10px 0;background:var(--panel2);border:1px solid var(--line)}
.pilotnote.good{background:#eafaf3;border-color:#0d948855;color:#0a6b52}
.pilotnote.warn{background:#fdf4e7;border-color:#e08a3c66;color:#9a5a12}
.qbendbtn{font-size:11.5px;font-weight:700;color:var(--dim);background:var(--panel2,#f4f2fb);border:1px solid var(--line,#e3e0ef);border-radius:99px;padding:4px 11px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:color .12s,border-color .12s}
.qbendbtn:hover{color:#e2574b;border-color:#e2574b}
.btn.sm{font-size:12px;padding:5px 12px;min-width:0}
/* V1.5 — calibration + mastery */
.sdcal-msg{font-size:13px;line-height:1.5;margin-bottom:10px}
.sdcal-msg>div{color:var(--dim);font-size:12.5px;margin-top:3px}
.sdcal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:560px){.sdcal-grid{grid-template-columns:repeat(2,1fr)}}
.sdcal-v{font-size:20px;font-weight:900}
.sdcal-k{font-size:11px;color:var(--dim);line-height:1.3}
.sdms-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line,#eee);font-size:13.5px}
.sdms-row:first-of-type{border-top:0}
.qbbarwrap{display:flex;align-items:center;gap:10px}
.qbbarwrap .qbbar{flex:1;min-width:0}
.qbbar-drill{flex:0 0 auto;align-self:center}
.qbretest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line,#e3e0ef)}
.qbretest>span{font-size:11.5px;color:var(--dim)}
/* V1.6 gap-loop */
.gapoffer{margin-top:12px;padding:11px 13px;border-radius:11px;background:rgba(224,138,60,.10);border:1px solid rgba(224,138,60,.28)}
.gapoffer-h{font-weight:700;font-size:13px;color:var(--ink,#1c1830);margin-bottom:8px}
.gapoffer-b{display:flex;gap:8px;flex-wrap:wrap}
.gapov{position:fixed;inset:0;background:rgba(28,20,45,.55);display:flex;align-items:center;justify-content:center;z-index:100000;padding:16px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.gapcard{background:var(--panel,#fff);width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:18px;padding:22px 20px;box-shadow:0 30px 80px rgba(28,20,45,.4)}
.gapcard .gaph{font-weight:800;font-size:18px;letter-spacing:-.2px;margin-bottom:8px}
.gapcard .gapobj{font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:10px;background:rgba(124,92,255,.08);border:1px solid rgba(124,92,255,.18);margin-bottom:10px}
.gapcard .gapmsg{font-size:13.5px;color:var(--dim);line-height:1.5;margin-bottom:12px}
.gapcard .gapstem{font-size:15px;line-height:1.55;margin:6px 0 12px}

  /* ═══ COMPUTER-STUDIES renderers — the logic-gate schematic and the generalised grid. Like the
   * physics pair these are FIXED scenes: the blueprint names gates and wires them to each other,
   * and the renderer alone decides where anything sits. ═══ */

  /* ═════════ LOGIC — gate schematic, live signal colour, bonded truth table ═════════
   * A gate's COLUMN is derived from its depth below the inputs, never authored, so a blueprint
   * cannot place a gate somewhere unroutable. Wire colour IS the signal value: red is 1, blue is 0,
   * grey is "not on screen yet" — which is what turns an algebra exercise into something to watch. */
  var LG_ON='#dc2626', LG_OFF='#2563eb', LG_DEAD='#c9c3d8';
  var LG_W=60, LG_H=48;
  var LG_BUB={NOT:1,NAND:1,NOR:1,XNOR:1};
  var LG_ROUND={OR:1,NOR:1,XOR:1,XNOR:1};
  function lgEval(type,v){
    var b=v.map(function(x){return x?1:0;});
    if(type==='NOT') return b[0]?0:1;
    if(type==='BUF') return b[0]?1:0;
    if(type==='AND')  return b.every(function(x){return x;})?1:0;
    if(type==='NAND') return b.every(function(x){return x;})?0:1;
    if(type==='OR')   return b.some(function(x){return x;})?1:0;
    if(type==='NOR')  return b.some(function(x){return x;})?0:1;
    if(type==='XOR')  return b.reduce(function(p,c){return p^c;},0)?1:0;
    if(type==='XNOR') return b.reduce(function(p,c){return p^c;},0)?0:1;
    return 0;
  }
  /* the gate body. Distinctive ANSI shapes — the SHAPE carries the meaning, so a NAND is an AND
   * plus a bubble, and the bubble stays a separate movable object (that is De Morgan's law). */
  function lgBody(type,x,y,stroke,fill,glow){
    var hw=LG_W/2, hh=LG_H/2, d='', extra='', g=glow?' filter="url(#lgGlow)"':'';
    if(type==='NOT'||type==='BUF'){
      d='M'+(x-hw+8)+','+(y-hh)+' L'+(x+hw-14)+','+y+' L'+(x-hw+8)+','+(y+hh)+' Z';
    } else if(type==='AND'||type==='NAND'){
      d='M'+(x-hw)+','+(y-hh)+' L'+(x-4)+','+(y-hh)+' A '+hh+' '+hh+' 0 0 1 '+(x-4)+','+(y+hh)+' L'+(x-hw)+','+(y+hh)+' Z';
    } else {
      d='M'+(x-hw)+','+(y-hh)+' Q'+(x-hw+22)+','+y+' '+(x-hw)+','+(y+hh)+
        ' Q'+(x+4)+','+(y+hh)+' '+(x+hw-2)+','+y+' Q'+(x+4)+','+(y-hh)+' '+(x-hw)+','+(y-hh)+' Z';
      if(type==='XOR'||type==='XNOR')
        extra='<path d="M'+(x-hw-9)+','+(y-hh)+' Q'+(x-hw+13)+','+y+' '+(x-hw-9)+','+(y+hh)+'" fill="none" stroke="'+stroke+'" stroke-width="3"/>';

  function logicSVG(step){

  function closeVt(){ _vtTos.forEach(clearTimeout); _vtTos=[]; if(_tzT){clearInterval(_tzT);_tzT=null;} var o=document.getElementById('vtov'); if(o)o.remove(); }

  /* Scheduler: only after ~1 minute of actually reading the note do we bring in the demo. */
  var _vtTimer=null;
  window.scheduleVizTeaser=function(topicId){
    if(_vtTimer){clearTimeout(_vtTimer);_vtTimer=null;}
    try{ closeVt(); }catch(e){}
    if(!topicId) return;                                   // left the note view
    if(window.hasUsedViz && hasUsedViz()) return;          // already knows the feature
    var subj=(window.currentTopicSubject?currentTopicSubject():'')||'', skey=(subj||'general').toLowerCase();
    try{ if(DATA&&DATA.teaserSeen&&DATA.teaserSeen[skey])return; }catch(e){}   // once per subject
    _vtTimer=setTimeout(function(){ _vtTimer=null;
      try{ if(!window.currentTopicId||currentTopicId()!==topicId)return; }catch(e){ return; }   // still on this note?
      if(document.hidden) return;                          // reading (tab visible)
      if(document.getElementById('vizov')||document.getElementById('vtov')||document.getElementById('obov')) return;
      window.mountVizTeaser();
    }, 60000);   // 1 minute
  };

  /* The scripted demo: cursor sweeps a sentence → the Visualize button appears → cursor clicks it
     → the subject-matched explainer plays. Shown as a light popup, once per subject. */
  window.mountVizTeaser=function(){ try{
    if(window.hasUsedViz && hasUsedViz()) return;
    var subj=(window.currentTopicSubject?currentTopicSubject():'')||'', skey=(subj||'general').toLowerCase();
    try{ window.DATA=window.DATA||{}; DATA.teaserSeen=DATA.teaserSeen||{}; if(DATA.teaserSeen[skey])return; DATA.teaserSeen[skey]=1; if(window.persist)persist(); }catch(e){}
    var key=vtKey(subj); _tzBP=VIZ_DEMOS[key]||VIZ_DEMOS.default; _tzK=0;
    var sent=VT_SENT[key]||VT_SENT.default;
    var ov=document.createElement('div'); ov.className='vtov'; ov.id='vtov';
    ov.innerHTML='<div class="vtcard">'
      +'<div class="vthd"><b>🎬 Visualize</b><span>turn any line into a quick explainer</span><button class="vtx" id="vtX">✕</button></div>'
      +'<div class="vtphase" id="vtP1"><div class="vtnote"><span class="vttext" id="vtText">'+sent+'</span></div>'
        +'<button class="vtbtn" id="vtBtn">🎬 Visualize this</button>'
        +'<div class="vtcursor" id="vtCur"><svg viewBox="0 0 24 24"><path d="M5 2 L5 20 L10 15 L13 21.5 L15.6 20.4 L12.6 14 L19 14 Z" fill="#1c1830" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg></div></div>'
      +'<div class="vtphase2" id="vtP2" style="display:none"><div class="vtstage"><div id="vtStage"></div></div><div class="vtcap" id="vtCap"></div></div>'
      +'<button class="vtgot" id="vtGot">Got it — I\'ll try it ✨</button></div>';
    document.body.appendChild(ov);
    document.getElementById('vtX').onclick=closeVt;
    document.getElementById('vtGot').onclick=closeVt;
    ov.addEventListener('click',function(e){ if(e.target===ov)closeVt(); });

    var $id=function(id){return document.getElementById(id);};
    _vtTos=[];
    vtT(250,function(){ var t=$id('vtText'); if(t)t.classList.add('sel'); var c=$id('vtCur'); if(c){c.style.left='84%';c.style.top='30px';} });   // sweep the highlight, cursor trails the selection
    vtT(1550,function(){ var b=$id('vtBtn'); if(b)b.classList.add('show'); });                                        // the button appears
    vtT(1800,function(){ var c=$id('vtCur'); if(c){c.style.left='50%';c.style.top='86px';} });                        // cursor moves to it
    vtT(2450,function(){ var b=$id('vtBtn'); if(b)b.classList.add('clicked'); });                                     // click
    vtT(2800,function(){                                                                                              // → the explainer plays
      var p1=$id('vtP1'),p2=$id('vtP2'); if(p1)p1.style.display='none'; if(p2)p2.style.display='block';
      teaserDraw($id('vtStage'),0); var cap=$id('vtCap'); if(cap)cap.textContent=vtCap(_tzBP,0);
      var n=(_tzBP.narration_steps||[]).length;
      if(_tzT)clearInterval(_tzT);
      _tzT=setInterval(function(){ var e=$id('vtStage'); if(!e){clearInterval(_tzT);_tzT=null;return;}
        _tzK++; if(_tzK>=n){clearInterval(_tzT);_tzT=null; return;} teaserDraw(e,_tzK); var cp=$id('vtCap'); if(cp)cp.textContent=vtCap(_tzBP,_tzK); },1600);
    });
  }catch(e){} };

  /* ===== One-time onboarding: the first time a student opens a note, show the scripted
     "highlight → Visualize → diagram" moment once (skippable), then never again. ===== */
  window.showVizOnboarding=function(){ try{
    if(!window.localStorage) return; if(localStorage.getItem('mb_onboard_viz')==='1') return;
    if(document.getElementById('obov')) return;
    if(window.hasUsedViz&&window.hasUsedViz()){ localStorage.setItem('mb_onboard_viz','1'); return; }   // already knows the feature
    localStorage.setItem('mb_onboard_viz','1');
    var obBP={layout:"cell",anode:{label:"Zinc anode (−)",half:"Zn → Zn²⁺ + 2e⁻",sol:"ZnSO₄"},cathode:{label:"Copper cathode (+)",half:"Cu²⁺ + 2e⁻ → Cu",sol:"CuSO₄"},bridge:"salt bridge (KNO₃)",
      narration_steps:[{reveal:["anode","cathode"],active:[],point:"anode"},{reveal:["anode"],active:["anode"],point:"anode"},{reveal:["cathode"],active:["cathode"],point:"cathode"},{reveal:["wire"],active:["wire"],point:"wire"},{reveal:["bridge"],active:["bridge"],point:"bridge"},{reveal:["ions"],active:["ions"],point:"ions"}]};
    var caps=["Meet <b>Visualize</b> — turn any sentence in your notes into a short, narrated explainer.","Zinc is oxidised at the <b>anode</b> — the negative electrode.","Copper ions are reduced at the <b>cathode</b> — positive.","Electrons flow through the wire, <b>anode → cathode</b>.","The <b>salt bridge</b> keeps both sides neutral.","A steady <b>current</b> flows. Now you try — highlight any sentence!"];
    var ov=document.createElement("div"); ov.className="obov"; ov.id="obov";
    ov.innerHTML='<div class="obcard live"><div class="obhd"><b>🎬 Visualize</b><span class="obq">a 10-second tour</span><button class="obx" id="obSkip">Skip</button></div>'
      +'<div class="obsrc">Highlighted: “…oxidation at the <b>anode</b>, reduction at the <b>cathode</b>, and a <b>salt bridge</b> keeps both sides neutral.”</div>'
      +'<div class="obstage"><div id="obSvg"></div></div>'
      +'<div class="obcap"><div class="obtxt" id="obCap"></div><div class="obeq"><i></i><i></i><i></i><i></i><i></i></div></div>'
      +'<button class="obgot" id="obGot">Got it — let me try ✨</button></div>';
    document.body.appendChild(ov);
    var k=0; function draw(){ BP=obBP; var el=document.getElementById("obSvg"); if(el)try{el.innerHTML=cellSVG(k);}catch(e){}
      var c=document.getElementById("obCap"); if(c)c.innerHTML='<span class="oblab">STEP '+(k+1)+' / 6</span>'+caps[k]; }
    draw();
    var t=setInterval(function(){ if(!document.getElementById("obov")){clearInterval(t);return;} k++; if(k>=6){clearInterval(t);return;} draw(); },1900);
    function close(){ clearInterval(t); var o=document.getElementById("obov"); if(o)o.remove(); }
    document.getElementById("obGot").onclick=close; document.getElementById("obSkip").onclick=close;
    ov.addEventListener("click",function(e){ if(e.target===ov)close(); });
  }catch(e){} };
  function recordViz(topicId,text){
    if(!topicId){ try{ topicId=(location.hash.match(/#\/topic\/([^\/?#]+)/)||[])[1]||''; }catch(e){} }   // recover the topic id from the URL if it wasn't passed — never silently drop the video
    if(!topicId||!window.DATA)return; try{ DATA.viz=DATA.viz||{}; var a=DATA.viz[topicId]=DATA.viz[topicId]||[]; var t=(text||'').trim();
    if(t && !a.some(function(x){return x.text===t;})){ a.push({text:t,ts:Date.now()}); if(window.persist)persist();
      try{ if(window.MB_SYNC&&MB_SYNC.flush) MB_SYNC.flush(); }catch(e){} }   // push immediately — never let a reload beat the 1500ms debounce and lose the video
    if(window.markWatchedNote) setTimeout(window.markWatchedNote,60);   // show the highlight/▶watch chip right away, without re-opening the note
  }catch(e){} }
  window.markWatchedNote=function(){ try{
    var host=document.querySelector('#main .notebody'); if(!host)return;
    var tid=window.currentTopicId(); var list=(window.DATA&&DATA.viz&&DATA.viz[tid])||[]; if(!list.length)return;
    var name=(window.currentTopicName?currentTopicName():'');
    list.forEach(function(item){ wrapPhrase(host,item.text,tid,name); });
  }catch(e){} };
  function wrapPhrase(host,phrase,tid,name){ if(!phrase||phrase.length<4)return;
    // the full highlight often spans several DOM nodes (bold words split it), so match a
    // shortening prefix — sentence, first words, first chars — until one fits inside a single text node
    var s=phrase.trim(), cands=[], dot=s.search(/[.:;]\s/);
    if(dot>12) cands.push(s.slice(0,dot));
    cands.push(s.split(/\s+/).slice(0,8).join(' '));
    cands.push(s.slice(0,46).trim());
    cands.push(s.split(/\s+/).slice(0,5).join(' '));
    cands=cands.filter(function(c){return c&&c.length>=6;});
    var walker=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,null),node;
    while(node=walker.nextNode()){
      var pe=node.parentElement; if(pe&&pe.closest&&pe.closest('.vizmark'))continue;
      for(var ci=0;ci<cands.length;ci++){ var cand=cands[ci], idx=node.nodeValue.indexOf(cand); if(idx<0)continue;
        var before=node.nodeValue.slice(0,idx), match=node.nodeValue.slice(idx,idx+cand.length), after=node.nodeValue.slice(idx+cand.length);
        var span=document.createElement('span'); span.className='vizmark'; span.textContent=match;
        var chip=document.createElement('span'); chip.className='vizwatch'; chip.textContent='▶ watch'; chip.title='Replay this visualization';
        chip.onclick=(function(ph){return function(e){ e.stopPropagation(); window.aiVisualize(ph,name,tid); };})(phrase);
        var frag=document.createDocumentFragment();
        if(before)frag.appendChild(document.createTextNode(before));
        frag.appendChild(span); frag.appendChild(chip);
        if(after)frag.appendChild(document.createTextNode(after));
        node.parentNode.replaceChild(frag,node); return;   // mark first occurrence only
      }
    }
  }
})();
</script>
