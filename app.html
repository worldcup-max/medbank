<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedBank">
<title>MedBank</title>
<style>
:root{
  --bg:#f6f5fb; --panel:#ffffff; --panel2:#f1eefb; --line:#e6e3f0;
  --text:#1c1830; --dim:#5c5570; --dimmer:#8b84a0;
  --accent:#5b21b6; --ped:#0d9488; --og:#5b21b6; --com:#c2790a;
  --primer:#5b21b6; --recall:#0d9488;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}

#shell{display:flex;min-height:100%}
#sidebar{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);
  padding:18px 12px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50}
#main{margin-left:248px;flex:1;min-width:0;padding:28px 32px 80px;max-width:1000px}
#main.wide{max-width:1320px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;font-size:19px}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.navlabel{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--dimmer);padding:16px 12px 7px;font-weight:600}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--dim);
  cursor:pointer;font-size:14.5px;font-weight:500;margin-bottom:2px;transition:background .12s,color .12s}
.navitem:hover{background:var(--panel2);color:var(--text)}
.navitem.active{background:var(--accent);color:#fff}
.navitem .ic{width:20px;text-align:center;font-size:15px;flex:0 0 20px}
.navitem .badge{margin-left:auto;font-size:11px;color:var(--dimmer);font-weight:600}
.navitem.active .badge{color:rgba(255,255,255,.85)}

#hamburger{display:none;position:fixed;top:12px;left:12px;z-index:70;background:var(--panel);
  border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:10px;font-size:19px;cursor:pointer}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
@media(max-width:820px){
  #sidebar{transform:translateX(-100%);transition:transform .22s ease;width:270px}
  body.navopen #sidebar{transform:none}
  body.navopen #scrim{display:block}
  #main{margin-left:0;padding:66px 16px 90px;max-width:100%}
  #hamburger{display:block}
}

h1{font-size:27px;margin:0 0 6px;letter-spacing:-.3px}
h2{font-size:20px;margin:34px 0 12px}
.sub{color:var(--dim);font-size:14.5px;margin:0 0 26px}
.crumb{font-size:13.5px;color:var(--dim);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb .sep{color:var(--dimmer)}
.crumb a{color:var(--dim);cursor:pointer}
.crumb a:hover{color:var(--accent)}
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;
  cursor:pointer;transition:border-color .14s,transform .14s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h3{margin:0 0 5px;font-size:16.5px;font-weight:600}
.card p{margin:0;color:var(--dim);font-size:13.5px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;margin-bottom:9px}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:34px 22px;text-align:center;
  color:var(--dim);font-size:14.5px;background:var(--panel)}
.stats{display:flex;gap:11px;flex-wrap:wrap;margin:0 0 28px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 17px;min-width:104px}
.stat b{display:block;font-size:23px;line-height:1.25}
.stat span{font-size:12px;color:var(--dim)}

/* topic rows */
.modhead{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--dimmer);
  font-weight:700;margin:30px 0 11px}
.rows{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.rows.gridv{border:0;background:transparent;overflow:visible;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.rows.gridv .row{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.row{display:flex;align-items:center;gap:13px;padding:12px 15px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2)}
.row .sn{flex:0 0 30px;color:var(--dimmer);font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}
.row .mid{flex:1;min-width:0}
.row .tt{font-size:15.2px;font-weight:550;line-height:1.4}
.row .meta{font-size:12.5px;color:var(--dim);margin-top:2px}
.row .st{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 10px;border-radius:99px;white-space:nowrap}
.st.ready{background:#3ecf8e1f;color:var(--recall)}
.st.todo{background:#6b78891f;color:var(--dimmer)}
.row.todo .tt{color:var(--dim);font-weight:500}
@media(max-width:560px){
  .row{padding:11px 12px;gap:9px}
  .row .sn{flex:0 0 22px;font-size:12px}
  .row .tt{font-size:14.3px}
  .row .st{font-size:9.5px;padding:3px 7px}
}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;color:var(--dim);cursor:pointer;font-size:14.5px;font-weight:500;
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.md{font-size:16px}
.md h1{font-size:25px;margin:0 0 14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.md h2{font-size:19.5px;margin:30px 0 9px;color:#fff}
.md h3{font-size:16.5px;margin:22px 0 7px;color:var(--dim)}
.md p{margin:0 0 13px}
.md ul,.md ol{margin:0 0 15px;padding-left:23px}
.md li{margin-bottom:6px}
.md strong{color:#fff;font-weight:650}
.md code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:14px}
.md hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel);color:var(--text);
  border:1px solid var(--line);padding:11px 17px;border-radius:10px;cursor:pointer;
  font-size:14.5px;font-weight:600;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green{background:var(--recall);border-color:var(--recall);color:#04231a}
.btn:disabled{opacity:.4;cursor:default}

.studywrap{max-width:760px;margin:0 auto}
.studytop{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.studytop .name{font-weight:650;font-size:15px}
.counter{margin-left:auto;color:var(--dim);font-size:13.5px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-bottom:22px}
.bar>div{height:100%;transition:width .25s}
.flash{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 26px;
  min-height:230px;cursor:pointer}
.flash .qlabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dimmer);font-weight:700;margin-bottom:11px}
.flash .q{font-size:20.5px;font-weight:600;line-height:1.45}
.taphint{text-align:center;color:var(--dimmer);font-size:13px;margin-top:26px}
.ansblock{margin-top:24px;padding-top:22px;border-top:1px solid var(--line);animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.seg{margin-bottom:20px}.seg:last-child{margin-bottom:0}
.seglabel{font-size:11px;letter-spacing:.9px;text-transform:uppercase;font-weight:700;margin-bottom:8px;
  display:inline-block;padding:3px 9px;border-radius:6px}
.seg .body{font-size:16.5px;line-height:1.78;letter-spacing:.1px}
.seg .body p{margin:0 0 15px}.seg .body p:last-child{margin:0}
.seg.lecturer .body{border-left:3px solid var(--dimmer);padding-left:15px;color:#dfe6f2}
.seg .body .stepq{
  font-size:15px;font-weight:700;color:#fff;margin:30px 0 13px;line-height:1.5;
  padding-left:13px;border-left:3px solid var(--primer);
}
.seg .body .stepq:first-child{margin-top:0}
.seg .body .substepq{
  font-size:14.5px;font-weight:650;color:var(--text);margin:22px 0 11px;line-height:1.5;
  padding-left:13px;border-left:2px solid var(--dimmer);
}
.seg .body ul.airy{list-style:none;margin:0 0 16px;padding:0}
.seg .body ul.airy li{position:relative;padding-left:20px;margin-bottom:9px}
.seg .body ul.airy li::before{
  content:"";position:absolute;left:3px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--dimmer);
}
.seg .body hr.soft{border:0;border-top:1px solid var(--line);margin:26px 0}
.seg .body .takeaway{
  background:#4f8cff14;border-left:3px solid var(--primer);border-radius:0 9px 9px 0;
  padding:13px 16px;margin:18px 0;font-weight:550;color:#fff;line-height:1.65;
}
.seg.tie .body .takeaway{background:#ffb45414;border-left-color:var(--com)}
.seg .body table.mini{width:100%;border-collapse:collapse;margin:16px 0 20px;font-size:15px}
.seg .body table.mini th{
  text-align:left;padding:9px 12px;color:var(--dim);font-weight:600;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);
}
.seg .body table.mini td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.seg .body table.mini tr:last-child td{border-bottom:0}

/* ---------- images ---------- */
.figrow{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
.figrow.multi>.fig{flex:1 1 220px}
.fig{margin:0;flex:1 1 100%;min-width:0}
.fig img{
  width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);
  background:#fff;cursor:zoom-in;
}
.fig figcaption,.figcap{
  font-size:13px;color:var(--dim);margin-top:8px;line-height:1.5;text-align:center;
}
.figcap{margin-bottom:14px}
.md .figrow{margin:20px 0 8px}
.lightbox{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.93);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:16px;cursor:zoom-out;
}
.lightbox img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:6px}
.lbhint{color:var(--dimmer);font-size:13px;margin-top:14px}
.imgbadge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:99px;
  background:#c77dff22;color:var(--og);margin-left:8px;
}
.navbtns{display:flex;gap:10px;margin-top:22px}
.navbtns .btn{flex:1;justify-content:center}
.kbd{color:var(--dimmer);font-size:12.5px;text-align:center;margin-top:16px}
@media(max-width:820px){.kbd{display:none}.flash{padding:24px 19px}.flash .q{font-size:19px}}

.step{display:flex;gap:15px;margin-bottom:19px;align-items:flex-start}
.stepnum{flex:0 0 29px;height:29px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-top:1px}
.step .txt b{display:block;margin-bottom:3px;font-size:15.5px}
.step .txt span{color:var(--dim);font-size:14.5px}
pre.copy{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;
  white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.65;color:var(--dim);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---- status chips on topic rows ---- */
.st.new{background:#6b78891f;color:var(--dim)}
.st.learn{background:#ffb4541f;color:var(--com)}
.st.done{background:#3ecf8e1f;color:var(--recall)}

/* ---- dashboard ---- */
.dash{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;margin-bottom:28px}
.dashtop{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.fire{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ff6a3d18,#ffb45410);border:1px solid #ff8a4d33;border-radius:14px;
  padding:12px 20px;min-width:118px}
.fire .n{font-size:38px;font-weight:800;line-height:1;color:#ff8a4d}
.fire .l{font-size:12px;color:var(--dim);margin-top:4px;font-weight:600}
.dgoal{flex:1;min-width:210px}
.dgrow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--dim);margin-bottom:8px}
.dgrow b{font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.dbar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.dbar>div{height:100%;background:linear-gradient(90deg,var(--recall),#6be3ad);transition:width .3s}
.goalhit{margin-top:9px;font-size:13px;color:var(--recall);font-weight:600}
.dmetrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.dm{background:var(--panel2);border-radius:11px;padding:11px 6px;text-align:center}
.dm b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.dm span{font-size:11.5px;color:var(--dim)}
@media(max-width:560px){.dmetrics{grid-template-columns:repeat(2,1fr)}.fire{min-width:0;flex:1}}

/* ---- progress rings/bars ---- */
.rings{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.ringcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;cursor:pointer;transition:border-color .14s}
.ringcard:hover{border-color:var(--accent)}
.ringtop{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.ringtop b{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums}
.pbar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:11px 0 8px}
.pbar>div{height:100%;transition:width .3s}
.ringmeta{font-size:12.5px;color:var(--dim)}

/* ---- heatmap ---- */
.heatwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.heat{display:flex;gap:3px;min-width:max-content}
.hcol{display:flex;flex-direction:column;gap:3px}
.hc{width:13px;height:13px;border-radius:3px;background:var(--panel2);display:block}
.hc.off{background:transparent}
.hc.l0{background:#20262f}.hc.l1{background:#123a2b}.hc.l2{background:#1f6e4d}
.hc.l3{background:#2fa46f}.hc.l4{background:#4be3a0}
.heatlegend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:11px;font-size:12px;color:var(--dim)}
.heatlegend .hc{width:11px;height:11px}

/* ---- today / session ---- */
.todaybar{display:flex;align-items:center;gap:12px;margin-bottom:16px;max-width:760px;margin-left:auto;margin-right:auto}
.alldone,.summary{max-width:640px;margin:20px auto;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:32px 26px;text-align:center}
.alldone .big{font-size:52px;color:var(--recall);line-height:1}
.alldone b{display:block;font-size:20px;margin:12px 0 8px}
.alldone p{color:var(--dim);font-size:14.5px;margin:0 auto 20px;max-width:440px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.sm b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.sm span{font-size:12px;color:var(--dim)}
.sflame{font-size:19px;font-weight:700;color:#ff8a4d;margin-bottom:6px}
@media(max-width:520px){.sgrid{grid-template-columns:repeat(2,1fr)}}

/* ---- rating buttons ---- */
.ratebtns{display:flex;gap:12px;margin-top:22px}
.ratebtns .btn{flex:1;justify-content:center;font-size:16px;padding:15px}
.btn.got{background:var(--recall);border-color:var(--recall);color:#04231a}
.btn.miss{background:#2a1c22;border-color:#7a3b4d;color:#ff9db1}

/* ---- MCQ (Recall Deck B) ---- */
.mcqopts{margin-top:22px;display:flex;flex-direction:column;gap:10px;animation:fade .18s ease}
.mcqopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:14px 15px;cursor:pointer;font-size:15.5px;line-height:1.5;
  transition:.12s;font-family:inherit}
.mcqopt:hover:not(:disabled){border-color:var(--accent);background:#1f2735}
.mcqopt:disabled{cursor:default}
.mcqtag{flex:0 0 26px;height:26px;border-radius:7px;background:var(--line);color:var(--dim);
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.mcqtext{flex:1}
.mcqmark{margin-left:auto;font-weight:800;font-size:17px}
.mcqopt.removed{opacity:.38;text-decoration:line-through;border-style:dashed;cursor:default}
/* swipe-to-next onboarding hint */
#mbSwipeHint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:9600;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;transition:opacity .25s;opacity:1}
#mbSwipeHint .shcard{position:relative;width:96px;height:64px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 30px rgba(28,20,45,.22);animation:shcard 1.8s ease-in-out infinite}
#mbSwipeHint .shhand{position:absolute;right:-6px;top:34px;width:26px;height:26px;border-radius:50%;background:#6d28d9;box-shadow:0 4px 12px rgba(109,40,217,.5);animation:shhand 1.8s ease-in-out infinite}
#mbSwipeHint .shtxt{background:#141026;color:#fff;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;box-shadow:0 8px 20px rgba(20,12,38,.3)}
@keyframes shcard{0%,100%{transform:translateX(14px) rotate(2deg)}45%{transform:translateX(-18px) rotate(-3deg)}}
@keyframes shhand{0%,100%{transform:translateX(14px)}45%{transform:translateX(-30px)}}
.hintbtn{display:block;width:100%;margin-top:6px;background:#f6ecda;border:1px solid #e6cf9a;color:#8a5a12;border-radius:11px;padding:10px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
.hintbtn:hover{background:#f0e2c4}
.mcqopt.correct{border-color:var(--recall);background:#3ecf8e1c}
.mcqopt.correct .mcqtag{background:var(--recall);color:#04231a}
.mcqopt.correct .mcqmark{color:var(--recall)}
.mcqopt.wrong{border-color:#7a3b4d;background:#2a1c22}
.mcqopt.wrong .mcqtag{background:#7a3b4d;color:#ff9db1}
.mcqopt.wrong .mcqmark{color:#ff9db1}
.mcqopt.dim{opacity:.45}
.mcqresult{margin-top:18px;font-weight:700;font-size:15px;padding:11px 14px;border-radius:10px;text-align:center;animation:fade .2s ease}
.mcqresult.ok{background:#3ecf8e1c;color:var(--recall)}
.mcqresult.no{background:#2a1c22;color:#ff9db1}
.nextrev{margin-top:9px;font-size:13.5px;text-align:center;color:var(--dim)}
.nextrev b{color:var(--text)}
.nextrev.no b{color:#ff9db1}
.revtoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;
  box-shadow:0 10px 34px rgba(0,0,0,.5);animation:fade .2s ease;max-width:90vw}
.revtoast .rt{color:var(--recall)}.revtoast .rt.no{color:#ff9db1}

/* ---- weekly progress + jump back in ---- */
.wkcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.wktitle{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--dimmer);font-weight:700;margin-bottom:12px}
.wkmetrics{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.wm{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 8px;text-align:center}
.wm b{display:block;font-size:22px;line-height:1}.wm span{font-size:11.5px;color:var(--dim)}
.jb-day{margin-bottom:18px}
.jb-dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;border-bottom:1px solid var(--line);padding-bottom:6px}
.jb-dh b{font-size:15.5px}.jb-dh span{font-size:12.5px;color:var(--dim)}
.jb-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.jb-row:hover{border-color:var(--accent)}
.jb-name{flex:1;font-size:14.5px;font-weight:600}
.jb-st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.jb-st.done{background:#3ecf8e22;color:var(--recall)}
.jb-st.learn{background:#ffb45422;color:var(--com)}
.jb-st.new{background:var(--panel2);color:var(--dim)}
@media(max-width:560px){.jb-row{flex-wrap:wrap}.jb-row .btn{width:100%;justify-content:center}}

/* ---- topic status selector ---- */
.statusbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:18px}
.statusbar .slabel{font-size:13px;color:var(--dim);font-weight:600}
.ssegs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.sseg{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.sseg:hover{color:var(--text);border-color:var(--accent)}
.sseg.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:560px){.statusbar .slabel{width:100%}.ssegs{margin-left:0}.sseg{flex:1;text-align:center}}

/* ---- star (hard card) button ---- */
.flash{position:relative}
.starbtn{position:absolute;top:14px;right:14px;background:transparent;border:0;cursor:pointer;
  font-size:22px;line-height:1;color:var(--dimmer);padding:4px;font-family:inherit}
.starbtn:hover{color:var(--com)}
.starbtn.on{color:var(--com)}
.flash .qlabel{padding-right:38px}

/* ---- today's plan ---- */
.plan{display:flex;flex-direction:column;gap:12px;max-width:640px}
.planitem{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 17px}
.planitem.done{opacity:.66}
.pi-ic{flex:0 0 34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;
  justify-content:center;font-size:17px}
.planitem.done .pi-ic{background:#3ecf8e22;color:var(--recall)}
.pi-mid{flex:1;min-width:0}
.pi-mid b{display:block;font-size:15.5px;margin-bottom:3px}
.pi-mid span{color:var(--dim);font-size:13.5px}

/* ---- achievements ---- */
.achgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 13px;text-align:center;opacity:.4;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:#ffb45455}
.ach .ai{font-size:26px;display:block;margin-bottom:6px}
.ach b{display:block;font-size:13.5px;margin-bottom:3px}
.ach .ad{font-size:11.5px;color:var(--dim);line-height:1.4}

/* ---- weekly grid ---- */
.wgrid{display:flex;gap:9px;flex-wrap:wrap}
.wday{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 10px;text-align:center;min-width:60px;flex:1}
.wday .hc{width:100%;height:26px;border-radius:6px;margin-bottom:7px}
.wday span{font-size:11px;color:var(--dimmer);display:block}
.wday b{font-size:16px;font-variant-numeric:tabular-nums}

/* ---- search ---- */
.sbox{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:11px;padding:13px 15px;font-size:15.5px;font-family:inherit;margin-bottom:20px}
.sbox:focus{outline:none;border-color:var(--accent)}

/* ---- streak freeze + level + exam chips + floor marker ---- */
.fire{position:relative}
.frz{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:#1a2733;color:#7fb4ff}
.frz.used{background:#2a2320;color:var(--dimmer)}
.dbar{position:relative}
.floormark{position:absolute;top:-2px;width:2px;height:14px;background:var(--com);border-radius:2px;transform:translateX(-1px)}
.lvlbar{margin-top:16px}
.lvltop{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:7px}
.lvltop span{font-weight:700;color:var(--og)}
.lvltop b{font-size:12px;color:var(--dim);font-weight:600}
.examrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.examchip{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.examchip b{color:var(--text)}
.examchip.soon{background:#ff6a3d18;border-color:#ff8a4d55;color:#ffb08a}
.examchip.soon b{color:#ff8a4d}
/* ===== new responsive home ===== */
.home2{animation:homefade .28s ease}
@keyframes homefade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.home2 .hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.home2 .herorow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.home2 .herohi{font-size:15px;color:var(--dim)}
.home2 .herostreak{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--com);background:#f6ecda;padding:4px 11px;border-radius:20px}
.home2 .herolab{font-size:12.5px;color:var(--dimmer)}
.home2 .herobig{font-size:27px;font-weight:800;letter-spacing:-.3px;margin:2px 0 15px}
.home2 .herobtns{display:flex;gap:9px;flex-wrap:wrap}
.home2 .hstart{flex:1 1 240px;justify-content:center}
.home2 .hcont{flex:0 1 auto}
.home2{max-width:100%;overflow-x:clip}
/* ===== bento home: single column on phone, filled grid on desktop ===== */
.home2.bento{display:flex;flex-direction:column;gap:14px}
.home2.bento>*{margin:0;min-width:0}
.home2.bento .hero{padding-bottom:16px}
@media(min-width:900px){
  .home2.bento{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;
    grid-template-areas:"hero hero" "tiles tiles" "lead lead" "mip prog" "goal goal" "more more";}
  .home2.bento .mtiles{grid-template-columns:repeat(4,1fr)}
  .home2.bento .jbmore{grid-template-columns:1fr 1fr}
}
.hcols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px;align-items:start;min-width:0}
.hleft,.hright{min-width:0}
.goalcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:14px}
.goaltop{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:9px}
.goaltop b{color:var(--text)}
.segbar{height:9px;border-radius:6px;background:var(--panel2);overflow:hidden;display:flex}
.segbar div{height:100%}
.goalleg{display:flex;gap:14px;align-items:center;margin-top:9px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.goalleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.goalleg .gstat{margin-left:auto;font-weight:700;color:var(--com)}
.goalleg .gstat.ok{color:var(--recall)}
.shelfhd,.progtt{font-size:15px;font-weight:700;margin:0 2px 10px}
.shelf{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;min-width:0;max-width:100%}
.shelfcard{flex:0 0 158px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:border-color .15s}
.shelfcard:hover{border-color:var(--accent)}
.shelfnm{font-size:13px;font-weight:700;line-height:1.3;margin:9px 0 8px;min-height:34px}
.minibar{height:5px;border-radius:4px;background:var(--panel2);overflow:hidden}.minibar div{height:100%;border-radius:4px}
.shelfempty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--dim);font-size:13px}
/* jump-back-in cards */
.jblead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.jblead .jbinfo{flex:1;min-width:0}
.jbtop{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.deckchip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
.jbtime{font-size:11.5px;color:var(--dimmer)}
.duechip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:#FAECE7;color:#993C1D;margin-left:auto}
.jbname{font-size:16px;font-weight:800;margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jbprog{display:flex;align-items:center;gap:10px}
.jbprog .pbarn{flex:1;height:7px;border-radius:5px;background:var(--panel2);overflow:hidden}.jbprog .pbarn div{height:100%}
.jbprog span{font-size:12px;color:var(--dim);white-space:nowrap}
.jbresume{flex:0 0 auto;white-space:nowrap}
.jbmorelab{font-size:12px;color:var(--dimmer);margin:2px 2px 8px}
.jbmore{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.jbcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;min-width:0;transition:border-color .15s}
.jbcard:hover{border-color:var(--accent)}
.jbcname{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jbcard .row2{display:flex;align-items:center;gap:8px}
.jbcard .pbarn{flex:1;height:5px;border-radius:4px;background:var(--panel2);overflow:hidden}.jbcard .pbarn div{height:100%;border-radius:4px}
.jbcard .pct{font-size:11px;color:var(--dim)}
.jbacts{display:flex;gap:6px;margin-top:10px}
.jba{position:relative;flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 0;font-size:15px;line-height:1;cursor:pointer;transition:.12s}
.jba:hover{background:var(--accent);border-color:transparent;transform:translateY(-1px)}
.jba:after{content:attr(data-t);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#141026;color:#fff;font-size:11px;font-weight:700;letter-spacing:.2px;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:6}
.jba:before{content:'';position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#141026;opacity:0;transition:opacity .15s;pointer-events:none}
.jba:hover:after,.jba:hover:before{opacity:1}
@media(max-width:720px){.jbmore{display:flex;overflow-x:auto;max-width:100%;padding-bottom:4px}.jbcard{flex:0 0 152px}.jblead{flex-direction:column;align-items:stretch}.jbresume{width:100%;justify-content:center}}
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mtile{background:var(--panel2);border-radius:12px;padding:12px 14px;cursor:pointer}
.mtile b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.mtile span{font-size:12px;color:var(--dim)}
.progcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
.prow .pnm{flex:0 0 84px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pbarn{flex:1;height:6px;border-radius:4px;background:var(--panel2);overflow:hidden}.prow .pbarn div{height:100%;border-radius:4px}
.prow b{font-size:12.5px;color:var(--dim);flex:0 0 34px;text-align:right}
.homemore{margin-top:24px;border-top:1px solid var(--line);padding-top:6px}

@media(max-width:720px){.hcols{grid-template-columns:1fr}.home2 .herobig{font-size:24px}}
/* ---- habit-first home (v2) ---- */
.h2wrap{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;animation:homefade .28s ease}
.h2hero{background:linear-gradient(135deg,#3f1f95,#6d28d9);border-radius:20px;padding:20px 22px;color:#fff;cursor:pointer;box-shadow:0 10px 26px rgba(91,33,182,.26)}
.h2herohead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.h2ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}

/* ---- session-complete celebration ---- */

@keyframes celebpop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.celeb-top{font-size:40px;line-height:1}
.celeb-h{font-size:26px;font-weight:900;margin:8px 0 4px;color:#fff}
.celeb-sub{font-size:14px;color:#d9ccff;margin:0 0 16px}
.celeb-ring{position:relative;width:120px;height:120px;margin:4px auto 6px}
.celeb-ring>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.celeb-ringcap{font-size:12.5px;color:#cbb8f7;margin-bottom:16px;letter-spacing:.3px}

.celeb-stats>div{flex:1;text-align:center;min-width:0}
.celeb-stats b{display:block;font-size:24px;font-weight:900}
.celeb-stats span{font-size:11px;color:#d9ccff}
.celeb-mile{background:rgba(255,209,102,.16);border:1px solid rgba(255,209,102,.42);color:#ffe08a;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:12px}
.celeb-streak{background:rgba(255,255,255,.14);border-radius:12px;padding:11px;font-size:14px;font-weight:800;margin-bottom:14px}

.celeb-more{width:100%;background:transparent;color:#e9e2ff;border:0;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:2px}

    <div id="nav"></div>

<script src="content.js"></script>
<script>
const DB = window.MEDBANK || {subjects:[],lecturers:[],stats:{}};
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLOR = {'pediatrics':'var(--ped)','og':'var(--og)','community-medicine':'var(--com)'};
/* expose per-day card history for the study timer (date -> {cards,correct}) */
window.MB_CARDS_BY_DAY = function(){ try{ return DATA.log || {}; }catch(e){ return {}; } };
window.MB_STREAK = function(){ try{ return curStreak(); }catch(e){ return 0; } };
/* study time lives inside DATA so it syncs with the account via profile_state (same path as cards) */
window.MB_STUDY_ADD = function(sec){ try{ sec=Math.round(sec)||0; if(sec<=0) return true; var k=dstr(); DATA.study[k]=(DATA.study[k]||0)+sec; return persist(); }catch(e){ return false; } };   // TIM-05: report success so the timer can retry on failure
window.MB_STUDY_GET = function(){ try{ return DATA.study || {}; }catch(e){ return {}; } };
/* provider for the docked Ask / Source / Note panel (study-dock.js) */
window.MB_DOCK = {
  onStudyScreen: function(){ var r=(location.hash.slice(2)||'').split('/')[0];   // DCK-02: Mega/exam/gap are state overlays on their own routes; the dock's precondition is "content on screen"
    if((typeof QB!=='undefined'&&QB)||(typeof GAPLOOP!=='undefined'&&GAPLOOP)) return true;
    return ['topic','study','review','cram','hard','leeches','mistakes','nudge','hardnudge','mega','exam','solve'].indexOf(r)>=0; },   // NOT 'today' (the hub is a menu, not reading/study content)
  ctx: function(){
    var t=null, card=null, cardId=null;
    // DCK-02: prefer the INNERMOST live session (gap loop → Mega Q-bank → flashcards), so the dock never binds to a stale S.
    try{
      if(typeof GAPLOOP!=='undefined' && GAPLOOP){ var gm=GAPLOOP.mt||null; var gt=topById(GAPLOOP.topicId||(gm&&gm.topicId)); if(gt){ t=gt; card=gm; cardId=(gm&&gm.id)||''; } }
      if(!t && typeof QB!=='undefined' && QB && QB.items && QB.items.length){ var q=QB.items[QB.i]; var qt=topById((q&&q.topicId)||QB.topicId); if(qt){ t=qt; card=q; cardId=(q&&(q.id||q.key))||''; } }
      if(!t && typeof S!=='undefined' && S && S.items && S.items.length){ var it=S.items[S.order[S.i]]; if(it){ t=it.t; card=it.c; cardId=it.id; } }
    }catch(e){}
    if(!t){ var p=(location.hash.slice(2)||'').split('/'); if(p[1] && (p[0]==='topic'||p[0]==='study'||p[0]==='cram')){ try{ t=topById(p[1]); }catch(e){} } }
    if(!t) return null;
    return { topicId:t.id, topicName:t.name||'', subject:(t.subject&&t.subject.name)||'', pdf:t.pdf||'',
             noteHtml: t.note?md(t.note):'', simplifiedHtml: t.simplified?md(t.simplified):'',
             transcript: t.transcript||null,
             cardId:cardId||'', cardQ:card?(card.q||''):'', cardSrc:card?(card.src||''):'', cardT:(card&&card.src_t!=null)?card.src_t:null, personalNote: cardId?getNote(cardId):'' };
  },
  ask: function(userMsg, history, ctx){
    var sys='You are MedBank’s concise study tutor for a medical student. Topic: "'+((ctx&&ctx.topicName)||'this lecture')+'".'+((ctx&&ctx.cardQ)?(' The card on screen asks: "'+ctx.cardQ+'".'):'')+' Answer briefly and clearly, exam-focused, no fluff.';
    var model=DATA.settings.explainModel||DATA.settings.tutorEngine||'deepseek-v4-flash';
    return claudeTutor(sys, (history||[]).concat([{role:'user',text:userMsg}]), model);
  },
  saveNote: function(cardId, txt){ if(cardId){ try{ setNote(cardId, txt); }catch(e){} } },
  md: function(x){ try{ return md(x); }catch(e){ return (x||''); } }
};

/* ---------- images ---------- */
let IMGBASE = '';                       // set per topic before rendering
const imgSrc = f => /^https?:|^content\//.test(f) ? f : IMGBASE + encodeURIComponent(f);
function figure(file, caption){
  return `<figure class="fig"><img src="${imgSrc(file)}" alt="${esc(caption||'')}" loading="lazy"
     onclick="zoom(this.src)">${caption?`<figcaption>${esc(caption)}</figcaption>`:''}</figure>`;
}
function imgBlock(v, caption){
  const list = Array.isArray(v) ? v : [v];
  return `<div class="figrow${list.length>1?' multi':''}">`
       + list.map((f,i)=>figure(f, list.length===1?caption:'')).join('')
       + `</div>${list.length>1&&caption?`<div class="figcap">${esc(caption)}</div>`:''}`;
}
function zoom(src){
  const o=document.createElement('div');
  o.className='lightbox';
  o.innerHTML=`<img src="${src}"><div class="lbhint">Tap anywhere to close</div>`;
  o.onclick=()=>o.remove();
  document.body.appendChild(o);
}

function md(src){
  if(!src) return '<p style="color:var(--dim)">Nothing here yet.</p>';
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^\*])\*([^\*]+?)\*/g,'$1<em>$2</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
  const out=[]; let list=null;
  const close=()=>{if(list){out.push('</'+list+'>');list=null;}};
  const isSep=s=>/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s||'');
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const lines=src.split(/\r?\n/);
  for(let i=0;i<lines.length;i++){
    const raw=lines[i], l=raw.trim();
    if(l.startsWith('```')){ close(); const buf=[]; i++;
      while(i<lines.length && !lines[i].trim().startsWith('```')){ buf.push(esc(lines[i])); i++; }
      out.push('<pre><code>'+buf.join('\n')+'</code></pre>'); continue; }
    if(!l){close();continue;}
    let m;
    if(l==='---'){close();out.push('<hr>');continue;}
    if(l.indexOf('|')>=0 && isSep(lines[i+1])){          // pipe table
      close(); const head=cells(l); i++;
      let t='<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>';
      while(i+1<lines.length && lines[i+1].indexOf('|')>=0 && lines[i+1].trim()){ i++; t+='<tr>'+cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; }
      out.push(t+'</tbody></table>'); continue;
    }
    if((m=l.match(/^!\[(.*?)\]\((.+?)\)\s*$/))){close();out.push(imgBlock(m[2].replace(/^img\//,''),m[1]));continue;}
    if((m=l.match(/^(#{1,4})\s+(.*)/))){close();out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);continue;}
    if((m=l.match(/^\d+\.\s+(.*)/))){if(list!=='ol'){close();out.push('<ol>');list='ol';}out.push('<li>'+inline(m[1])+'</li>');continue;}
    if((m=l.match(/^[-*]\s+(.*)/))){if(list!=='ul'){close();out.push('<ul>');list='ul';}out.push('<li>'+inline(m[1])+'</li>');continue;}
    close();out.push('<p>'+inline(l)+'</p>');
  }
  close(); return out.join('');
}
/* airy renderer for card answers:
   "## text"  -> step heading      "- text" -> bullet
   "--- "     -> soft divider      ">> text" -> highlighted takeaway
   blank line -> breathing space                                    */
function para(src){
  if(!src) return '';
  const ln = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^\*])\*([^\*]+?)\*/g,'$1<em>$2</em>');
  const out=[]; let ul=false, tbl=null;
  const closeUl=()=>{ if(ul){out.push('</ul>');ul=false;} };
  const closeTbl=()=>{
    if(!tbl) return;
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>ln(c.trim()));
    let h='<table class="mini"><thead><tr>'+cells(tbl[0]).map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';

function sessionRecallIds(){

  // 12th pool missing the isFlagged filter (REV-04 family): a reported-wrong card is never served

/* ---- card corrections: edit / report-wrong / regenerate (trust + safety) ---- */
function effCard(id,c){ return DATA.cardEdits[id] ? Object.assign({}, c, DATA.cardEdits[id]) : c; }

let EDITING=null;   // cid currently being edited inline
function startEditCard(id){ EDITING=id; render(); }
function cancelEditCard(){ EDITING=null; render(); }
function saveEditCard(id,deck){
  const q=(document.getElementById('ec_q')||{}).value, a=(document.getElementById('ec_a')||{}).value;
  const patch={};
  /* An empty box used to be SAVED as a blank override, and nothing in the app can ever delete a
   * cardEdits entry — so clearing the question permanently blanked the card with no way back.
   * Ignore empty fields instead of writing them. */
  if(q!=null && q.trim()) patch.q=q.trim();
  if(a!=null && a.trim()){ if(deck==='primer') patch.explain=a.trim(); else patch.a=a.trim(); }
  if(!Object.keys(patch).length){ EDITING=null; render(); try{ mbToast('Nothing saved — a card needs a question and an answer.'); }catch(e){} return; }
  DATA.cardEdits[id]=Object.assign({}, DATA.cardEdits[id]||{}, patch);
  EDITING=null; persist(); render();
}
function flagCard(id){
  if(!confirm('Report this card as wrong and hide it from your studying? You can also just edit it instead.')) return;
  DATA.cardFlags[id]=1; persist();
  try{ if(S && typeof sessionNext==='function' && S.items){ S.items=S.items.filter(it=>it.id!==id); if(S.order) S.order=S.items.map((_,k)=>k); if(S.i>=S.items.length) S.i=Math.max(0,S.items.length-1); } }catch(e){}
  render();
}

async function regenCard(id,deck,btn){
  const it = (S && S.items) ? S.items.find(x=>x.id===id) : null;
  const t = it ? it.t : null; const c = it ? effCard(id,it.c) : null;
  if(!t||!c){ return; }
  if(btn){ btn.disabled=true; btn.textContent='Regenerating…'; }
  const ref = (t.note||t.simplified||'').slice(0,6000);
  const prompt='A medical flashcard from this lecture may be inaccurate. Using ONLY the lecture note as the source of truth, rewrite a corrected version.\n\nLECTURE NOTE:\n'+ref+'\n\nCURRENT CARD:\nQ: '+(c.q||'')+'\nA: '+(deck==='primer'?(c.explain||''):(c.a||''))+'\n\nReturn ONLY JSON: {"q":"corrected question","a":"corrected concise answer"}. Keep it faithful to the note.';
  try{
    const txt=await claudeTutor('You are a careful medical educator correcting a flashcard strictly from the provided note.', [{role:'user',text:prompt}], DATA.settings.explainModel||'deepseek-v4-flash');
    const s=txt.indexOf('{'), e=txt.lastIndexOf('}'); const o=JSON.parse(txt.slice(s,e+1));

function stripMd(s){ return (s||'').replace(/\*\*/g,'').replace(/^##\s*/gm,'').replace(/^>>\s*/gm,'')
  .replace(/[#>*_`]/g,'').replace(/\s+/g,' ').trim(); }
/* ---- voice selection: pick a good voice, not the flat default ---- */
let VOICES=[];
function loadVoices(){ try{ VOICES=(speechSynthesis.getVoices()||[]); }catch(e){ VOICES=[]; } }
/* SET-11: on Chrome/Android getVoices() is EMPTY on first paint and only fills when
   `voiceschanged` fires. Settings → AI & Voice therefore rendered one "Auto (best)" chip plus
   "Only your default voice is installed — download an Enhanced voice", which is simply false.
   Repaint that tab (and only that tab, so a half-typed backup paste on the Data tab survives). */
if('speechSynthesis' in window){ loadVoices();
  try{ speechSynthesis.onvoiceschanged=function(){ loadVoices();
    try{ if(typeof render==='function' && settingsTab==='ai' && /settings/.test(location.hash||'')) render(); }catch(e){}
  }; }catch(e){} }
function enVoices(){ if(!VOICES.length) loadVoices(); return VOICES.filter(v=>/^en(-|_|$)/i.test(v.lang)); }
function pickVoice(){
  if(!VOICES.length) loadVoices();
  const want=(DATA.settings.ttsVoice||'').trim();
  if(want){ const v=VOICES.find(v=>v.name===want); if(v) return v; }
  // Siri voices are NOT usable by web speech on iOS — they play silent, so exclude them
  const en=enVoices().filter(v=>!/siri/i.test(v.name));
  const pref=[/samantha/i,/\bkaren\b/i,/\bmoira\b/i,/\bdaniel\b/i,/\baaron\b/i,/\bnicky\b/i,
    /google us english/i,/microsoft (aria|jenny|guy|sonia|libby)/i,/enhanced/i,/premium/i];
  for(const rx of pref){ const v=en.find(v=>rx.test(v.name)); if(v) return v; }
  return null;   // fall back to the browser default voice — reliably audible
}
function tuneUtter(u){ const v=pickVoice(); if(v) u.voice=v; u.rate=1.0; u.pitch=1.0; u.volume=1; return u; }
/* iOS blocks speech unless it was first unlocked inside a tap — call this from any button */
function warmTTS(){ try{ if('speechSynthesis'in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(e){} try{ if(typeof unlockAudio==='function') unlockAudio(); }catch(e){} }
/* ---- realistic online voices via Puter (Amazon Polly neural) — free, no API key ---- */
const CLOUD_VOICES=[
  {id:'Joanna',lang:'en-US',label:'Joanna · US female'},
  {id:'Matthew',lang:'en-US',label:'Matthew · US male'},
  {id:'Danielle',lang:'en-US',label:'Danielle · US female'},

function loadPuter(cb){ if(window.puter){ cb&&cb(); return; }
  if(!document.getElementById('puterjs')){ const s=document.createElement('script'); s.id='puterjs'; s.src='https://js.puter.com/v2/'; document.head.appendChild(s); }
  const t0=Date.now(), iv=setInterval(()=>{ if(window.puter){ clearInterval(iv); cb&&cb(); } else if(Date.now()-t0>9000){ clearInterval(iv); cb&&cb(); } },150);

function cloudVoiceOn(){ return !!(DATA.settings.useCloudVoice && window.puter && window.puter.ai && window.puter.ai.txt2speech); }
/* one reusable audio element, unlocked inside a tap so iOS lets us play later */
const SILENT_WAV='data:audio/wav;base64,UklGRuwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YcgAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
let _ttsAudio=null, _ttsUnlocked=false;
function ttsEl(){ if(!_ttsAudio){ _ttsAudio=new Audio(); _ttsAudio.preload='auto'; } return _ttsAudio; }
function unlockAudio(){ try{ const a=ttsEl(); if(_ttsUnlocked) return; a.src=SILENT_WAV; const p=a.play();
  if(p&&p.then) p.then(()=>{ _ttsUnlocked=true; }).catch(()=>{}); }catch(e){} }
function stopCloud(){ try{ const a=ttsEl(); a.onended=null; a.pause(); }catch(e){} }
function playCloudSrc(src, cb){
  const a=ttsEl();
  a.onended=()=>cb&&cb(); a.onerror=()=>cb&&cb();
  try{ a.src=src; const p=a.play(); if(p&&p.catch) p.catch(()=>cb&&cb()); }catch(e){ cb&&cb(); }
}
function cloudSpeak(text, cb){
  const ent=CLOUD_VOICES.find(v=>v.id===(DATA.settings.cloudVoice||'Joanna'))||CLOUD_VOICES[0];
  try{ stopCloud();
    window.puter.ai.txt2speech(stripMd(text).slice(0,2800), {voice:ent.id, engine:'neural', language:ent.lang})
      .then(audio=>{ const src=audio&&audio.src;
        if(src) playCloudSrc(src, cb);
        else { audio.onended=()=>cb&&cb(); const p=audio.play(); if(p&&p.catch) p.catch(()=>deviceSpeakThen(text,cb)); } })
      .catch(()=>deviceSpeakThen(text,cb));
  }catch(e){ deviceSpeakThen(text,cb); }
}
/* OpenAI voice (via the import server) for the tutor + card read-aloud, device fallback */
let _voiceUrl=null;
/* client-side voice cache so a clip that's been pre-fetched plays INSTANTLY (no 20s wait) */
var _ttsBlobCache={};
function _ttsKey(text,voice,use){ return (use||'read')+'|'+(voice||'')+'|'+stripMd(text).slice(0,3000); }
window._ttsHas=function(text,use){ try{ return !!_ttsBlobCache[_ttsKey(text, DATA.settings.ttsVoiceAI||'nova', use)]; }catch(e){ return false; } };
/* fetch + cache a clip WITHOUT playing it — used to pre-generate narration ahead of play */
var _ttsPending={};   // key -> in-flight promise, so the same line is never generated (and paid for) twice
async function _warmSpeakOnce(text, use, key, voice){
  try{
    const CFG=window.MEDBANK_CONFIG||{};
    const ses=await window.__mbSB.auth.getSession(); const token=ses.data.session&&ses.data.session.access_token; if(!token) return;
    const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/tts',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({text:stripMd(text).slice(0,3000),voice:voice,use:(use||'read')})});
    if(!r.ok) return; _ttsBlobCache[key]=URL.createObjectURL(await r.blob());
  }catch(e){}
}
window.warmSpeak=function(text, use){
  try{
    const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API||!window.__mbSB||!(text||'').trim()) return Promise.resolve();
    const voice=DATA.settings.ttsVoiceAI||'nova', key=_ttsKey(text,voice,use);
    if(_ttsBlobCache[key]) return Promise.resolve();
    if(_ttsPending[key]) return _ttsPending[key];                     // already being generated → wait on that one
    const p=_warmSpeakOnce(text,use,key,voice).then(function(){ delete _ttsPending[key]; },function(){ delete _ttsPending[key]; });
    _ttsPending[key]=p; return p;
  }catch(e){ return Promise.resolve(); }
};
async function serverSpeak(text, cb, use){
  try{
    const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API||!window.__mbSB) return false;
    const voice=DATA.settings.ttsVoiceAI||'nova', key=_ttsKey(text,voice,use);
    if(_ttsBlobCache[key]){ playCloudSrc(_ttsBlobCache[key], cb); return true; }   // already generated → instant
    const ses=await window.__mbSB.auth.getSession(); const token=ses.data.session&&ses.data.session.access_token; if(!token) return false;
    const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/tts',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({text:stripMd(text).slice(0,3000),voice:voice,use:(use||'read')})});
    if(!r.ok) return false;
    _ttsBlobCache[key]=URL.createObjectURL(await r.blob()); playCloudSrc(_ttsBlobCache[key], cb); return true;   // cache so replays are instant
  }catch(e){ return false; }
}
function voiceSpeak(text, cb, use){
  unlockAudio();

/* Pre-fetch an AI-voice clip WITHOUT playing it. Resolves to {play, cancel} once the audio is ready,
   so a caller (e.g. the study genie) can reveal itself and start the voice at the same instant. */
window.mbPrepareVoice = async function(text){

    const ses=await window.__mbSB.auth.getSession(); const token=ses.data.session&&ses.data.session.access_token; if(!token) return null;
    const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/tts',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({text:stripMd(text).slice(0,600),voice:(DATA.settings&&DATA.settings.ttsVoiceAI)||'nova',use:'read'})});
    if(!r.ok) return null;

             cancel:function(){ try{stopCloud();}catch(e){} try{URL.revokeObjectURL(url);}catch(e){} } };
  }catch(e){ return null; }
};

/* build today's cross-topic Recall queue from started topics only */
/* new cards for today come ONLY from the weekly plan: top 5 topics per course, each in order, interleaved,
   capped at the per-course daily new-card goal (default 20). Once answered a card is no longer "new". */
function planNew(){
  const goal=DATA.daily.courseGoal||20, out=[], doneToday=(todayLog().new)||{};
  DB.subjects.forEach(sb=>{
    const cap=Math.max(0, goal-(doneToday[sb.id]||0)); if(!cap) return;
    const qs=[];
    (DATA.plan||[]).forEach(id=>{ if(qs.length>=5) return; const t=topById(id);
      if(!t||!t.ready||t.subject.id!==sb.id) return;
      const unseen=(t.recall||[]).filter(c=>{ const id=cid(t.id,'recall',c); return !DATA.cards[id] && !isFlagged(id); });   // cards reported wrong are hidden from study
      if(unseen.length) qs.push({t,cards:unseen}); });
    let added=0, guard=0;
    while(added<cap && guard++<2000){ let any=false;
      for(const q of qs){ if(added>=cap) break; if(q.cards.length){ const c=q.cards.shift();
        out.push({t:q.t,c,id:cid(q.t.id,'recall',c),deck:'recall',isNew:true}); added++; any=true; } }
      if(!any) break; }
  });
  // Supply must always reach the streak floor (so the daily new-card requirement is never unmeetable when unseen
  // cards exist); on lighter days the adaptive cap can offer MORE than the floor as a recommendation. PRG-01.
  const floorRemain=Math.max(0, dailyNewTarget()-newDoneToday());
  const adaptRemain=Math.max(0, effectiveNewCap()-newDoneToday());
  const remain=Math.max(floorRemain, adaptRemain);
  return out.slice(0, remain);
}
function planCount(){ return (DATA.plan||[]).filter(id=>{const t=topById(id);return t&&t.ready;}).length; }
function buildQueue(){
  const today=dayNum(), due=[];

    const id=cid(t.id,'recall',c), st=DATA.cards[id];
    if(st && st.due<=today && !isFlagged(id)) due.push({t,c,id});   // cards reported wrong are hidden from study
  }));
  const neu=planNew();
  return { due:orderItems(due), neu, newTotal:neu.length };
}

const SEC_PER_CARD=20;
function estMin(n){ return Math.max(1, Math.round(n*SEC_PER_CARD/60)); }
/* a due card's review-age bucket, from its SRS box */
function reviewBucket(box,starred){
  if(starred || box<0) return 'hard';
  if(box==null) return 'd1';         // card state written without a box (e.g. a Visualize-quiz card) — treat as just-learned, NOT as a 2-week review
  if(box<=0) return 'd1';            // 24-hour (just learned / relapsed-then-passed) — LADDER 1 day
  if(box===1) return 'd3';           // 3-day — LADDER 3 days
  if(box>=2 && box<=4) return 'wk';  // weekly — LADDER 7 days
  return 'fn';                       // 2-week — LADDER 14 days
}
const BUCKETS=[
  {k:'hard', ic:'🔴', label:'Hard cards'},
  {k:'new',  ic:'🆕', label:'New cards'},
  {k:'d1',   ic:'🟡', label:'24-hour reviews'},
  {k:'d3',   ic:'🔵', label:'3-day reviews'},
  {k:'wk',   ic:'🟢', label:'Weekly reviews'},
  {k:'fn',   ic:'🟣', label:'2-week reviews'},

/* build a categorised, time-budgeted Active Recall session */
function buildRecallSession(){
  const today=dayNum(), due=[];
  startedTopics().forEach(t=>(t.recall||[]).forEach(c=>{
    const id=cid(t.id,'recall',c), s=DATA.cards[id];
    if(isFlagged(id)) return;                        // cards reported wrong are hidden from study
    if(s){ if(s.due<=today){ due.push({t,c,id,deck:'recall',box:s.box,starred:!!DATA.starred[id]}); } }
  }));
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
  const hard=sh(due.filter(x=>x.starred||x.box<0));
  const reviews=sh(due.filter(x=>!(x.starred||x.box<0))).sort((a,b)=>a.box-b.box); // youngest interval first
  const news=planNew();
  // exam-aware: if an exam is within ~3 weeks, float that subject's cards to the front of each tier (stable sort keeps order otherwise)
  const _ew=(x)=>{ const d=examDays(x.t&&x.t.subject&&x.t.subject.id); return (d==null||d<0)?9999:d; };
  if(DB.subjects.some(s=>{const d=examDays(s.id);return d!=null&&d>=0&&d<=21;})){
    hard.sort((a,b)=>_ew(a)-_ew(b)); reviews.sort((a,b)=>_ew(a)-_ew(b)); news.sort((a,b)=>_ew(a)-_ew(b));
  }
  const ordered=hard.concat(reviews,news);
  // TIME BUDGET (minutes) — fill greedily by MEASURED per-card time (rolling median); card count is the OUTPUT
  const budget=DATA.daily.budget||15;
  let capped=ordered, over=0, estMs=0;
  if(budget>0){ const budgetMs=budget*60000; let cut=ordered.length;
    for(let k=0;k<ordered.length;k++){ const t=estCardMs(ordered[k].id,false);
      if(estMs+t<=budgetMs || k===0){ estMs+=t; } else { cut=k; break; } }   // never overfill (always ≥1 card)
    capped=ordered.slice(0,cut); over=ordered.length-cut;
  } else { estMs=ordered.reduce((a,x)=>a+estCardMs(x.id,false),0); }
  // confidence check: up to 5 mastered (box>=3), not currently due, not already in session
  const inSess=new Set(capped.map(x=>x.id)), mastered=[];
  startedTopics().forEach(t=>(t.recall||[]).forEach(c=>{
    const id=cid(t.id,'recall',c), s=DATA.cards[id];
    if(s&&s.box>=3&&s.due>today&&!inSess.has(id)&&!isFlagged(id)) mastered.push({t,c,id,deck:'recall',conf:true});
  }));
  const conf=sh(mastered).slice(0,5);
  // per-bucket counts (from the capped set)
  const counts={hard:0,new:0,d1:0,d3:0,wk:0,fn:0,conf:conf.length};
  capped.forEach(x=>{ if(x.isNew) counts.new++; else counts[reviewBucket(x.box,x.starred)]++; });
  return {hard,reviews,news,capped,over,conf,counts,estMs,budget,
    totalCards:capped.length+conf.length};
}
/* review health: how caught-up the whole system is.
   dueNow = due today or earlier; overdue = strictly past their date (you fell behind). */
function reviewHealth(){
  const today=dayNum(); let dueNow=0, overdue=0; const waiting=new Set();
  startedTopics().forEach(t=>(t.recall||[]).forEach(c=>{
    const s=DATA.cards[cid(t.id,'recall',c)];
    if(s&&s.due<=today && !isFlagged(cid(t.id,'recall',c))){ dueNow++; waiting.add(t.id); if(s.due<today) overdue++; }   // SL-02: the tile must match the servable pool
  }));
  const goal=DATA.daily.goal||40;
  let pct = overdue===0 ? 100 : Math.max(20, Math.round(100 - overdue/(2*goal)*100));
  const st = pct>=85 ? {k:'good',ic:'🟢',label:'On schedule'}
           : pct>=60 ? {k:'ok',  ic:'🟡',label:'Slightly behind'}
           :            {k:'bad', ic:'🔴',label:'Falling behind'};
  return {pct,dueNow,overdue,hard:starCount(),topicsWaiting:waiting.size,status:st};
}

const STAGE_NAMES=['Learning','24-hour','3-day','Weekend','Weekly','Long-term'];
function topicStage(t){
  const rc=t.recall||[]; if(!rc.length) return -1;
  // only STUDIED cards count: a Visualize-quiz card (:addVizCard) has a state row with no `box`,
  // and Math.max(0,undefined) is NaN — one of those used to make the whole pipeline render blank.
  const seen=rc.map(c=>DATA.cards[cid(t.id,'recall',c)]).filter(s=>s&&typeof s.box==='number'&&!isNaN(s.box));
  if(!seen.length) return -1;
  const avg=seen.reduce((a,s)=>a+Math.max(0,s.box),0)/seen.length;
  const st=Math.round(avg);
  return isNaN(st)?-1:Math.min(5, st);
}

  }));

}

function heatmap(){
  const weeks=18, cols=[]; const today=new Date();
  const start=new Date(today); start.setDate(start.getDate()-(weeks*7-1));
  start.setDate(start.getDate()-start.getDay());   // back to Sunday
  let max=1; Object.values(DATA.log).forEach(l=>{ if(l.cards>max)max=l.cards; });
  for(let w=0;w<weeks+1;w++){
    let col='';
    for(let d=0;d<7;d++){
      const dt=new Date(start); dt.setDate(start.getDate()+w*7+d);
      if(dt>today){ col+='<i class="hc off"></i>'; continue; }
      const n=(DATA.log[dstr(dt)]||{}).cards||0;
      const lv=n===0?0:n<8?1:n<20?2:n<40?3:4;
      col+=`<i class="hc l${lv}" title="${dstr(dt)}: ${n} cards"></i>`;
    }
    cols.push('<div class="hcol">'+col+'</div>');
  }
  return `<div class="heat">${cols.join('')}</div>`;
}

function createFolderWith(topicId){

  const f={ id:'f'+Date.now().toString(36), name:nm.trim(), topics:topicId?[topicId]:[] };

  if(topicId){ alert('Created “'+f.name+'” and added this topic.'); } render();

function renameFolder(id){ const f=(DATA.folders||[]).find(x=>x.id===id); if(!f) return; const n=prompt('Rename folder', f.name); if(n==null) return; f.name=(n.trim()||f.name); persist(); render(); }

function addToFolderPrompt(topicId){
  const fs=DATA.folders||[];
  if(!fs.length){ createFolderWith(topicId); return; }
  let msg='Add this topic to which folder?\n\nType the NUMBER, then OK.\n\n0. + New folder\n'; fs.forEach((f,i)=>{ msg+=(i+1)+'. '+f.name+(((f.topics||[]).indexOf(topicId)>=0)?'  ✓ already in':'')+'\n'; });
  const pick=prompt(msg); if(pick==null) return;
  const n=parseInt(pick,10);
  if(n===0){ createFolderWith(topicId); return; }
  const f=fs[n-1];

  if(!f){ alert('Type the number next to the folder (1–'+fs.length+'), or 0 for a new folder.'); return; }

  if(f.topics.indexOf(topicId)<0){ f.topics.push(topicId); persist(); alert('Added to “'+f.name+'”.'); } else { alert('Already in “'+f.name+'”.'); }

function pageSolve(){
  return `<h1>🧮 Solve</h1>
    <p class="sub">Snap or upload a question — an MCQ, a past question, or a diagram — and get the answer explained step by step.</p>
    <div class="card" style="cursor:default">
      <label style="font-size:12.5px;font-weight:700;color:var(--dim)">Photo of the question</label>
      <input id="solveImg" type="file" accept="image/*" style="width:100%;font-size:14px;margin-top:6px" onchange="solvePreview()">
      <div id="solvePrev" style="margin-top:10px"></div>
      <textarea id="solveText" class="notebox" rows="2" placeholder="Optional — type the question, or add context…" style="margin-top:12px"></textarea>
      <div class="btnrow" style="margin-top:12px"><button class="btn primary" id="solveBtn" onclick="solveNow()">Solve it</button></div>
      <div id="solveMsg" style="margin-top:8px;font-size:13px;color:var(--dim)"></div>
    </div>
    <div id="solveOut" style="margin-top:16px"></div>`;
}
function solvePreview(){
  const fEl=document.getElementById('solveImg'), f=fEl&&fEl.files[0], p=document.getElementById('solvePrev');
  if(!f){ p.innerHTML=''; return; }
  p.innerHTML='<img src="'+URL.createObjectURL(f)+'" style="max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line)">';
}
function fileToB64solve(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function solveNow(){
  const fEl=document.getElementById('solveImg'), f=fEl&&fEl.files[0];
  const text=(document.getElementById('solveText').value||'').trim();
  const msg=document.getElementById('solveMsg'), out=document.getElementById('solveOut'), btn=document.getElementById('solveBtn');
  if(!f && !text){ msg.textContent='Add a photo or type the question first.'; return; }
  if(window.MB_PAYWALL && !MB_PAYWALL.guard('Solve')) return;   // PW-01: gate before the photo upload, not after
  btn.disabled=true; btn.textContent='Solving… ~10s'; msg.textContent=''; out.innerHTML='';
  try{
    const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API) throw new Error('Not configured yet.');
    let token=null; if(window.__mbSB){ const ses=await window.__mbSB.auth.getSession(); token=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:null; }
    /* Without this we sent the literal header "Bearer null" and the server's raw "not signed in"
     * was shown to the student as if it were the verdict on their question. */
    if(!token) throw new Error("You're signed out — sign in and try again.");
    const body={ text }; if(f){ body.image_base64=await fileToB64solve(f); body.media_type=f.type||'image/jpeg'; }
    const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/solve',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});
    /* A proxy 413/502/504 answers with HTML, not JSON: r.json() then threw and the student saw
     * "Unexpected token '<'". Read the status instead. */
    let o=null; try{ o=await r.json(); }catch(_){ o=null; }
    if(!o) throw new Error(r.status===413 ? 'That photo is too large — retake it at a lower resolution.'
                                          : 'The Solve server didn\'t respond properly ('+r.status+'). Try again in a moment.');
    if(!r.ok && (o.error==='upgrade' || r.status===402)){
      const why=o.reason||'Subscribe to snap and solve any question.';
      /* paywall.js may not have loaded — without this else the button just re-enabled and nothing
       * at all appeared, so "Solve it" looked like a dead button. */
      if(window.MB_PAYWALL) MB_PAYWALL.nudge('Solve is premium', why, 'Subscribe');
      else msg.innerHTML='<span style="color:#ff9db1">'+esc(why)+'</span>';
      return; }
    if(!r.ok||!o.answer) throw new Error(o.reason||o.error||'Could not solve this — try a clearer photo.');
    out.innerHTML='<div class="card" style="cursor:default"><div class="md">'+md(o.answer)+'</div></div>';
  }catch(e){ msg.innerHTML='<span style="color:#ff9db1">'+esc(e.message||'Something went wrong')+'</span>'; }
  finally{ btn.disabled=false; btn.textContent='Solve it'; }
}

let topicTab='note', topicTabFor=null;
/* ===== Topic Preview — the pre-read "orientation video" (SPEC-TOPIC-PREVIEW.md; flag-gated) ===== */
var _PREVIEW={};   // in-memory per-topic cache (kept OUT of DATA so big blueprints never bloat the synced blob)
function previewOn(){ try{ var C=window.MEDBANK_CONFIG||{}; return !!(C.FEATURES&&C.FEATURES.TOPIC_PREVIEW); }catch(e){ return false; } }
function ensureTopicPreview(t){
  if(!previewOn()||!t||!t.id||_PREVIEW[t.id]) return;
  var note=(t.note||''); if(note.replace(/\s+/g,' ').trim().length<400){ _PREVIEW[t.id]={status:'skipped'}; return; }
  _PREVIEW[t.id]={status:'building'};                                      // first note-open → build quietly in the background
  (async function(){
    try{
      var CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API||!window.__mbSB){ _PREVIEW[t.id]={status:'failed'}; return; }
      var ses=await window.__mbSB.auth.getSession(); var token=ses.data.session&&ses.data.session.access_token;
      if(!token){ _PREVIEW[t.id]={status:'failed'}; return; }
      var r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/topic-preview',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({topic_id:t.id})});
      var j=null; try{ j=await r.json(); }catch(e){}
      _PREVIEW[t.id]=(j&&j.status)?j:{status:'failed'};
      try{ if(window.smartLog&&j&&j.status==='ready') smartLog({t:'preview_generated', topic_id:t.id, scenes:(j.scenes||[]).length}); }catch(e){}
    }catch(e){ _PREVIEW[t.id]={status:'failed'}; }
    try{ if((location.hash||'').indexOf(t.id)>=0 && (window.scrollY||window.pageYOffset||0) < 240) render(); }catch(e){}     // refresh the card when ready — but never yank a student who's already scrolled into the note
  })();
}
function retryTopicPreview(tid){ try{ delete _PREVIEW[tid]; }catch(e){} var t=topById(tid); if(t){ ensureTopicPreview(t); render(); } }
function topicPreviewCard(t){
  if(!previewOn()||!t) return '';
  var pv=_PREVIEW[t.id]||{status:'building'};
  if(pv.status==='skipped') return '';                                     // note too short → nothing to show
  if(pv.status==='failed'){                                                // don't vanish silently — offer a retry
    return '<div class="tpv-card"><div class="tpv-poster" style="height:96px">'
      + '<span class="tpv-chip">▶ PREVIEW</span>'
      + '<button class="tpv-play" style="width:44px;height:44px;font-size:17px" onclick="retryTopicPreview(\''+t.id+'\')" aria-label="Retry preview">↻</button></div>'
      + '<div class="tpv-meta"><div class="tpv-t">Preview couldn\'t build</div><div class="tpv-s">Tap ↻ to try again.</div></div></div>';
  }
  var ready=(pv.status==='ready' && pv.scenes && pv.scenes.length);
  var center = ready
    ? '<button class="tpv-play" aria-label="Watch the preview" onclick="playTopicPreview(\''+t.id+'\')">▶</button>'
    : '<div class="tpv-prep"><div class="tpv-spin"></div>Preparing your preview…</div>';
  return '<div class="tpv-card">'
    + '<div class="tpv-poster'+(ready?" ready":"")+'"'+(ready?" onclick=\"playTopicPreview('"+t.id+"')\"":"")+'>'
    +   '<span class="tpv-chip">▶ PREVIEW</span><span class="tpv-dur">~3 min · visual + narrated</span>'+center
    + '</div>'
    + '<div class="tpv-meta"><div class="tpv-t">Get the picture first</div>'
    +   '<div class="tpv-s">A quick visual tour of '+esc(t.name||'this topic')+' — build a mental map before you read.</div></div>'
    + '</div>';
}
function playTopicPreview(tid){
  var pv=_PREVIEW[tid];
  if(!pv||pv.status!=='ready'||!pv.scenes||!pv.scenes.length){ if(window.mbToast)mbToast('Your preview is still building — one moment.'); return; }
  try{ if(window.smartLog) smartLog({t:'preview_shown', topic_id:tid}); }catch(e){}
  if(window.MB_playPreview) window.MB_playPreview(pv.scenes, tid);
}
function pageTopic(id){

  // spaced-repetition pipeline

    pipeline = `<div class="pipe">${steps.map((s,i)=>{
      const done=i<activeIdx, on=i===activeIdx;

/* In-note trigger. Not "this note mentions anatomy" but "this sentence describes something a flat page

 * MB3D.planNote() from the note's own length, the spacing between opportunities and how many structures
 * belong to one idea — not by a number hard-coded here. Tune it with MB3D.policy({...}). */
function mb3dScanNote(){
  if(!mb3dOn()) return;
  var host=document.querySelector('#main .notebody'); if(!host) return;
  if(host.getAttribute('data-mb3d')==='1') return;                       // scan a rendered note once, never twice
  var list=[]; try{ list=MB3D.terms(); }catch(e){}
  if(!list.length){ try{ MB3D.loadIndex().then(function(){ setTimeout(mb3dScanNote,0); }).catch(function(){}); }catch(e){} return; }
  host.setAttribute('data-mb3d','1');
  var passages=[], w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,null), n;
  while(n=w.nextNode()){
    var pe=n.parentElement;
    if(!pe || !pe.closest || pe.closest('.mb3dmark,.vizmark,code,pre,a,button,h1,h2')) continue;
    passages.push({text:n.nodeValue, ref:n});
  }
  var plan=[]; try{ plan=MB3D.planNote(passages)||[]; }catch(e){ return; }
  var byNode={};                                                          // one chip per text node keeps offsets valid
  plan.forEach(function(op){
    var node=op.ref; if(!node || !node.parentNode || byNode[nodeKey(node)]) return;
    if(node.nodeValue.slice(op.index,op.index+op.match.length).toLowerCase()!==op.match.toLowerCase()) return;  // offset drifted — skip rather than corrupt the note
    byNode[nodeKey(node)]=1;
    var before=node.nodeValue.slice(0,op.index), hit=op.match, after=node.nodeValue.slice(op.index+hit.length);
    var frag=document.createDocumentFragment();
    if(before) frag.appendChild(document.createTextNode(before));
    var mark=document.createElement('span'); mark.className='mb3dmark'; mark.textContent=hit;
    mark.style.cssText='border-bottom:1.5px dotted var(--accent)';
    var chip=document.createElement('button'); chip.className='mb3dchip';
    chip.textContent=op.related?('👁 3D · +'+op.related):'👁 3D';
    chip.title='See '+hit+' in 3D — '+op.why+(op.related?(' (with '+op.related+' related structure'+(op.related===1?'':'s')+')'):'');
    chip.style.cssText='margin-left:5px;font:inherit;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;vertical-align:middle';
    chip.onclick=(function(op,label){ return function(e){ e.stopPropagation();
      try{ MB3D.recordEngagement('opened'); MB3D.open(op.scene,{part:op.key,title:label,subtitle:'from your note'}); }catch(err){} }; })(op,hit);
    frag.appendChild(mark); frag.appendChild(chip);
    if(after) frag.appendChild(document.createTextNode(after));
    node.parentNode.replaceChild(frag,node);
  });
  if(plan.length){ try{ MB3D.recordEngagement('shown', plan.length); }catch(e){} }
}

async function buildExtraNow(topicId,kind,force,_retry){
  const t=topById(topicId); if(!t) return null;
  if(!_retry && window.MB_PAYWALL && !MB_PAYWALL.guard('Building this')) return null;   // PW-01: gate the build (fails open until entitlement known; not re-run on the 502 retry)
  const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API) throw new Error('Not configured yet.');
  let token=null; if(window.__mbSB){ const ses=await window.__mbSB.auth.getSession(); token=ses.data.session&&ses.data.session.access_token; }
  const level=(window.MB_SYNC&&MB_SYNC.currentLevel&&MB_SYNC.currentLevel())||null;
  const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/build-extra',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({topic_id:topicId,kind,level,force:!!force})});
  if((r.status===502||r.status===503||r.status===504) && !_retry){ await new Promise(s=>setTimeout(s,2800)); return buildExtraNow(topicId,kind,force,true); }   // Render cold-start → auto-retry once
  // the proxy answers 413/502/504 with an HTML page, and r.json() on that used to surface to the
  // student as "Unexpected token '<'" — read text first and turn a non-JSON body into a real message
  let out={}; const raw=await r.text().catch(()=>'');
  try{ out=JSON.parse(raw||'{}'); }
  catch(e){ throw new Error(r.status===413?'That note is too large to build from.':'The build server is busy right now — try again in a minute.'); }
  if(!r.ok||!out.items) throw new Error(out.reason||out.error||'Could not build this.');
  t.extras=t.extras||{}; t.extras[kind]=out.items;   // cache locally → instant next time (server also saved it)
  // QB-06: a partial build isn't persisted server-side; keep a session-only flag so the page can offer a rebuild
  // for the full set. Cleared on a complete build. (On next app load the server has no cache → a fresh build runs.)
  if(kind==='qbank'){ if(out.partial) t._qbPartial=out.items.length; else delete t._qbPartial; }
  return out.items;
}

function adaptAdjust(r){ var A=QB.adaptive; A.hist.push(!!r.ok);

  score += r.ok ? W.acc : -W.acc;
  // PRIMARY — confidence: confidently right earns promotion; confidently wrong is a misconception signal → ease
  if(r.ok && r.conf===3) score += W.conf;
  if(!r.ok && r.conf===3) score -= W.conf;
  // Guessing guard: "correct + fast" is NOT mastery. A self-declared guess cancels half the accuracy push,
  // so a lucky/uncertain right answer can't ratchet difficulty up on its own.
  if(r.ok && r.conf===0) score -= W.acc*0.5;

async function admApi(path,opts){
  const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API) throw new Error('Import server not configured.');
  let token=null; if(window.__mbSB){ const ses=await window.__mbSB.auth.getSession(); token=ses.data.session&&ses.data.session.access_token; }
  opts=opts||{}; opts.headers=Object.assign({'Authorization':'Bearer '+token},opts.headers||{});
  const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+path,opts); return {ok:r.ok, data:await r.json()};
}
let ADM_DEFAULT='';
async function admFetch(){
  const kEl=$('#admKind'); if(!kEl) return;
  const kind=kEl.value, level=$('#admLevel').value, st=$('#admStatus');
  if(st) st.textContent='Loading…';
  try{
    const r=await admApi('/admin/prompt?kind='+encodeURIComponent(kind)+(level?'&level='+encodeURIComponent(level):''));
    if(!r.ok) throw new Error((r.data&&r.data.error)||'load failed');
    const row=r.data.row; ADM_DEFAULT=r.data.defaultPrompt||'';
    $('#admPrompt').value = row?(row.template||''):'';
    $('#admModel').value = (row&&row.model)||''; $('#admMax').value=(row&&row.max_tokens)||''; $('#admTemp').value=(row&&row.temperature!=null)?row.temperature:'';
    if(st) st.textContent = row ? '✎ Editing the saved prompt for this build + level.'
      : (level ? 'No prompt set for this level — imports here fall back to Default. Save to create one.'
               : 'No Default saved — the built-in default is used. Save to create one.');
  }catch(e){ if(st) st.textContent='Could not load: '+(e.message||e); }
}
function admLoadDefault(){ if(ADM_DEFAULT){ $('#admPrompt').value=ADM_DEFAULT; } else { alert('No built-in default for this build. (Core uses your existing DB prompt.)'); } }
async function admSave(){
  const msg=$('#admMsg'); if(msg) msg.textContent='Saving…';
  const body={ kind:$('#admKind').value, level:$('#admLevel').value||null, template:$('#admPrompt').value,
    model:$('#admModel').value||null, max_tokens:$('#admMax').value||null, temperature:$('#admTemp').value||null };
  if(!body.template.trim()){ if(msg) msg.innerHTML='<span style="color:#ff9db1">Prompt can’t be empty.</span>'; return; }
  try{
    const r=await admApi('/admin/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error((r.data&&r.data.error)||'save failed');
    if(msg) msg.innerHTML='<span style="color:var(--recall);font-weight:700">✓ Saved. New imports at this level use it right away.</span>';
  }catch(e){ if(msg) msg.innerHTML='<span style="color:#ff9db1">Could not save: '+esc(e.message||e)+'</span>'; }
}

function taRenderStats(d){ var el=$('#taStats'); if(!el)return; var cd=d.confidenceDistribution||{};

   +qbKpi(d.processed||0,'Processed','questions annotated','var(--text)')
   +qbKpi((d.matchPct||0)+'%','Match','existing target','#0d9488')
   +qbKpi((d.newPct||0)+'%','New','target created','#3b82f6')
   +qbKpi((d.ambiguousPct||0)+'%','Ambiguous',(d.unresolvedAmbiguous||0)+' unresolved','#c98a00')

   +'</div>'
   +'<div class="sub" style="margin-top:8px">Confidence — &lt;45%: '+(cd.lt45||0)+' · 45–80%: '+(cd['45to80']||0)+' · ≥80%: '+(cd.gte80||0)

   +(d.resolved?(' · resolved by you: '+d.resolved):'')+'</div>'
   +'<div class="sub" style="margin-top:4px">Near-miss net — '+(d.newWithCandidate||0)+' NEW-with-candidate · <b>'+(d.ambiguousFromNearMiss||0)+'</b> routed to AMBIGUOUS by the safety net'+((d.confirmedMatch||d.confirmedNew)?(' · you confirmed: '+(d.confirmedMatch||0)+' match / '+(d.confirmedNew||0)+' new'):'')+'</div>';

function taRenderAmb(items){ var el=$('#taAmb'); if(!el)return;

  el.innerHTML=items.map(function(it){
    var p=it.proposed||{};

      return '<div class="ta-cand" style="border:1px solid var(--line,#e3e0ef);border-radius:10px;padding:9px 11px;margin:6px 0">'
        +'<b>'+esc(c.target_id||'?')+'</b> <span class="sub">('+(c.score!=null?Math.round(c.score*100)+'%':'—')+')</span><br>'
        +'<span class="sub">'+esc(t.canonical_statement||'(no statement)')+'</span><br>'
        +'<button class="btn sm" style="margin-top:6px" onclick="taResolve(\''+it.qh+'\',\'match\',\''+esc(c.target_id)+'\')">Match this target</button></div>'; }).join('');
    return '<div class="card" style="cursor:default;margin-bottom:12px">'
      +((it.decision&&it.decision.near_miss)?('<div class="sub" style="background:#fff6e6;border:1px solid #f3d79a;color:#8a5a12;border-radius:8px;padding:6px 9px;margin-bottom:8px">\u26a0 Near-miss: the model judged <b>NOT the same</b>, but the nearest candidate scored '+(it.decision.nearest_candidate_score!=null?Math.round(it.decision.nearest_candidate_score*100)+'%':'\u2014')+' \u2014 the safety net flagged it for review rather than silently forking a new target. (Never auto-merged.)</div>'):'')
      +'<div><b>Proposed target:</b> '+esc(p.knowledge_statement||'')+'</div>'
      +'<div class="sub" style="margin:3px 0 8px">'+esc(p.topic||'')+' · '+esc(p.subtopic||'')+' · '+esc(p.skill||'')+' · overall conf '+(it.confidence!=null?Math.round(it.confidence*100)+'%':'—')+'</div>'
      +'<div class="sub" style="font-weight:700">Candidate existing targets:</div>'
      +(cands||'<span class="sub">no candidates in this topic+skill</span>')

async function taRetestFetch(btn){ if(btn){btn.disabled=true;btn.textContent='Loading…';} try{

  var reasons=Object.keys(d.invalidReasons||{}).map(function(k){return k+': '+d.invalidReasons[k];}).join(' · ')||'—';
  var col=function(x){ return x==='candidate'?'#0a9d55':x==='served'?'#2563eb':x==='invalid'?'#c0392b':x==='quarantined'?'#b7791f':'#888'; };
  var rows=items.slice(0,80).map(function(x){
