function genPrompt(topicId,kind,label){
  return `<div class="empty" style="text-align:center">
    <b style="color:var(--text)">${label} isn't built for this lecture yet.</b>
    <p style="color:var(--dim);margin:8px 0 16px">Build it once from your note — takes a few seconds, then it's saved to your account.</p>
    <button class="btn primary" onclick="genExtra('${topicId}','${kind}',this)">✨ Build ${label}</button></div>`;
}
async function buildExtraNow(topicId,kind,force,_retry){
  const t=topById(topicId); if(!t) return null;
  const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API) throw new Error('Not configured yet.');
  let token=null; if(window.__mbSB){ const ses=await window.__mbSB.auth.getSession(); token=ses.data.session&&ses.data.session.access_token; }
  const level=(window.MB_SYNC&&MB_SYNC.currentLevel&&MB_SYNC.currentLevel())||null;
  const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/build-extra',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({topic_id:topicId,kind,level,force:!!force})});
  if((r.status===502||r.status===503||r.status===504) && !_retry){ await new Promise(s=>setTimeout(s,2800)); return buildExtraNow(topicId,kind,force,true); }   // Render cold-start → auto-retry once
  const out=await r.json();
  if(!r.ok||!out.items) throw new Error(out.reason||out.error||'Could not build this.');
  t.extras=t.extras||{}; t.extras[kind]=out.items;   // cache locally → instant next time (server also saved it)
  return out.items;
}
async function genExtra(topicId,kind,btn){
  if(btn){ btn.disabled=true; btn.textContent='Preparing… ~5s'; }
  try{ await buildExtraNow(topicId,kind); render(); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent='Try again'; } mbToast('Build failed: '+(e.message||'check your internet and try again.')); }
}
async function rebuildExtra(topicId,kind,btn){
  if(btn){ btn.disabled=true; btn.textContent='Rebuilding… ~5s'; }
  try{ const t=topById(topicId); if(t&&t.extras) delete t.extras[kind]; await buildExtraNow(topicId,kind,true); render(); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent='↻ Rebuild'; } mbToast('Rebuild failed: '+(e.message||'try again')); }
}

let FIBITEMS=[];
function renderFillBlank(t){
  const raw=(t.extras&&t.extras.fill_blank)||null;
  if(!raw||!raw.length) return genPrompt(t.id,'fill_blank','Fill-in-the-blank');
  const items=raw.filter(it=>it&&/_{2,}/.test(it.text||'')&&String(it.answer||'').trim());   // drop malformed items (no blank)
  const rebuild=`<div class="btnrow" style="justify-content:flex-end;margin-bottom:10px"><button class="btn" style="font-size:12.5px" onclick="rebuildExtra('${t.id}','fill_blank',this)">↻ Rebuild</button></div>`;
  if(!items.length) return rebuild+`<div class="empty" style="text-align:left"><b style="color:var(--text)">This set came out malformed.</b><p style="color:var(--dim);margin:8px 0 0">Tap <b>↻ Rebuild</b> above to regenerate the fill-in-the-blanks.</p></div>`;
  FIBITEMS=items;
  return rebuild + items.map((it,i)=>{
    const q=esc(it.text||'').replace(/_{2,}/,`<input id="fib_${i}" placeholder="answer" onkeydown="if(event.key==='Enter')fibCheck(${i})" style="border:none;border-bottom:2px solid var(--recall);background:transparent;color:var(--text);font-size:15px;min-width:90px;padding:0 4px;outline:none">`);
    return `<div class="card" style="cursor:default;margin-bottom:12px">
      <div style="font-size:15px;line-height:1.6">${q}</div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn primary" onclick="fibCheck(${i})">Check</button>
        ${it.hint?`<button class="btn" onclick="fibHint(${i})">Need a hint?</button>`:''}</div>
      <div id="fibr_${i}" style="margin-top:10px;font-size:14px"></div></div>`;
  }).join('');
}
function fibNorm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
function fibCheck(i){
  const it=FIBITEMS[i]; if(!it) return;
  const el=document.getElementById('fib_'+i), res=document.getElementById('fibr_'+i);
  const val=el?el.value:''; const ok=fibNorm(val)===fibNorm(it.answer);
  if(el){ el.style.borderColor= ok?'var(--recall)':'#ff6b81'; }
  res.innerHTML = ok
    ? `<span style="color:var(--recall);font-weight:700">✓ Correct</span>`
    : `<span style="color:#ff9db1;font-weight:700">✗ Not quite</span> — the answer is <b>${esc(it.answer)}</b>`;
}
function fibHint(i){ const it=FIBITEMS[i]; if(!it) return; document.getElementById('fibr_'+i).innerHTML=`<span style="color:var(--dim)">💡 ${esc(it.hint||'No hint for this one.')}</span>`; }

  if(POD.topicId!==id){ podStopAudio(); POD={ topicId:id, topicName:name||'', lines:null, urls:null, voices:POD.voices||null, voiceA:POD.voiceA||null, voiceB:POD.voiceB||null, i:0, playing:false, speed:1, phase:'load', raise:false }; podLoadScript(id); return; }
  podPaint();
}
async function podLoadScript(id){
  POD.phase='load'; podPaint();
  try{
    const r=await podApi('/podcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic_id:id,level:podLevel()})});
    if(!r.ok||!r.data.lines) throw new Error((r.data&&(r.data.reason||r.data.error))||'Could not write the script.');
    POD.lines=r.data.lines;
    let saved=null; try{ saved=localStorage.getItem('pod_combo_'+id); }catch(e){}
    if(saved){ const p=saved.split('|'); if(p.length===3){ await podSetProvider(p[0],true); POD.voiceA=p[1]; POD.voiceB=p[2]; podGenAudio(); return; } }
    await podSetProvider('openai');
  }catch(e){ POD.phase='error'; POD.err=cleanPodErr(e.message); podPaint(); }
}
async function podLoadVoices(){
  try{ const r=await podApi('/podcast-voices'); POD.elevenVoices=(r.ok&&r.data.voices&&r.data.voices.length)?r.data.voices:POD_FALLBACK.slice(); }
  catch(e){ POD.elevenVoices=POD_FALLBACK.slice(); }
}
function podDefaults(){
  const fem=(POD.voices||[]).filter(v=>/female|woman/i.test((v.gender||'')+' '+(v.name||'')));
  const list=fem.length>=2?fem:(POD.voices||[]);
  POD.voiceA=(list[0]||{}).voice_id; POD.voiceB=(list[1]||list[0]||{}).voice_id;
}
async function podSetProvider(p,keep){
  // engine (Kokoro / Fish) is now chosen automatically server-side; these are just host labels
  POD.provider = 'auto';
  POD.voices = POD_OPENAI.slice();
  if(!keep) podDefaults();
  POD.phase='voices'; podPaint();
}
async function podGenAudio(retry){
  POD.phase='gen'; POD.genProgress=null; podPaint();
  var maxPasses=14;   // each pass generates a chunk within the server's time budget; enough for a long episode + hiccups
  try{
    for(var pass=0; pass<maxPasses; pass++){
      var r=null;
      try{
        r=await podApi('/podcast-audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic_id:POD.topicId,provider:POD.provider||'auto',voiceA:POD.voiceA,voiceB:POD.voiceB,level:podLevel(),lines:POD.lines})});
      }catch(netErr){
        // network drop / gateway timeout mid-generation — the server saved partial progress; loop to continue
        if(pass<maxPasses-1){ await new Promise(function(s){setTimeout(s,900);}); continue; }
        throw netErr;
      }
      if(!r.ok){
        // 502/503/504 gateway (request outran the window or server waking) → partial is saved; retry resumes
        if((r.status===502||r.status===503||r.status===504) && pass<maxPasses-1){ await new Promise(function(s){setTimeout(s,900);}); continue; }
        throw new Error((r.data&&(r.data.reason||r.data.error))||'Could not generate the audio.');
      }
      if(r.data.degraded) mbKokoroBanner('Kokoro voice is down — this podcast used paid Fish credits. Fix medbank-kokoro on Render.');
      POD.lines=r.data.lines||POD.lines;
      var arr=r.data.urls||[]; var got=arr.filter(Boolean).length, total=arr.length||POD.lines.length;
      POD.genProgress={got:got,total:total}; podPaint();
      if(r.data.done && arr.length && arr.every(Boolean)){ POD.urls=arr; break; }   // complete
      if(pass>=maxPasses-1) throw new Error('This episode is taking longer than expected — tap Generate again to finish it.');
      await new Promise(function(s){setTimeout(s,250);});   // brief pause, then continue the next chunk
    }
    try{ localStorage.setItem('pod_combo_'+POD.topicId, (POD.provider||'auto')+'|'+POD.voiceA+'|'+POD.voiceB); }catch(e){}
    let pos=0; try{ pos=parseInt(localStorage.getItem('pod_pos_'+POD.topicId)||'0',10)||0; }catch(e){}
    POD.i=Math.min(pos,POD.urls.length-1); POD.phase='ready'; podSetupMedia(); podLoadLine(POD.i,false); podPaint();
  }catch(e){
    POD.phase='voices'; POD.err=cleanPodErr(e.message); podPaint(); mbToast(POD.err);
  }
}
function podLoadLine(i,autoplay){
  const a=podAudioEl(); POD.i=Math.max(0,Math.min(i,(POD.urls||[]).length-1));
  a.src=POD.urls[POD.i]; a.playbackRate=POD.speed;
  if(autoplay){ a.play().then(function(){POD.playing=true;podPaint();}).catch(function(){}); }
  try{ localStorage.setItem('pod_pos_'+POD.topicId, String(POD.i)); }catch(e){}
  podPaint();
}
function podToggle(){ const a=podAudioEl(); if(!POD.urls) return; if(a.paused){ if(!a.getAttribute('src')) podLoadLine(POD.i,true); else a.play().then(function(){POD.playing=true;podPaint();}).catch(function(){}); } else { a.pause(); POD.playing=false; podPaint(); } }
function podNext(){ if(!POD.urls) return; if(POD.i<POD.urls.length-1) podLoadLine(POD.i+1,true); else { POD.playing=false; podPaint(); } }
function podPrev(){ if(!POD.urls) return; podLoadLine(Math.max(0,POD.i-1),true); }
function podJump(i){ podLoadLine(i,true); }
function podSpeed(){ const arr=[1,1.25,1.5,0.75]; POD.speed=arr[(arr.indexOf(POD.speed)+1)%arr.length]||1; podAudioEl().playbackRate=POD.speed; podPaint(); }
function podTick(){ const a=document.getElementById('podAudio'); if(!a||!POD.urls) return; const frac=(POD.i+((a.currentTime/(a.duration||1))||0))/POD.lines.length; const p=document.getElementById('podProg'); if(p) p.style.width=Math.min(100,frac*100)+'%'; }
function podRaise(){ podAudioEl().pause(); POD.playing=false; POD.raise=true; podPaint(); }
function podResume(){ POD.raise=false; podPaint(); }
async function podAsk(){
  const qEl=document.getElementById('podQ'), out=document.getElementById('podAns'); const q=(qEl&&qEl.value||'').trim(); if(!q){ return; }
  out.innerHTML='<span style="color:var(--dim)">Thinking…</span>';
  const t=topById(POD.topicId), line=(POD.lines[POD.i]||{}).text||'';
  const prompt='A student is listening to a study podcast on "'+(t?t.name:'')+'" and raised their hand here: "'+line+'". Their question: '+q+'\n\nAnswer clearly and briefly, exam-relevant.';
  try{ const txt=await claudeTutor('You are a friendly medical study tutor answering a quick question during a podcast.', [{role:'user',text:prompt}], DATA.settings.explainModel||'deepseek-v4-flash'); out.innerHTML='<div class="md">'+md(txt)+'</div>'; }
  catch(e){ out.innerHTML='<span style="color:#ff9db1">Couldn\'t reach the AI — check your internet'+((''+e).indexOf('sign in')>=0?' (approve the one-time Puter sign-in)':'')+'.</span>'; }
}
function podSetupMedia(){
  if(!('mediaSession' in navigator)) return;
  try{
    const t=topById(POD.topicId);
    navigator.mediaSession.metadata=new MediaMetadata({ title:((t&&t.name)||'Lecture')+' — Podcast', artist:'MedBank', album:(t&&t.subject&&t.subject.name)||'' });
    navigator.mediaSession.setActionHandler('play',podToggle);
    navigator.mediaSession.setActionHandler('pause',podToggle);
    navigator.mediaSession.setActionHandler('nexttrack',podNext);
    navigator.mediaSession.setActionHandler('previoustrack',podPrev);
  }catch(e){}
}
function podPaint(){
  const root=document.getElementById('podRoot'); if(!root) return;
  if(POD.phase==='load'){ root.innerHTML='<div class="empty">✍️ Writing the podcast script from your note…</div>'; return; }
  if(POD.phase==='error'){ root.innerHTML='<div class="empty">'+esc(POD.err||'Something went wrong')+'<br><br><button class="btn primary" onclick="podLoadScript(POD.topicId)">Try again</button></div>'; return; }
  if(POD.phase==='gen'){ var gp=POD.genProgress; var gmsg=(gp&&gp.total)?('Recording the voices… '+gp.got+' / '+gp.total+' lines'):'Recording the voices… ~30–60s';
    root.innerHTML='<div class="empty">🎙️ '+gmsg+'<br><span style="color:var(--dim);font-size:13px">Made once, then it\'s saved for instant replay — keep this open.</span></div>'; return; }
  if(POD.phase==='voices'){
    const opts=(POD.voices||[]).map(function(v){ return '<option value="'+v.voice_id+'">'+esc(v.name)+(v.gender?' · '+esc(v.gender):'')+'</option>'; }).join('');
    root.innerHTML='<div class="card" style="cursor:default"><div style="font-weight:800;margin-bottom:10px">🎧 Choose your hosts</div>'
      +'<label style="font-size:12.5px;color:var(--dim)">Host A</label><select id="podVA" class="sbox">'+opts+'</select>'
      +'<label style="font-size:12.5px;color:var(--dim);margin-top:8px;display:block">Host B</label><select id="podVB" class="sbox">'+opts+'</select>'
      +'<div class="btnrow" style="margin-top:14px"><button class="btn primary" onclick="POD.voiceA=document.getElementById(\'podVA\').value;POD.voiceB=document.getElementById(\'podVB\').value;podGenAudio()">▶ Generate &amp; play</button></div>'
      +'<div style="font-size:11.5px;color:var(--dim);margin-top:8px">Two natural hosts, generated once and saved for instant replay.</div></div>'
      +'<div style="margin-top:14px;font-weight:700">Script preview</div>'
      +'<div class="card" style="cursor:default;margin-top:6px">'+POD.lines.map(function(l){ return '<div style="margin:6px 0"><b style="color:'+(l.speaker==='A'?'var(--primer)':'var(--recall)')+'">'+(l.speaker==='A'?'A':'B')+'</b> '+esc(l.text)+'</div>'; }).join('')+'</div>';
    setTimeout(function(){ const a=document.getElementById('podVA'),b=document.getElementById('podVB'); if(a&&POD.voiceA)a.value=POD.voiceA; if(b&&POD.voiceB)b.value=POD.voiceB; },0);
    return;
  }
  if(POD.raise){
    root.innerHTML='<div class="card" style="cursor:default"><div style="font-weight:800;margin-bottom:8px">✋ Ask the hosts</div>'
      +'<textarea id="podQ" class="notebox" rows="3" placeholder="Your question about this bit…"></textarea>'
      +'<div class="btnrow" style="margin-top:10px;gap:8px"><button class="btn primary" onclick="podAsk()">Ask</button><button class="btn" onclick="podResume()">↩ Back to the podcast</button></div>'
      +'<div id="podAns" style="margin-top:12px;font-size:14px"></div></div>';
    return;
  }
  const nA=podName(POD.voiceA), nB=podName(POD.voiceB), t=topById(POD.topicId);
  root.innerHTML='<div class="card" style="cursor:default">'
    +'<div style="display:flex;align-items:center;gap:10px"><div style="font-size:26px">🎧</div><div><div style="font-weight:800">'+esc((t&&t.name)||'Podcast')+'</div><div style="font-size:12px;color:var(--dim)">Hosts: '+esc(nA)+' &amp; '+esc(nB)+' · '+POD.lines.length+' lines</div></div></div>'
    +'<div style="height:8px;background:var(--panel2,#eee);border-radius:5px;overflow:hidden;margin:14px 0 6px"><div id="podProg" style="height:100%;width:0;background:var(--accent)"></div></div>'
    +'<div id="podTime" style="font-size:12px;color:var(--dim)">Line '+(POD.i+1)+' / '+POD.lines.length+'</div>'
    +'<div class="btnrow" style="justify-content:center;gap:16px;margin:14px 0"><button class="btn" onclick="podPrev()">⏮</button><button class="btn primary" style="min-width:100px" onclick="podToggle()">'+(POD.playing?'⏸ Pause':'▶ Play')+'</button><button class="btn" onclick="podNext()">⏭</button></div>'
    +'<div class="btnrow" style="justify-content:center;gap:10px"><button class="btn" onclick="podSpeed()">⚡ '+POD.speed+'×</button><button class="btn" onclick="podRaise()">✋ Raise hand</button></div></div>'
    +'<div style="margin-top:14px;font-weight:700">Transcript</div>'
    +'<div class="card" style="cursor:default;margin-top:6px">'+POD.lines.map(function(l,idx){ return '<div onclick="podJump('+idx+')" id="podL'+idx+'" style="margin:2px -6px;padding:7px 8px;border-radius:8px;cursor:pointer;background:'+(idx===POD.i?'var(--panel2,#eee)':'transparent')+'"><b style="color:'+(l.speaker==='A'?'var(--primer)':'var(--recall)')+'">'+esc(l.speaker==='A'?nA:nB)+'</b> '+esc(l.text)+'</div>'; }).join('')+'</div>';
  const cur=document.getElementById('podL'+POD.i); if(cur) cur.scrollIntoView({block:'center',behavior:'smooth'});
}

async function admApi(path,opts){
  const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API) throw new Error('Import server not configured.');
  let token=null; if(window.__mbSB){ const ses=await window.__mbSB.auth.getSession(); token=ses.data.session&&ses.data.session.access_token; }
  opts=opts||{}; opts.headers=Object.assign({'Authorization':'Bearer '+token},opts.headers||{});
  const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+path,opts); return {ok:r.ok, data:await r.json()};
}
let ADM_DEFAULT='';
async function admFetch(){
  const kEl=$('#admKind'); if(!kEl) return;
  const kind=kEl.value, level=$('#admLevel').value, st=$('#admStatus');
  if(st) st.textContent='Loading…';
  try{
    const r=await admApi('/admin/prompt?kind='+encodeURIComponent(kind)+(level?'&level='+encodeURIComponent(level):''));
    if(!r.ok) throw new Error((r.data&&r.data.error)||'load failed');
    const row=r.data.row; ADM_DEFAULT=r.data.defaultPrompt||'';
    $('#admPrompt').value = row?(row.template||''):'';
    $('#admModel').value = (row&&row.model)||''; $('#admMax').value=(row&&row.max_tokens)||''; $('#admTemp').value=(row&&row.temperature!=null)?row.temperature:'';
    if(st) st.textContent = row ? '✎ Editing the saved prompt for this build + level.'
      : (level ? 'No prompt set for this level — imports here fall back to Default. Save to create one.'
               : 'No Default saved — the built-in default is used. Save to create one.');
  }catch(e){ if(st) st.textContent='Could not load: '+(e.message||e); }
}
function admLoadDefault(){ if(ADM_DEFAULT){ $('#admPrompt').value=ADM_DEFAULT; } else { alert('No built-in default for this build. (Core uses your existing DB prompt.)'); } }
async function admSave(){
  const msg=$('#admMsg'); if(msg) msg.textContent='Saving…';
  const body={ kind:$('#admKind').value, level:$('#admLevel').value||null, template:$('#admPrompt').value,
    model:$('#admModel').value||null, max_tokens:$('#admMax').value||null, temperature:$('#admTemp').value||null };
  if(!body.template.trim()){ if(msg) msg.innerHTML='<span style="color:#ff9db1">Prompt can’t be empty.</span>'; return; }
  try{
    const r=await admApi('/admin/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error((r.data&&r.data.error)||'save failed');
    if(msg) msg.innerHTML='<span style="color:var(--recall);font-weight:700">✓ Saved. New imports at this level use it right away.</span>';
  }catch(e){ if(msg) msg.innerHTML='<span style="color:#ff9db1">Could not save: '+esc(e.message||e)+'</span>'; }
}

async function vizAdmSelftest(btn){ var box=$('#vizAdmDiag'); if(btn)btn.disabled=true;
  if(box)box.innerHTML='<span style="color:var(--dim)">Running one sentence through the pipeline…</span>';
  try{ var r=await admApi('/admin/viz/selftest');
    var d=r.data||{};
    var stageLabels={api_error:'AI request failed',empty_response:'AI returned nothing',parse_failed:'AI reply wasn’t valid JSON',qc_warnings:'Built with QC warnings',ok:'All good'};
    var good=d.ok, color=good?'var(--recall)':'#ff9db1';
    var rows=[];
    rows.push('Model: <b>'+esc(d.model||'?')+'</b>');
    rows.push('DeepSeek key set: <b>'+(d.deepseek_key?'yes':'NO — set DEEPSEEK_API_KEY')+'</b>');
    if(d.api_ok!=null) rows.push('AI responded: <b>'+(d.api_ok?'yes':'no')+'</b>'+(d.text_len!=null?(' ('+d.text_len+' chars)'):''));
    if(d.parse_ok!=null) rows.push('Parsed JSON: <b>'+(d.parse_ok?'yes':'no')+'</b>'+(d.parse_ok?(' · '+d.elements+' elements, '+d.steps+' steps, template '+esc(d.template||'?')):''));
    if(d.qc_pass!=null) rows.push('QC: <b>'+(d.qc_pass?'clean':'warnings')+'</b>'+((d.qc_issues&&d.qc_issues.length)?(' — '+esc(d.qc_issues.slice(0,4).join('; '))):''));
    if(d.graph_pass!=null) rows.push('Chain complete: <b>'+(d.graph_pass?'yes':'gaps')+'</b>'+((d.graph_issues&&d.graph_issues.length)?(' — '+esc(d.graph_issues.slice(0,3).join('; '))):''));
    if(d.chain&&d.chain.length) rows.push('Chain: <span style="color:var(--dim)">'+esc(d.chain.join(' → '))+'</span>');
    if(d.completeness) rows.push('Nothing missed: <b>'+((d.completeness.missing&&d.completeness.missing.length)?('no — missing '+esc(d.completeness.missing.join(', '))):'yes')+'</b>');
    if(d.error) rows.push('<span style="color:#ff9db1">Error: '+esc(d.error)+'</span>');
    if(d.raw_head && !d.parse_ok) rows.push('<div style="margin-top:6px;font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-word">'+esc(d.raw_head)+'…</div>');
    if(box)box.innerHTML='<div class="card" style="border-left:4px solid '+color+'"><b style="color:'+color+'">'+esc(stageLabels[d.stage]||d.stage||'result')+'</b><div style="margin-top:6px;line-height:1.7">'+rows.join('<br>')+'</div></div>';
  }catch(e){ if(box)box.innerHTML='<span style="color:#ff9db1">Self-test failed: '+esc(e.message||e)+'</span>'; }
  finally{ if(btn)btn.disabled=false; }

function bucketItems(k){

    startedTopics().forEach(t=>(t.recall||[]).forEach(c=>{ const id=cid(t.id,'recall',c), s=DATA.cards[id];
      if(s&&s.box>=3&&s.due>today) out.push({t,c,id,deck:'recall',conf:true}); }));

  }
  startedTopics().forEach(t=>(t.recall||[]).forEach(c=>{ const id=cid(t.id,'recall',c), s=DATA.cards[id];
    if(s&&s.due<=today){ if(reviewBucket(s.box,!!DATA.starred[id])===k) out.push({t,c,id,deck:'recall',box:s.box,isNew:false}); } }));
  return out;
}

/* ---- notification nudge: a MIX of hard + due cards ---- */
function nudgeItems(max){
  max=max||8; const today=dayNum();
  const hard=starItems();
  const due=[];
  startedTopics().forEach(t=>(t.recall||[]).forEach(c=>{ const id=cid(t.id,'recall',c), s=DATA.cards[id];
    if(s && s.due<=today && !DATA.starred[id]) due.push({t,c,id,deck:'recall'}); }));
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
  sh(hard); sh(due);
  const out=[]; let hi=0,di=0;                    // interleave ~1 hard : 2 due
  while(out.length<max && (hi<hard.length||di<due.length)){
    if(hi<hard.length) out.push(Object.assign({hard:true},hard[hi++]));
    if(out.length<max && di<due.length) out.push(due[di++]);
    if(out.length<max && di<due.length) out.push(due[di++]);
  }
  return out;
}

/* build the notification body carrying the actual card Q&A */
function nudgeBody(items){
  const clip=(s,n)=>{ s=(s||'').replace(/\s+/g,' ').trim(); return s.length>n?s.slice(0,n-1)+'…':s; };
  const lines=items.slice(0,3).map(it=>{
    const ic=it.hard?'🔴':'🔵';
    const a=it.deck==='primer'?(it.c.lecturer||''):it.c.a;
    return `${ic} ${clip(it.c.q,90)}\n     ↳ ${clip(a,100)}`;
  });
  const more=items.length-3;
  return lines.join('\n\n') + (more>0?`\n\n+ ${more} more · tap to drill`:`\n\nTap to drill`);
}
/* short in-app beep alarm (only works while the app is open) */
function playAlarm(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC();
    [0,0.45,0.9].forEach(dt=>{ const o=ac.createOscillator(), g=ac.createGain();
      o.type='square'; o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime+dt;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
      o.start(t); o.stop(t+0.34);
    });
    setTimeout(()=>{ try{ac.close();}catch(e){} },1600);
  }catch(e){}
}

/* Idle Detection (Android/Chrome): nudge sooner when the phone is unlocked & in use.
   Only runs while MedBank's worker is alive; unsupported/blocked on iPhone. */
let _idleDet=null;
async function startIdle(requestIfNeeded){
  try{
    if(!DATA.settings.useIdle || !('IdleDetector' in window)) return;
    let state='denied';
    try{ state=(await navigator.permissions.query({name:'idle-detection'})).state; }catch(e){}
    if(state!=='granted'){
      if(!requestIfNeeded) return;
      const p=await window.IdleDetector.requestPermission();
      if(p!=='granted'){ DATA.settings.useIdle=false; persist(); return; }
    }
    if(_idleDet) return;                       // already watching
    _idleDet=new window.IdleDetector();
    _idleDet.addEventListener('change',()=>{
      // fire when the user is active AND the screen is unlocked = phone in use
      if(_idleDet.userState==='active' && _idleDet.screenState==='unlocked') nudgeTick(false);
    });
    await _idleDet.start({threshold:60000});
  }catch(e){}
}

/* the recurring check — fires a nudge every N minutes while conditions are met */
let _lastTickShown=0;
function nudgeTick(force){
  try{
    const s=DATA.settings;
    if(!s.remindOn) return;
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    const hr=new Date().getHours();
    if(!force && (hr<(s.quietStart||7) || hr>=(s.quietEnd||22))) return;   // quiet hours
    const every=Math.max(5,(s.remindMins||120))*60e3;
    const now=Date.now();
    if(!force && now-(s.lastNudge||0) < every) return;
    if(todayLog().cards>0 && (now-(s.lastNudge||0)) < every) { /* studied recently is fine */ }
    const items=nudgeItems(10);
    if(!items.length) return;                     // nothing to review — no nag
    s.lastNudge=now; persist();
    const body=nudgeBody(items), url='./app.html#/nudge';
    swPing('notify',{body,url,strict:s.strict});
    swPing('payload',{body,url});
    if(document.visibilityState==='visible' && now-_lastTickShown>5000){
      _lastTickShown=now; playAlarm();
      if(s.strict) strictOverlay(items.length);
    }
  }catch(e){}
}

      <p class="sub" style="margin-bottom:20px">${cleared?'Next review: tomorrow. Nothing left due today.':`${remain} card${remain===1?'':'s'} still due — do another round when you can.`}</p>
      <div class="sgrid">
        <div class="sm"><b>${s.done}</b><span>cards</span></div>
        <div class="sm"><b style="color:var(--recall)">${s.correct}</b><span>got it</span></div>
        <div class="sm"><b style="color:var(--com)">${Math.max(0,s.done-s.correct)}</b><span>missed</span></div>
        <div class="sm"><b>${acc}%</b><span>accuracy</span></div>
      </div>
      ${s.confN?`<p class="sub" style="text-align:center;margin-top:14px">🎲 ${s.confN} confidence card${s.confN===1?'':'s'} checked — any you missed quietly re-entered the pipeline.</p>`:''}
      ${s.over?`<p class="sub" style="text-align:center">${s.over} extra due card${s.over===1?'':'s'} were held for tomorrow to fit your time budget.</p>`:''}

      </div></div>`;
}

/* MCQ renderer for Recall (Deck B) cards that carry options */
function mcqView(session){
  const it=S.items[S.order[S.i]], c=effCard(it.id,it.c), t=it.t;
  if(EDITING===it.id) return '<div class="studywrap">'+cardEditor(it.id,'recall',c)+'</div>';
  const col='var(--recall)';
  const n=S.items.length, pctBar=((S.i+1)/n*100).toFixed(1), star=isStar(it.id);
  const _sa=(S.answered&&S.answered[it.id]!=null)?S.answered[it.id]:null;                       // answered earlier this session
  const _pa=(S.mode==='deck'&&DATA.cardAns&&DATA.cardAns[it.id]!=null)?DATA.cardAns[it.id]:null; // topic quiz: answered on a previous day
  const storedPick = _sa!=null?_sa:_pa;
  const picked = S.pick!=null || storedPick!=null;
  const pickIdx = S.pick!=null?S.pick:storedPick;
  const correct = picked && pickIdx===c.ans;
  const isHard = !!(DATA.starred[it.id] || (DATA.cards[it.id]&&DATA.cards[it.id].box<0));
  let body;
  if(!S.opts && !picked){
    body = `<div class="taphint">Think of your answer first — then reveal the options.</div>`;
  }else{
    const optsHtml = c.opts.map((o,i)=>{
      let cls='mcqopt';
      const removed = (!picked && S.hint && S.hintHide && S.hintHide.indexOf(i)>=0);
      if(picked){ if(i===c.ans) cls+=' correct'; else if(i===pickIdx) cls+=' wrong'; else cls+=' dim'; }
      else if(removed) cls+=' removed';
      const mark = picked ? (i===c.ans?'<span class="mcqmark">✓</span>':(i===pickIdx?'<span class="mcqmark">✗</span>':'')) : '';
      return `<button class="${cls}" ${(picked||removed)?'disabled':''} onclick="event.stopPropagation();pickOpt(${i})">
          <span class="mcqtag">${String.fromCharCode(65+i)}</span><span class="mcqtext">${esc(o)}</span>${mark}</button>`;
    }).join('');
    body = `<div class="mcqopts">${optsHtml}</div>`;
    if(!picked && isHard && !S.hint && c.opts.length>2){
      body += `<button class="hintbtn" onclick="event.stopPropagation();mcqHint()">💡 Hint · remove two wrong options</button>`;
    }
    if(picked){
      const revTxt=reviewIntervalText(it.id);
      body += `<div class="mcqresult ${correct?'ok':'no'}" id="mcqAnswerTop">${correct?'✓ Correct':'✗ Not quite — added to your hard cards ★'}</div>`
            + `<div class="nextrev ${correct?'ok':'no'}">↻ You'll see this again <b>${revTxt}</b>${correct?'':' · it\'s now a hard card (also in your reminders)'}</div>`
            + `<div class="ansblock"><div class="seg"><div class="seglabel" style="background:#3ecf8e22;color:var(--recall)">Answer — explained</div><div class="body">${para(c.a)}</div></div></div>`
            + `<div class="vizmiss" onclick="event.stopPropagation()">${(window.DATA&&DATA.cardViz&&DATA.cardViz[it.id])
                 ? `<button class="vizsavedbtn" onclick="event.stopPropagation();vizWatchSaved()">▶ Watch your explainer <span class="vsaved">saved for this card</span></button>`
                 : `<button class="vizmissbtn" onclick="event.stopPropagation();vizFromCard()">🎬 Visualize how to get this answer</button>`}<div id="vizInlineHost" class="vizinlinehost"></div></div>`;
    }
  }
  const deck=S.mode==='deck';
  const navRow = `<div class="btnrow" style="margin-top:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="event.stopPropagation();step(-1)" ${S.i===0?'disabled':''}>← Prev</button>
      ${!picked?`<button class="btn" onclick="event.stopPropagation();mcqNext()" ${S.i>=n-1?'disabled':''}>Skip →</button>`:''}
      <button class="btn" onclick="event.stopPropagation();shuffle()">⇄ Shuffle</button>
      ${deck?`<button class="btn" onclick="event.stopPropagation();restartDeck()">↺ Restart</button>`:''}
    </div>`;
  let controls;
  if(!S.opts && !picked){
    controls = `<div class="navbtns"><button class="btn primary" onclick="event.stopPropagation();showOpts()">Show options</button></div>${navRow}
      <div class="kbd">Space/O options · you can Skip, Prev or Shuffle without answering · ←/→ move · S shuffle</div>`;
  }else if(!picked){
    controls = `<div class="kbd">Tap an option · keys 1–4 · or Skip / Prev / Shuffle below</div>${navRow}`;
  }else{
    const last=S.i>=n-1;
    controls = `<div class="navbtns">
        <button class="btn ${star?'':'got'}" onclick="event.stopPropagation();toggleStar('${it.id}')">${star?'★ In hard cards':'★ Add to hard'}</button>
        <button class="btn primary" onclick="event.stopPropagation();mcqNext()" ${(!session&&last)?'disabled':''}>${session&&last?'Finish':'Next →'}</button></div>${navRow}
      <div class="kbd">Space → next · ← Prev · S shuffle</div>`;
  }
  return `<div class="studywrap">
    <div class="studytop">
      <span class="pill" style="background:${col}22;color:${col};margin:0">${session?esc(t.name):'Recall · Deck B'}</span>
      <span class="name">${session?'◎ Recall (MCQ)':esc(t.name)}</span>
      ${ttsBtn()}<span class="counter">${S.i+1} / ${n}</span></div>
    <div class="bar"><div style="width:${pctBar}%;background:${col}"></div></div>
    ${masteryChips(sessionRecallIds())}
    <div class="flash" onclick="cardTap()">
      <button class="starbtn ${star?'on':''}" title="Add to hard cards" onclick="event.stopPropagation();toggleStar('${it.id}')">${star?'★':'☆'}</button>
      <div class="qlabel">${c.img?'Look at this — then answer':'Question'}${session?' · '+esc(t.subject.short):''}</div>
      <div class="q">${esc(c.q)}</div>
      ${c.img?`<div onclick="event.stopPropagation()">${imgBlock(c.img,c.imgCaption||'')}</div>`:''}
      ${body}</div>
    ${picked?noteBlock(it):''}
    ${(c.src&&picked)?`<div style="text-align:center;margin-top:10px"><button onclick="event.stopPropagation();try{MB_DOCK_SOURCE()}catch(e){}" style="border:1px solid var(--line);background:var(--panel2);color:var(--accent);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12.5px;cursor:pointer">${c.src_t!=null?('🎙 '+Math.floor(c.src_t/60)+':'+String(c.src_t%60).padStart(2,'0')+' · in the lecture'):'📄 Show in the note'}</button></div>`:''}
    ${cardActionsRow(it.id,it.deck)}
    ${controls}</div>`;
}

/* shared card renderer — deck mode and session (daily/hard) mode */
function cardView(session){
  const it0=S.items[S.order[S.i]];
  if(it0 && it0.deck!=='primer' && it0.c.opts && it0.c.opts.length) return mcqView(session);
  const it=S.items[S.order[S.i]], c=effCard(it.id,it.c), t=it.t, deck=it.deck, isP=deck==='primer';
  if(EDITING===it.id) return '<div class="studywrap">'+cardEditor(it.id,deck,c)+'</div>';
  const col=isP?'var(--primer)':'var(--recall)';
  const n=S.items.length, pctBar=((S.i+1)/n*100).toFixed(1), star=isStar(it.id);
  let ans='';
  if(S.show){
    ans = isP
      ? `<div class="ansblock">
          <div class="seg lecturer"><div class="seglabel" style="background:#8895aa22;color:var(--dim)">In the lecturer's words</div><div class="body">${para(c.lecturer)}</div></div>
          <div class="seg"><div class="seglabel" style="background:#4f8cff22;color:var(--primer)">Explained</div><div class="body">${para(c.explain)}</div></div>
          ${c.tie?`<div class="seg tie"><div class="seglabel" style="background:#ffb45422;color:var(--com)">Why it matters here</div><div class="body">${para(c.tie)}</div></div>`:''}
        </div>`
      : `<div class="ansblock"><div class="seg"><div class="seglabel" style="background:#3ecf8e22;color:var(--recall)">Answer</div><div class="body">${para(c.a)}</div></div></div>`;
  }
  const canRate = !isP;
  let controls;
  if(canRate && S.show){
    controls = `<div class="ratebtns">
         <button class="btn miss" onclick="event.stopPropagation();rateCard(false)">✗ Missed</button>
         <button class="btn got" onclick="event.stopPropagation();rateCard(true)">✓ Got it</button></div>
       <div class="kbd">1 = missed · 2 = got it · Space reveals</div>`;
  } else if(session){
    const showNext = !canRate && S.show;                       // primer card in a session
    controls = `<div class="navbtns">
         <button class="btn" onclick="event.stopPropagation();reveal()">${S.show?'Hide':'Reveal'}</button>
         ${showNext?`<button class="btn primary" onclick="event.stopPropagation();sessionNext()">${S.i>=n-1?'Finish':'Next →'}</button>`:''}</div>
       <div class="kbd">Space reveals</div>`;
  } else {
    controls = `<div class="navbtns">
         <button class="btn" onclick="event.stopPropagation();step(-1)" ${S.i===0?'disabled':''}>← Prev</button>
         <button class="btn" onclick="event.stopPropagation();reveal()">${S.show?'Hide':'Reveal'}</button>
         <button class="btn primary" onclick="event.stopPropagation();step(1)" ${S.i>=n-1?'disabled':''}>Next →</button></div>
       <div class="btnrow" style="margin-top:12px;justify-content:center">
         <button class="btn" onclick="shuffle()">⇄ Shuffle</button>
         <button class="btn" onclick="restartDeck()">↺ Restart</button></div>
       <div class="kbd">Space reveals · ← → move between cards</div>`;
  }
  return `<div class="studywrap">
    <div class="studytop">
      <span class="pill" style="background:${col}22;color:${col};margin:0">${session?esc(t.name):(isP?'Primer · Deck A':'Recall · Deck B')}</span>
      <span class="name">${session?('◎ '+(isP?'Primer':'Recall')):esc(t.name)}</span>
      ${ttsBtn()}<span class="counter">${S.i+1} / ${n}</span></div>
    <div class="bar"><div style="width:${pctBar}%;background:${col}"></div></div>
    ${masteryChips(sessionRecallIds())}
    <div class="flash" onclick="reveal()">
      <button class="starbtn ${star?'on':''}" title="Star as a hard card" onclick="event.stopPropagation();toggleStar('${it.id}')">${star?'★':'☆'}</button>
      <div class="qlabel">${c.img?'Look at this — then answer':'Question'}${session?' · '+esc(t.subject.short):''}</div>
      <div class="q">${esc(c.q)}</div>
      ${c.img?`<div onclick="event.stopPropagation()">${imgBlock(c.img,c.imgCaption||'')}</div>`:''}
      ${ans || '<div class="taphint">Tap to reveal</div>'}</div>
    ${S.show?noteBlock(it):''}
    ${(c.src&&S.show)?`<div style="text-align:center;margin-top:10px"><button onclick="event.stopPropagation();try{MB_DOCK_SOURCE()}catch(e){}" style="border:1px solid var(--line);background:var(--panel2);color:var(--accent);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12.5px;cursor:pointer">${c.src_t!=null?('🎙 '+Math.floor(c.src_t/60)+':'+String(c.src_t%60).padStart(2,'0')+' · in the lecture'):'📄 Show in the note'}</button></div>`:''}
    ${cardActionsRow(it.id,it.deck)}
    ${controls}</div>`;
}

/* ---- MCQ interaction (Recall cards with options) ---- */
function isMcqCard(it){ return it && it.deck!=='primer' && it.c && it.c.opts && it.c.opts.length; }
function cardTap(){
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it) return;
  if(isMcqCard(it)){ if(!S.opts) showOpts(); else if(S.pick!=null) mcqNext(); return; }   // options first; after answering, tap anywhere to continue
  reveal();
}
function showOpts(){
  if(!S) return; if(S.opts) return; S.opts=true;
  markActive(); const it=S.items[S.order[S.i]]; if(it) touchTopic(it.t.id);
  render();
}
function mcqHint(){                             // 50-50: knock out two wrong options on a hard card
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it||!isMcqCard(it)||S.pick!=null) return;
  const c=it.c, wrong=[]; for(let k=0;k<c.opts.length;k++) if(k!==c.ans) wrong.push(k);
  for(let k=wrong.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[wrong[k],wrong[j]]=[wrong[j],wrong[k]];}
  S.hintHide=wrong.slice(0,2); S.hint=true; render();
}
function pickOpt(i){
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it||S.pick!=null||!isMcqCard(it)) return;
  if(S.hint && S.hintHide && S.hintHide.indexOf(i)>=0) return;   // removed by the hint — not selectable
  S.answered=S.answered||{};
  const alreadyAns = S.answered[it.id]!=null || (S.mode==='deck'&&DATA.cardAns&&DATA.cardAns[it.id]!=null);
  if(alreadyAns){ S.pick=null; render(); return; }              // answered before → just show it, never re-rate
  const c=it.c, ok=(i===c.ans);
  S.answered[it.id]=i; if(S.mode==='deck'){ DATA.cardAns=DATA.cardAns||{}; DATA.cardAns[it.id]=i; }   // remember the choice
  S.pick=i; S.show=true;
  const beforeCards=todayLog().cards, beforeLvl=levelInfo().i, beforeStreak=curStreak(), goal=DATA.daily.goal, floor=DATA.daily.floor, beforeMet=streakMet();
  markActive();
  if(it.conf){ if(!ok) rateSRS(it.id,false); }          // confidence check: miss re-enters pipeline
  else rateSRS(it.id,ok);
  logRate(ok); logDaily(!!it.isNew, it.t.subject.id); touchTopic(it.t.id);
  S.session.done++; if(ok) S.session.correct++;
  if(!ok && !it.conf){                                   // failed → auto-add to hard cards + mistakes log
    DATA.starred[it.id]=1; logMiss(it.id);
    try{ if(typeof swPing==='function') swPing('hardcount',{n:starCount()}); }catch(e){}
  }
  if(S.mode==='deck') DATA.pos['pos:'+S.t.id+S.deck]=Math.min(S.i+1,S.items.length-1);
  persist();
  const afterCards=todayLog().cards, afterLvl=levelInfo().i, afterStreak=curStreak();
  if(afterLvl>beforeLvl)                          celebrate('level','Level up · '+LEVELS[afterLvl].n);
  else if(beforeCards<goal && afterCards>=goal)   celebrate('goal','🎉 Daily goal complete!');
  else if(!beforeMet && streakMet())              celebrate('floor','✓ Day’s target met — streak safe!');
  else if(afterStreak>beforeStreak && afterStreak%7===0) celebrate('streak','🔥 '+afterStreak+'-day streak!');
  render();
  if(window.innerWidth<=720){ setTimeout(function(){ var el=document.getElementById('mcqAnswerTop'); if(el)el.scrollIntoView({behavior:'smooth',block:'start'}); },60); }   // phone: drop straight to the explanation
  else window.scrollTo(0,0);
}
function vizFromCard(){                        // build an inline explainer for the current card — how to reason to the answer
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it) return;
  const c=effCard(it.id,it.c), t=it.t;
  const correct=(c.opts&&c.opts[c.ans]!=null)?c.opts[c.ans]:'';
  const text=(c.q||'')+(correct?(' The correct answer is: '+correct+'.'):'')+(c.a?(' '+c.a):'');
  const btn=document.querySelector('.vizmissbtn'); if(btn)btn.style.display='none';
  if(window.aiVisualizeInline) window.aiVisualizeInline(text,(t&&t.name)||'',(t&&t.id)||'','vizInlineHost', it.id);
}
function vizWatchSaved(){                       // replay the explainer already saved to this card
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it) return;
  const btn=document.querySelector('.vizsavedbtn'); if(btn)btn.style.display='none';
  if(window.aiVisualizeInlineSaved) window.aiVisualizeInlineSaved(it.id,(it.t&&it.t.id)||'','vizInlineHost');
}
function mcqNext(){
  if(!S) return; if(window.vizInlineStop)vizInlineStop();
  if(_mbViaSwipe){ _mbViaSwipe=false; } else bumpNext();
  if(S.i>=S.items.length-1){
    if(S.mode!=='deck'){ S.i=S.items.length; render(); window.scrollTo(0,0); return; }
    S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); return;   // deck: stay on last card
  }
  S.i++; S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); window.scrollTo(0,0);
}

function reveal(){
  if(!S) return;
  const it=S.items[S.order[S.i]];
  if(isMcqCard(it)){ if(!S.opts) showOpts(); else if(S.pick!=null) mcqNext(); return; }
  if(!S.show){ markActive(); if(it) touchTopic(it.t.id); }
  S.show=!S.show; render();
}
function step(d){ if(!S)return; _mbViaSwipe=false; if(window.vizInlineStop)vizInlineStop(); const n=S.i+d; if(n<0||n>=S.items.length)return;
  S.i=n; S.show=false; S.opts=false; S.pick=null; S.hint=false; S.hintHide=null;
  if(S.mode==='deck'){ DATA.pos['pos:'+S.t.id+S.deck]=S.i; persist(); }
  render(); window.scrollTo(0,0);
}
function shuffle(){ if(!S)return; for(let i=S.order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];} S.i=0;S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null;render(); }
function restartDeck(){ if(!S)return; S.i=0;S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null;S.order=S.items.map((_,k)=>k);
  S.answered={};                                                             // Reset wipes your answers → questions show as unanswered again
  if(S.mode==='deck'){ DATA.cardAns=DATA.cardAns||{}; S.items.forEach(function(x){ delete DATA.cardAns[x.id]; }); DATA.pos['pos:'+S.t.id+S.deck]=0; persist(); }
  render(); }
/* classify a session item for the remaining-mix bar */
function classifyItem(it){
  if(!it) return 'rev';
  if(it.isNew) return 'new';
  if(it.conf) return 'rev';
  const s=DATA.cards[it.id];
  if(!s) return 'new';
  if(DATA.starred[it.id] || s.box<0) return 'hard';
  return 'rev';
}
function sessionMix(){                         // counts of what's still AHEAD (from current card to the end)
  let h=0,r=0,n=0;
  if(S&&S.items){ for(let k=S.i;k<S.items.length;k++){ const cl=classifyItem(S.items[S.order[k]]); if(cl==='hard')h++; else if(cl==='new')n++; else r++; } }
  return {hard:h,rev:r,new:n};
}
function endSession(){                        // leave a session gracefully → results if any progress, else back to the hub
  if(window.vizInlineStop)vizInlineStop();
  if(!S){ go('today'); return; }
  if(S.session && S.session.done>0){ S.i=S.items.length; render(); window.scrollTo(0,0); }
  else go('today');
}
function sessionNext(){                       // advance a non-rated (primer) card inside a session
  if(!S) return; if(_mbViaSwipe){ _mbViaSwipe=false; } else bumpNext();
  S.session.done++;
  if(S.i>=S.items.length-1){ S.i=S.items.length; S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); window.scrollTo(0,0); return; }
  S.i++; S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); window.scrollTo(0,0);
}
function flashReview(id,ok){
  const txt=reviewIntervalText(id);
  const host=document.createElement('div'); host.className='revtoast';
  host.innerHTML=`<span class="rt ${ok?'':'no'}">${ok?'✓':'✗ hard card ·'}</span> next review <b>${txt}</b>`;
  document.body.appendChild(host);
  setTimeout(()=>{ host.style.transition='opacity .4s'; host.style.opacity='0'; setTimeout(()=>host.remove(),400); }, 1600);
}
function celebrate(kind,text){
  try{ if(navigator.vibrate) navigator.vibrate(kind==='goal'||kind==='level'?[30,40,30]:20); }catch(e){}
  const host=document.createElement('div'); host.className='celebrate';
  const emo = kind==='level'?['🎓','⭐','🎉','✨']:kind==='streak'?['🔥','🔥','✨','🎉']:['🎉','✨','🎊','⭐','💪'];
  let bits='';
  for(let i=0;i<18;i++){ const e=emo[i%emo.length];
    bits+=`<span style="left:${Math.random()*100}%;animation-delay:${(Math.random()*0.3).toFixed(2)}s;font-size:${(14+Math.random()*16)|0}px">${e}</span>`; }
  host.innerHTML=`<div class="celebits">${bits}</div>${text?`<div class="celebanner">${esc(text)}</div>`:''}`;
  document.body.appendChild(host);
  setTimeout(()=>host.remove(),1900);
}
function rateCard(ok){
  if(!S) return; if(window.vizInlineStop)vizInlineStop(); const it=S.items[S.order[S.i]]; if(!it) return;
  const beforeCards=todayLog().cards, beforeLvl=levelInfo().i, beforeStreak=curStreak(), goal=DATA.daily.goal, floor=DATA.daily.floor, beforeMet=streakMet();
  markActive();
  if(it.conf){ if(!ok) rateSRS(it.id,false); }   // confidence check: correct = no change, miss = re-enter pipeline
  else rateSRS(it.id,ok);
  logRate(ok); logDaily(!!it.isNew, it.t.subject.id); touchTopic(it.t.id);
  S.session.done++; if(ok)S.session.correct++;
  if(!ok && !it.conf){ DATA.starred[it.id]=1; logMiss(it.id); try{ if(typeof swPing==='function') swPing('hardcount',{n:starCount()}); }catch(e){} }  // failed → hard card + mistakes log
  if(S.mode==='deck') DATA.pos['pos:'+S.t.id+S.deck]=Math.min(S.i+1,S.items.length-1);
  persist();
  if(!it.conf) flashReview(it.id, ok);
  // micro-celebrations
  const afterCards=todayLog().cards, afterLvl=levelInfo().i, afterStreak=curStreak();
  if(afterLvl>beforeLvl)                         celebrate('level','Level up · '+LEVELS[afterLvl].n);
  else if(beforeCards<goal && afterCards>=goal)  celebrate('goal','🎉 Daily goal complete!');
  else if(!beforeMet && streakMet())             celebrate('floor','✓ Day’s target met — streak safe!');
  else if(afterStreak>beforeStreak && afterStreak%7===0) celebrate('streak','🔥 '+afterStreak+'-day streak!');
  if(S.i>=S.items.length-1){
    if(S.mode!=='deck'){ S.i=S.items.length; render(); window.scrollTo(0,0); return; }
    S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); return;            // deck: stay on last card
  }
  S.i++; S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); window.scrollTo(0,0);
}
/* ---- phone swipe gestures in a review session: ← next · → prev · ↑ star ---- */
/* ---- swipe-to-next onboarding hint (phone, until the swipe is learned) ---- */
var PREV_BASE='';
var SWIPE_USED=(function(){ try{ return parseInt(localStorage.getItem('mb_swipe_used')||'0',10)||0; }catch(e){ return 0; } })();
var SWIPE_NEXTS=0, _mbViaSwipe=false;
function swipeHintEligible(){ return window.innerWidth<=720 && SWIPE_USED<2 && /^#\/(study|review|hard)/.test(location.hash) && S && S.items && S.items.length; }
function markSwipeUsed(){ SWIPE_USED++; try{ localStorage.setItem('mb_swipe_used',String(SWIPE_USED)); }catch(e){} hideSwipeHint(); }
function bumpNext(){ if(!swipeHintEligible()) return; SWIPE_NEXTS++; if(SWIPE_NEXTS%3===0) showSwipeHint(); }   // still tapping Next after 3 → remind them they can swipe
function showSwipeHint(){ if(!swipeHintEligible()||document.getElementById('mbSwipeHint')) return;
  var d=document.createElement('div'); d.id='mbSwipeHint';
  d.innerHTML='<div class="shcard"><div class="shhand"></div></div><div class="shtxt">Swipe left for the next card</div>';
  document.body.appendChild(d);
  clearTimeout(window._shT); window._shT=setTimeout(hideSwipeHint,3800);
}
function hideSwipeHint(){ var d=document.getElementById('mbSwipeHint'); if(d){ d.style.opacity='0'; setTimeout(function(){ if(d&&d.parentNode)d.remove(); },260); } }
function swipeAct(dir){
  if(!/^#\/(study|review|hard)/.test(location.hash)||!S) return;
  const it=S.items[S.order[S.i]]; if(!it) return;
  if(dir==='up') return;                                                  // up does nothing — starring by accident was too easy
  markSwipeUsed();                                                        // a left/right swipe = feature learned
  if(dir==='right'){ if(S.i>0){ _mbViaSwipe=true; step(-1); } return;
  }   // previous
  if(dir==='left'){                                                       // next / skip
    _mbViaSwipe=true;
    if(isMcqCard(it)){ mcqNext(); }
    else if(!S.show){ reveal(); }                                         // flip: first swipe reveals
    else if(S.i<S.items.length-1){ step(1); }
    return;
  }
}
(function(){
  var sx=0,sy=0,st=0,live=false;
  document.addEventListener('touchstart',function(e){
    live=false; if(window.innerWidth>720) return;
    if(!/^#\/(study|review|hard)/.test(location.hash)) return;
    if(e.touches.length!==1) return;
    var t=e.target;
    if(t&&t.closest&&t.closest('.vizmiss,.vizinlinehost,.vizctrl,input,select,textarea,.mcqopt,.ratebtns,.navbtns')) return;   // don't hijack controls/answers/video
    live=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now();
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!live) return; live=false;
    var t=e.changedTouches[0]; var dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>700) return;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ swipeAct(dx<0?'left':'right'); }
    else if(dy<-70 && Math.abs(dy)>Math.abs(dx)*1.5){ swipeAct('up'); }
  },{passive:true});
})();
document.addEventListener('keydown',e=>{
  const h=location.hash;
  if(/^#\/exam/.test(h) && S && S.mode==='exam' && !S.finished && S.items.length){   // exam keys
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const c=S.items[S.order[S.i]].c;
    if(/^[1-9]$/.test(e.key)){ const idx=+e.key-1; if(idx<c.opts.length) examPick(idx); return; }
    if(e.key==='ArrowRight'){ examNav(1); return; }
    if(e.key==='ArrowLeft'){ examNav(-1); return; }
    return;
  }
  if(!/^#\/(study|review|hard)/.test(h)) return;
  if(!S) return;
  const it=S.items[S.order[S.i]], canRate=it && it.deck!=='primer';
  if(isMcqCard(it)){                                   // MCQ keyboard flow
    if(e.code==='Space'){ e.preventDefault(); if(!S.opts) showOpts(); else if(S.pick!=null) mcqNext(); return; }
    if((e.key==='o'||e.key==='O') && !S.opts){ showOpts(); return; }
    if(S.opts && S.pick==null && /^[1-9]$/.test(e.key)){ const idx=+e.key-1; if(idx<it.c.opts.length) pickOpt(idx); return; }
    if(e.key==='ArrowRight'){ mcqNext(); return; }     // skip (or next after answering)
    if(e.key==='ArrowLeft'){ step(-1); return; }       // previous
    if(e.key==='s'||e.key==='S'){ shuffle(); return; } // shuffle
    return;
  }
  if(e.code==='Space'){ e.preventDefault(); reveal(); return; }
  if(canRate && S.show){ if(e.key==='1')rateCard(false); if(e.key==='2')rateCard(true); return; }
  if(!canRate && (S.mode==='daily'||S.mode==='hard') && S.show){ if(e.key==='ArrowRight')sessionNext(); return; }
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
});

/* ---------- jump back in / weekly progress ---------- */
function weekDayStrs(){                       // dates of the current week (Sun→today), oldest→newest
  const today=new Date(); const start=new Date(today); start.setDate(start.getDate()-start.getDay());
  const out=[]; for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)) out.push(dstr(new Date(d)));
  return out;
}
function weekProgress(){
  const days=weekDayStrs(), touched=new Set();
  days.forEach(d=>Object.keys(DATA.dayTopics[d]||{}).forEach(id=>touched.add(id)));
  let complete=0, inprog=0;
  touched.forEach(id=>{ if(status(id)==='complete') complete++; else inprog++; });
  const notStarted = allTopics.filter(t=>t.ready && status(t.id)==='notstarted').length;
  return {touched:touched.size, complete, inprog, notStarted};
}
function dayLabel(ds){
  if(ds===dstr()) return 'Today';
  if(ds===yesterdayStr()) return 'Yesterday';
  return new Date(ds+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
}
function pageJumpback(){
  const wp=weekProgress();
  const days=Object.keys(DATA.dayTopics).filter(d=>Object.keys(DATA.dayTopics[d]||{}).length)
                .sort().reverse().slice(0,14);
  const blocks = days.map(ds=>{
    const ids=Object.keys(DATA.dayTopics[ds]);
    const rows=ids.map(id=>{ const t=topById(id); if(!t) return '';
      const s=status(id), chip = s==='complete'?'<span class="jb-st done">✓ completed</span>'
        : s==='inprogress'?'<span class="jb-st learn">◐ in progress</span>':'<span class="jb-st new">○ touched</span>';
      return `<div class="jb-row" onclick="go('topic/${t.id}')">
        <span class="jb-name">${esc(t.name)}</span>${chip}
        <button class="btn" onclick="event.stopPropagation();go('study/${t.id}/recall')">Continue →</button></div>`;
    }).join('');
    const done=ids.filter(id=>status(id)==='complete').length;
    return `<div class="jb-day"><div class="jb-dh"><b>${dayLabel(ds)}</b>
        <span>${ids.length} topic${ids.length===1?'':'s'} · ${done} completed</span></div>${rows}</div>`;
  }).join('');
  return `<h1>↩ Jump back in</h1>
    <p class="sub">Pick up where you left off — the topics you touched each day.</p>
    <div class="wkcard">
      <div class="wktitle">This week so far</div>
      <div class="wkmetrics">
        <div class="wm"><b style="color:var(--ped)">${wp.complete}</b><span>completed</span></div>
        <div class="wm"><b style="color:var(--com)">${wp.inprog}</b><span>in progress</span></div>
        <div class="wm"><b>${wp.touched}</b><span>topics touched</span></div>
      </div>
    </div>
    ${blocks || '<div class="alldone" style="margin-top:20px"><div class="big">◔</div><b>Nothing yet.</b><p>Study a topic and it will show up here so you can jump back to it.</p></div>'}`;
}

/* ---------- search ---------- */
let SQ='';
function pageSearch(){
  return `<h1>Search</h1>
    <input id="sbox" class="sbox" placeholder="Search topics, lecturers, or card questions…"
      oninput="SQ=this.value;searchRun()" value="${esc(SQ)}">
    <div id="sres"></div>`;
}
function searchRun(){
  const box=document.getElementById('sres'); if(!box) return;
  const q=SQ.trim().toLowerCase();
  if(q.length<2){ box.innerHTML='<p class="sub">Type at least 2 letters.</p>'; return; }
  const topics=allTopics.filter(t=>((t.name+' '+t.lecturer)||'').toLowerCase().includes(q)).slice(0,25);
  const cardHits=[];
  allTopics.forEach(t=>{ if(!t.ready) return;
    ['primer','recall'].forEach(dk=>(t[dk]||[]).forEach(c=>{
      if((c.q||'').toLowerCase().includes(q)) cardHits.push({t,dk,c});
    }));
  });
  let h='';
  if(topics.length){
    h+=`<div class="modhead">Topics · ${topics.length}</div><div class="rows">${topics.map(t=>topicRow(t,true)).join('')}</div>`;
  }
  if(cardHits.length){
    h+=`<div class="modhead" style="margin-top:26px">Card questions · ${cardHits.length}</div><div class="rows">`+
      cardHits.slice(0,40).map(x=>`
       <div class="row" onclick="go('study/${x.t.id}/${x.dk}')">
         <span class="sn">${x.dk==='primer'?'A':'B'}</span>
         <span class="mid"><span class="tt">${esc(x.c.q)}</span>
           <div class="meta">${esc(x.t.name)} · ${x.dk==='primer'?'Primer':'Recall'}</div></span></div>`).join('')+
      `</div>${cardHits.length>40?`<p class="sub" style="margin-top:10px">Showing first 40 of ${cardHits.length}.</p>`:''}`;
  }
  if(!topics.length && !cardHits.length) h=`<div class="empty">No matches for “${esc(SQ)}”.</div>`;
  box.innerHTML=h;
}

/* ---------- settings ---------- */
function setGoal(v){ v=Math.max(5,Math.min(300,parseInt(v)||40)); DATA.daily.goal=v; if(DATA.daily.floor>v)DATA.daily.floor=v; persist(); render(); }
function setFloor(v){ v=Math.max(1,Math.min(DATA.daily.goal,parseInt(v)||10)); DATA.daily.floor=v; persist(); render(); }

function importData(input){ const f=input.files&&input.files[0]; if(!f) return; const rd=new FileReader();

      if(!d||typeof d!=='object'||(!('cards'in d)&&!('log'in d)&&!('streak'in d))) throw new Error('Not a MedBank backup file');

/* ---- automatic backup to a file (File System Access API) ---- */
function idbSet(k,v){ return new Promise((res,rej)=>{ const o=indexedDB.open('medbank_fs',1);
  o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains('h')) o.result.createObjectStore('h'); };
  o.onsuccess=()=>{ const tx=o.result.transaction('h','readwrite'); tx.objectStore('h').put(v,k);
    tx.oncomplete=()=>{o.result.close();res();}; tx.onerror=()=>rej(tx.error); }; o.onerror=()=>rej(o.error); }); }
function idbGet(k){ return new Promise((res,rej)=>{ const o=indexedDB.open('medbank_fs',1);
  o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains('h')) o.result.createObjectStore('h'); };
  o.onsuccess=()=>{ const tx=o.result.transaction('h','readonly'); const r=tx.objectStore('h').get(k);
    r.onsuccess=()=>{o.result.close();res(r.result);}; r.onerror=()=>rej(r.error); }; o.onerror=()=>rej(o.error); }); }
let _bakHandle=null,_bakTimer=null,_bakBusy=false,_bakPaused=false;
function fsSupported(){ return typeof window.showSaveFilePicker==='function'; }
async function _perm(h,req){ if(!h||!h.queryPermission) return false; const o={mode:'readwrite'};
  if((await h.queryPermission(o))==='granted') return true;
  if(req && (await h.requestPermission(o))==='granted') return true; return false; }
async function writeBackup(force){
  if(_bakBusy||!_bakHandle||!DATA.settings.autoBackup) return;
  _bakBusy=true;
  try{
    if(await _perm(_bakHandle,!!force)){
      const ws=await _bakHandle.createWritable(); await ws.write(JSON.stringify(DATA)); await ws.close();
      _bakPaused=false; DATA.settings.lastBackup=Date.now();
      try{ localStorage.setItem(SKEY,JSON.stringify(DATA)); }catch(e){}   // persist timestamp without re-scheduling
    } else { _bakPaused=true; }
  }catch(e){ _bakPaused=true; }
  _bakBusy=false;
}
function scheduleBackup(){ if(!DATA.settings.autoBackup||!_bakHandle) return;
  clearTimeout(_bakTimer); _bakTimer=setTimeout(()=>writeBackup(false),1200); }   // debounced auto-save
async function enableAutoBackup(){
  if(!fsSupported()){ alert('Automatic file backup needs Chrome or Edge (works on Android Chrome and desktop). On this browser, use Export / Import below instead.'); return; }
  try{
    const h=await window.showSaveFilePicker({suggestedName:'medbank-backup.json',
      types:[{description:'MedBank backup',accept:{'application/json':['.json']}}]});
    _bakHandle=h; _bakPaused=false; await idbSet('bakHandle',h);
    DATA.settings.autoBackup=true; persist(); await writeBackup(true); render();
  }catch(e){ /* user cancelled the file picker */ }
}
async function disableAutoBackup(){ DATA.settings.autoBackup=false; persist(); _bakHandle=null;
  try{ await idbSet('bakHandle',null); }catch(e){} render(); }
async function resumeAutoBackup(){ await writeBackup(true); render(); }
async function initAutoBackup(){
  if(!DATA.settings.autoBackup||!fsSupported()) return;
  try{ const h=await idbGet('bakHandle'); if(h){ _bakHandle=h; _bakPaused=!(await _perm(h,false));
    if(!_bakPaused) writeBackup(false); render(); } }catch(e){}
}
async function shareBackup(){
  try{
    const file=new File([JSON.stringify(DATA)],'medbank-backup-'+dstr()+'.json',{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file],title:'MedBank backup'});
    else exportData();
  }catch(e){ if(e&&e.name!=='AbortError') exportData(); }
}
async function copyBackup(){
  const txt=JSON.stringify(DATA);
  try{ await navigator.clipboard.writeText(txt);
    alert('Backup copied. Now open MedBank in the OTHER browser → Settings → "Restore from text" → paste → Restore.');
  }catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); alert('Backup copied. Paste it into "Restore from text" in the other browser.'); }
    catch(e2){ alert('Copy failed — use Export or Share instead.'); }
  }
}
function restoreFromText(){

    if(!confirm('Restore this backup? It REPLACES all current progress on THIS device.')) return;

function backupRel(){ const t=DATA.settings.lastBackup; if(!t) return 'not yet';
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago';
  if(s<86400) return Math.floor(s/3600)+' h ago'; return Math.floor(s/86400)+' d ago'; }

function testNudge(){

function explainPrompt(snippet, topicName){
  return `A 500-level medical student in Nigeria is reading a lecture note on "${topicName}" and highlighted this passage to be taught:

"""${snippet}"""

Teach the meaning and content of this passage, in the context of "${topicName}", as if I have ZERO prior knowledge. Never assume I already understand any medical, scientific or technical term. Your goal is not just to answer but to build my understanding from the ground up. Follow this teaching method every time:

1. Start from first principles — begin with the absolute basics; explain what it is before how or why it works.
2. Explain every unfamiliar term the moment you use it (e.g. atrium, ventricle, thrombus, preload, stenosis, myocardium): what the word literally means, where it comes from (prefix/suffix roots) if helpful, and why it matters here. Never leave a technical word unexplained.
3. Build gradually in small logical steps that each lead into the next (Step 1: What is it? Step 2: Why does it exist? Step 3: How does it normally work? Step 4: What goes wrong? Step 5: What happens next? Step 6: Why does that lead to the symptoms, investigation or treatment?). Don't jump ahead.
4. Spell out the cause-and-effect chain — for every concept explain WHY each event causes the next, link by link, skipping nothing (use arrow chains like: heart failure -> pumps less blood -> blood backs up -> pressure rises -> fluid leaks into lungs -> shortness of breath).
5. Use simple everyday analogies (water pipes, pumps, balloons, traffic jams, rivers, plumbing, doors, filters) so I can visualise what is happening.
6. Connect everything together — at the end of each section, explain how it fits the big picture of the topic.
7. For any test mentioned (ECG, echo, BNP, CT, MRI, blood tests, etc.): what the test actually measures, why it was invented, what abnormality it looks for, why it is useful, what a positive/abnormal result means, and how that result changes diagnosis or treatment.
8. For diseases, always go normal -> abnormal: normal anatomy, normal physiology, what changes in disease, why those changes occur, and the consequences of those changes.
9. If the passage is an MCQ: explain why the correct answer is correct AND why every incorrect option is wrong and what each wrong option would actually indicate instead.
10. Finish with memory aids: a one-line exam answer, a simple summary, an easy mnemonic, a few high-yield exam points, and common exam traps with how to avoid them.
11. Use simple ASCII diagrams, arrows, flowcharts or tables (in markdown — use fenced code blocks for ASCII diagrams and pipe tables for tables) whenever they help me visualise the process.
12. Never assume prior knowledge — teach an intelligent beginner who has never studied this before, layer by layer, until even complex concepts feel obvious.
13. Prioritise understanding over memorisation — don't just tell me facts, help me understand WHY they are true, so I can reason out the answer even if I forget the exact wording.
14. Make me think — occasionally ask a short question ("If the valve is narrowed, what do you think happens to the blood behind it?") and then explain the answer so I actively learn.

Writing style: be patient and conversational, use plain English, avoid unnecessary jargon, never rush, build one concept at a time, and assume I know nothing at first — like a great professor teaching one student. The goal is deep understanding, not memorising for an exam. Make the explanation as long and detailed as necessary. Format with markdown: headings, bold, bullet points, pipe tables, and fenced code blocks for any ASCII diagrams or flowcharts.`;
}

async function aiRun(prompt){

          headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},

  // Offline / not-signed-in fallback: Puter (free, browser SDK).

        if(acc.trim()) return;

        const txt=(r2&&r2.message&&r2.message.content&&r2.message.content[0]&&r2.message.content[0].text)||(typeof r2==='string'?r2:'');
        if(txt.trim()){ setExplBodyMd(txt); return; }
      }catch(e){ /* fall through to error */ }

    setExplBody('<p>Could not reach the AI service. Check your internet and try again.</p>');
  });
}

    <div class="explload" style="justify-content:center"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></div>

}
function render(){
  const p=(location.hash.slice(2)||'home').split('/');
  // Topic-bound routes: if content hasn't loaded yet, show a loader instead of flashing Home.
  const NEEDS_TOPIC={topic:1,study:1,cram:1,cards:1,ai:1};
  if(NEEDS_TOPIC[p[0]] && p[1] && !window.__MB_CONTENT_READY && typeof topById==='function' && !topById(p[1])){
    $('#main').innerHTML=pageLoadingTopic(); renderNav(); PREV_BASE=p[0]; return;
  }
  let html;
  switch(p[0]){
    case 'duenow': case 'inprogress': case 'completed': html=pageStatusList(p[0]); break;
    case 'plan':      html=pagePlan(); break;
    case 'today':     html=pageToday(); break;
    case 'review':    html=pageReview(); break;
    case 'hardnudge': if(!S||S.key!=='hardquick') startHardQuick(); html=pageHard(); break;
    case 'nudge':     if(!S||S.key!=='nudge') startNudgeSession(); html=pageReview(); break;
    case 'hard':      html=pageHard(); break;
    case 'leeches':   html=pageLeeches(); break;
    case 'mistakes':  html=pageMistakes(); break;
    case 'exam':      html=pageExam(); break;
    case 'ai':        html=pageAI(p[1]); break;
    case 'cram':      html=pageCram(p[1]); break;
    case 'week':      html=pageWeek(); break;
    case 'jumpback':  html=pageJumpback(); break;
    case 'search':    html=pageSearch(); break;
    case 'settings':  html=pageSettings(); break;
    case 'admin':     html=pageAdmin(); break;
    case 'vizadmin':  html=pageVizAdmin(); break;
    case 'builder':   html=pageBuilder(); break;
    case 'subject':   html=pageSubject(p[1]); break;
    case 'lecturers': html=pageLecturers(); break;
    case 'folders':   html=pageFolders(); break;
    case 'folder':    html=pageFolder(p[1]); break;
    case 'solve':     html=pageSolve(); break;
    case 'lecturer':  html=pageLecturer(p[1]); break;
    case 'topic':     html=pageTopic(p[1]); break;
    case 'cards':     html=pageCards(p[1]); break;
    case 'study':     html=pageStudy(p[1],p[2]); break;
    default:          html=pageHome();
  }
  if(p[0]==='today'||p[0]==='hard'||p[0]==='mistakes'||p[0]==='leeches') html = recallTabs(p[0]) + html;
  $('#main').innerHTML=html; renderNav();
  $('#main').classList.toggle('wide', p[0]===''||p[0]==='home');   // home fills the wide screen (no Ask-AI panel here)
  if(p[0]==='settings' && window.loadPlanBadge) setTimeout(loadPlanBadge,40);
  if(p[0]==='search'){ const b=$('#sbox'); if(b){ searchRun(); b.focus(); b.setSelectionRange(b.value.length,b.value.length); } }
  if(p[0]==='ai') aiScroll();
  if(p[0]==='topic' && window.markWatchedNote) setTimeout(window.markWatchedNote,30);
  if(window.scheduleVizTeaser) scheduleVizTeaser(p[0]==='topic'?p[1]:null);   // teaser waits ~1 min of reading, then plays once
  if(/^(study|review|hard)$/.test(p[0]) && !/^(study|review|hard)$/.test(PREV_BASE)) setTimeout(showSwipeHint,700);   // teach swipe-to-next on entering a card session
  PREV_BASE=p[0];
  if(_examTimer){ clearInterval(_examTimer); _examTimer=null; }
  if(p[0]==='exam' && S && S.mode==='exam' && !S.finished && S.items && S.items.length){
    _examTimer=setInterval(()=>{ const el=document.querySelector('.extime');
      if(!el||!S||S.finished){ clearInterval(_examTimer); _examTimer=null; return; }
      const s=Math.floor((Date.now()-S.started)/1000);
      el.textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); },1000);
  }
  try{ if((p[0]||'home')==='home') maybeOnboard(); }catch(e){}
}

/* force the newest version: clear caches, update the worker, reload */
let _updating=false;
async function forceUpdate(){
  if(_updating) return; _updating=true;
  const b=document.getElementById('updbtn'); if(b){ b.textContent='Updating…'; }
  try{
    if('caches' in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){ try{ await reg.update(); }catch(e){} if(reg.waiting) reg.waiting.postMessage({type:'skipWaiting'}); }
    }
  }catch(e){}
  setTimeout(()=>{ try{ location.reload(); }catch(e){ location.href=location.href; } }, 250);
}
function showUpdateBanner(){
  if(document.getElementById('updbanner')) return;
  const b=document.createElement('div'); b.id='updbanner'; b.className='updbanner';
  b.innerHTML=`<span>🔄 A new version of MedBank is ready.</span>
     <button class="btn primary" onclick="forceUpdate()">Refresh now</button>
     <button class="btn" onclick="this.parentNode.remove()">Later</button>`;
  document.body.appendChild(b);
}

function swPing(type,extra){ try{ if(navigator.serviceWorker&&navigator.serviceWorker.controller)
  navigator.serviceWorker.controller.postMessage(Object.assign({type},extra||{})); }catch(e){} }
async function setupReminder(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const every=Math.max(5,(DATA.settings.remindMins||120))*60e3;
    if('periodicSync' in reg){
      const st=await navigator.permissions.query({name:'periodic-background-sync'}).catch(()=>({state:'denied'}));
      if(st.state==='granted'){ try{ await reg.periodicSync.register('medbank-nudge',{minInterval:every}); }catch(e){} }
    }
    // pre-stage current cards so a background notification can carry them
    const items=nudgeItems(10); if(items.length) swPing('payload',{body:nudgeBody(items),url:'./app.html#/nudge'});
  }catch(e){}
}
if('serviceWorker' in navigator){
  // when a new worker takes control, reload once to load the fresh app
  let _swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_swReloaded)return; _swReloaded=true; location.reload(); });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(reg=>{
    // detect a newly downloaded version and offer to refresh
    reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw)return;
      nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBanner(); }); });
    if(DATA.settings.remindOn) setupReminder();
    if(DATA.settings.useIdle) startIdle(false);
    swPing('hardcount',{n:starCount()});     // keep the SW's hard-card count current
    // catch-up nudge on open, then a recurring check every minute
    setTimeout(()=>nudgeTick(false), 1500);
    setInterval(()=>nudgeTick(false), 60e3);
  }).catch(()=>{}); });
  // re-check whenever the app is brought back to the foreground
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') nudgeTick(false); });
}

/* ---- edge-swipe to open/close the sidebar on touch devices ---- */
(function(){
  let x0=null,y0=null,t0=0,tracking=false;
  const isMobile=()=>window.matchMedia('(max-width:820px)').matches;
  document.addEventListener('touchstart',e=>{
    if(!isMobile()||e.touches.length!==1){tracking=false;return;}
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now();
    const open=document.body.classList.contains('navopen');
    // track an open-swipe only if it begins near the left edge, or any swipe while the menu is open
    tracking = open || x0 < Math.min(46, window.innerWidth*0.12);
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!tracking||x0==null){x0=y0=null;return;}
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    const open=document.body.classList.contains('navopen');
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6 && (Date.now()-t0)<700){
      if(dx>0 && !open) document.body.classList.add('navopen');    // swipe right → open
      else if(dx<0 && open) document.body.classList.remove('navopen'); // swipe left → close
    }
    x0=y0=null; tracking=false;
  },{passive:true});
})();
