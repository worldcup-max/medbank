     never interrupts reading. When ready it surfaces a "watch" pill and a play-when-you-want player. */
  function mountInline(bp,text,topicId,hostId,poster){                           // render the paused inline player into hostId
    var host=document.getElementById(hostId); if(!host) return null;
    BP=bp; SRC=text||''; applyLayout(bp);
    VIZ_TID=topicId||''; vizScore={c:0,n:0,streak:0,best:0}; _missed=[];
    host.innerHTML='<div class="vizready">✓ Your explainer is ready — press ▶ to see how to reach the answer.</div>'
      +'<div class="vizbody vizinlinebody" id="vizBody"></div>';
    mountPlayer();                                                              // paused at step 0
    var _b=host.querySelector('.vizsrc'); if(_b)_b.remove();                    // inline: drop the "Highlighted:" source banner (student doesn't need it)
    if(poster){ var stg=document.getElementById('vizStage'); if(stg){         // video-style poster with a big play button
      var pv=document.createElement('div'); pv.className='vizposter';
      pv.innerHTML='<div class="vpbtn">▶</div><div class="vplab">Watch how to reach the answer</div>';
      stg.appendChild(pv); pv.onclick=function(){ try{ if(!playing)play(); }catch(e){} }; } }
    return host;
  }
  window.aiVisualizeInline=async function(text, topicName, topicId, hostId, cardId){
    var host=document.getElementById(hostId); if(!host) return;
    host.innerHTML='<div class="vizgen"><div class="vizgenspin"><i></i><i></i><i></i></div>'
      +'<div class="vizgentxt"><b>Building your explainer…</b><span>Keep reading — I\'ll let you know the moment it\'s ready.</span></div></div>';
    try{
      var resp=await fetchBlueprint(text, topicName); var bp=resp&&resp.blueprint;
      if(!document.getElementById(hostId)) return;                              // student already moved on
      if(!bp||!bp.narration_steps||!bp.narration_steps.length){ var he=document.getElementById(hostId); if(he)he.innerHTML='<div class="vizgen err">Couldn\'t build this one — try the next card.</div>'; return; }
      recordViz(topicId||'', text);
      if(cardId){ try{ window.DATA=window.DATA||{}; DATA.cardViz=DATA.cardViz||{}; DATA.cardViz[cardId]={bp:bp,text:text,ts:Date.now()}; if(window.persist)persist(); if(window.MB_SYNC&&MB_SYNC.flush)MB_SYNC.flush(); }catch(e){} }   // saved to THIS card, pushed immediately
      var host2=mountInline(bp,text,topicId,hostId,true);
      try{ setQuota(resp.viz_quota); }catch(e){}
      if(host2)showReadyPill(host2);
    }catch(e){ var h=document.getElementById(hostId); if(h) h.innerHTML='<div class="vizgen err">'+esc((e&&e.message)||'Something went wrong')+'</div>'; }
  };
  window.aiVisualizeInlineSaved=function(cardId, topicId, hostId){               // replay the card's saved explainer — instant, no rebuild
    var rec=(window.DATA&&DATA.cardViz)?DATA.cardViz[cardId]:null; if(!rec||!rec.bp) return;
    var host=mountInline(rec.bp, rec.text||'', topicId, hostId);
    if(host){ setTimeout(function(){ try{ if(!playing)play(); }catch(e){} },300); }   // explicit "watch" → start playing
  };
  function showReadyPill(host){
    var old=document.getElementById('vizReadyPill'); if(old)old.remove();
    function inView(){ try{ var r=host.getBoundingClientRect(); return r.top<(window.innerHeight-90)&&r.bottom>60; }catch(e){ return true; } }
    if(inView()) return;                                                         // already on screen — no pill needed
    var pill=document.createElement('div'); pill.id='vizReadyPill'; pill.className='vizreadypill';
    pill.innerHTML='🎬 Your explainer is ready ↓';
    pill.onclick=function(){ try{host.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){} pill.remove(); setTimeout(function(){ try{ if(!playing)play(); }catch(e){} },700); };
    document.body.appendChild(pill);
    var iv=setInterval(function(){ if(!document.getElementById('vizReadyPill')){clearInterval(iv);return;} if(inView()){ pill.remove(); clearInterval(iv); } },700);
    setTimeout(function(){ if(pill&&pill.parentNode)pill.remove(); clearInterval(iv); },15000);
  }
  /* stop any inline playback + pill when the student leaves the card (called by the nav functions) */
  window.vizInlineStop=function(){ try{ if(document.getElementById('vizov')) return; }catch(e){}   // don't touch the modal player
    try{ stop(); }catch(e){} try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
    var p=document.getElementById('vizReadyPill'); if(p)p.remove(); };

  /* ---- saved-per-note "Watch" markers ---- */
  window.currentTopicId=function(){ var p=(location.hash.slice(2)||'').split('/'); return (p[0]==='topic'&&p[1])?p[1]:''; };
  window.currentTopicSubject=function(){ try{ var id=window.currentTopicId(); var t=(window.topById?topById(id):null); return (t&&t.subject&&t.subject.name)||''; }catch(e){ return ''; } };

  /* ===== In-note "Visualize" teaser — a ~7s silent demo of the feature, matched to the subject.
     VIZ_DEMOS is the record/library of demo blueprints; scheduled subject builds add their own. ===== */
  var VIZ_DEMOS = {
    "default":{layout:"flow",meta:{title:""},nodes:[
      {id:"a",label:"Tissue injured",note:"the trigger",kind:"trigger"},
      {id:"b",label:"Histamine released",note:"from mast cells",kind:"process"},
      {id:"c",label:"Vessels widen & leak",note:"more blood flow",kind:"product"},
      {id:"d",label:"Redness, heat, swelling",note:"the inflammation signs",kind:"outcome"}],
      narration_steps:[{reveal:["a"],active:["a"],point:"a"},{reveal:["b"],active:["b"],point:"b"},{reveal:["c"],active:["c"],point:"c"},{reveal:["d"],active:["d"],point:"d"}]},
    "chem":{layout:"flow",meta:{title:""},nodes:[
      {id:"an",label:"Anode (−)",note:"oxidation: loses e−",kind:"trigger"},
      {id:"wi",label:"e− through wire",note:"anode → cathode",kind:"process"},
      {id:"ca",label:"Cathode (+)",note:"reduction: gains e−",kind:"product"},
      {id:"cu",label:"Current flows",note:"electricity!",kind:"outcome"}],
      narration_steps:[{reveal:["an"],active:["an"],point:"an"},{reveal:["wi"],active:["wi"],point:"wi"},{reveal:["ca"],active:["ca"],point:"ca"},{reveal:["cu"],active:["cu"],point:"cu"}]},
    /* MATHEMATICS — the flagship calculus teaser: a secant closing onto the tangent.
       Silent, ~7s, four beats: the curve → a secant (average rate) → a closer secant → the tangent
       (the instantaneous rate, i.e. the derivative). */
    "math":{layout:"graph",meta:{title:""},x:{min:0,max:3.4,label:"x"},y:{min:0,max:10,label:"y = x²"},
      curves:[{id:"c",color:"#7c3aed",points:[[0,0],[0.5,0.25],[1,1],[1.5,2.25],[2,4],[2.5,6.25],[3,9]]},
              {id:"s1",color:"#94a3b8",label:"secant — average slope 4",points:[[1,1],[3,9]]},
              {id:"s2",color:"#2563eb",label:"secant — slope 3",points:[[1,1],[2,4]]},
              {id:"t",color:"#dc2626",label:"tangent — slope 2 = the derivative",points:[[0.4,-0.2],[3,5]]}],
      markers:[{id:"P",at:[1,1],label:"P",color:"#4b2c91",drop:true},{id:"Q",at:[3,9],label:"Q slides in →",color:"#94a3b8"}],
      narration_steps:[{reveal:["c","P"],active:["P"],point:"P"},
                       {reveal:["s1","Q"],active:["s1"],point:"Q"},
                       {reveal:["s2"],active:["s2"],point:"P"},
                       {reveal:["t"],active:["t"],point:"P"}]},
    /* a second maths teaser using the ported unit-circle renderer */
    "trig":{layout:"unitcircle",meta:{title:""},angle:52,
      narration_steps:[{reveal:["circle"],active:["circle"],point:"circle"},
                       {reveal:["radius"],active:["radius"],point:"radius"},
                       {reveal:["cos"],active:["cos"],point:"cos"},
                       {reveal:["sin"],active:["sin"],point:"sin"},
                       {reveal:["identity"],active:["identity"],point:"identity"}]}
  };
  VIZ_DEMOS["Mathematics"]=VIZ_DEMOS["math"];   // explicit per-subject key (subject names come through verbatim)
  window.VIZ_DEMOS = VIZ_DEMOS;   // scheduled subject builds append their demo here
  var _tzT=null,_tzK=0,_tzBP=null;
  function teaserDraw(el,k){ if(!el||document.getElementById('vizov')||document.getElementById('obov'))return;   // pause while the real player / onboarding is open
    _tzBP._render=undefined; BP=_tzBP;
    try{ applyLayout(BP); }catch(e){}
    var TSV={graph:graphSVG,tree:treeSVG,flow:flowSVG,venn:vennSVG,unitcircle:unitCircleSVG,solve:solveSVG,vectors:vectorsSVG,matrix:matrixSVG};
    var fn=TSV[BP.layout]||flowSVG; try{ el.innerHTML=fn(k); }catch(e){} }
  window.hasUsedViz=function(){ try{
    if(window.DATA&&DATA.viz&&Object.keys(DATA.viz).some(function(k){return (DATA.viz[k]||[]).length>0;})) return true;
    if(window.DATA&&DATA.cardViz&&Object.keys(DATA.cardViz).length>0) return true;
    return false;
  }catch(e){ return false; } };
  /* a sample sentence per subject family — what the cursor "highlights" in the demo */
  var VT_SENT={
    "default":"Injured tissue releases histamine, so nearby vessels widen and leak — causing redness, heat and swelling.",
    "chem":"A galvanic cell turns a spontaneous redox reaction into a flow of electric current.",
    "math":"The gradient of the curve y = x² at any point is exactly twice the x-value." };
  function vtKey(subj){ return /organic|chem/i.test(subj)?"chem":/math|calcul|algebra|trig|statist|geometry|further maths/i.test(subj)?"math":"default"; }
  function vtCap(BP,k){ try{ var s=BP.narration_steps[k]||{}; var id=(s.active&&s.active[0])||(s.reveal&&s.reveal[0]);
    var n=(BP.nodes||[]).filter(function(x){return x.id===id;})[0]; if(n)return n.label+(n.note?' — '+n.note:''); }catch(e){} return (BP.meta&&BP.meta.title)||''; }
  var _vtTos=[];
  function vtT(ms,fn){ _vtTos.push(setTimeout(fn,ms)); }
  function closeVt(){ _vtTos.forEach(clearTimeout); _vtTos=[]; if(_tzT){clearInterval(_tzT);_tzT=null;} var o=document.getElementById('vtov'); if(o)o.remove(); }

  /* Scheduler: only after ~1 minute of actually reading the note do we bring in the demo. */
  var _vtTimer=null;
  window.scheduleVizTeaser=function(topicId){
    if(_vtTimer){clearTimeout(_vtTimer);_vtTimer=null;}
    try{ closeVt(); }catch(e){}
    if(!topicId) return;                                   // left the note view
    if(window.hasUsedViz && hasUsedViz()) return;          // already knows the feature
    var subj=(window.currentTopicSubject?currentTopicSubject():'')||'', skey=(subj||'general').toLowerCase();
    try{ if(DATA&&DATA.teaserSeen&&DATA.teaserSeen[skey])return; }catch(e){}   // once per subject
    _vtTimer=setTimeout(function(){ _vtTimer=null;
      try{ if(!window.currentTopicId||currentTopicId()!==topicId)return; }catch(e){ return; }   // still on this note?
      if(document.hidden) return;                          // reading (tab visible)
      if(document.getElementById('vizov')||document.getElementById('vtov')||document.getElementById('obov')) return;
      window.mountVizTeaser();
    }, 60000);   // 1 minute
  };

  /* The scripted demo: cursor sweeps a sentence → the Visualize button appears → cursor clicks it
     → the subject-matched explainer plays. Shown as a light popup, once per subject. */
  window.mountVizTeaser=function(){ try{
    if(window.hasUsedViz && hasUsedViz()) return;
    var subj=(window.currentTopicSubject?currentTopicSubject():'')||'', skey=(subj||'general').toLowerCase();
    try{ window.DATA=window.DATA||{}; DATA.teaserSeen=DATA.teaserSeen||{}; if(DATA.teaserSeen[skey])return; DATA.teaserSeen[skey]=1; if(window.persist)persist(); }catch(e){}
    var key=vtKey(subj); _tzBP=VIZ_DEMOS[key]||VIZ_DEMOS.default; _tzK=0;
    var sent=VT_SENT[key]||VT_SENT.default;
    var ov=document.createElement('div'); ov.className='vtov'; ov.id='vtov';
    ov.innerHTML='<div class="vtcard">'
      +'<div class="vthd"><b>🎬 Visualize</b><span>turn any line into a quick explainer</span><button class="vtx" id="vtX">✕</button></div>'
      +'<div class="vtphase" id="vtP1"><div class="vtnote"><span class="vttext" id="vtText">'+sent+'</span></div>'
        +'<button class="vtbtn" id="vtBtn">🎬 Visualize this</button>'
        +'<div class="vtcursor" id="vtCur"><svg viewBox="0 0 24 24"><path d="M5 2 L5 20 L10 15 L13 21.5 L15.6 20.4 L12.6 14 L19 14 Z" fill="#1c1830" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg></div></div>'
      +'<div class="vtphase2" id="vtP2" style="display:none"><div class="vtstage"><div id="vtStage"></div></div><div class="vtcap" id="vtCap"></div></div>'
      +'<button class="vtgot" id="vtGot">Got it — I\'ll try it ✨</button></div>';
    document.body.appendChild(ov);
    document.getElementById('vtX').onclick=closeVt;
    document.getElementById('vtGot').onclick=closeVt;
    ov.addEventListener('click',function(e){ if(e.target===ov)closeVt(); });

    var $id=function(id){return document.getElementById(id);};
    _vtTos=[];
    vtT(250,function(){ var t=$id('vtText'); if(t)t.classList.add('sel'); var c=$id('vtCur'); if(c){c.style.left='84%';c.style.top='30px';} });   // sweep the highlight, cursor trails the selection
    vtT(1550,function(){ var b=$id('vtBtn'); if(b)b.classList.add('show'); });                                        // the button appears
    vtT(1800,function(){ var c=$id('vtCur'); if(c){c.style.left='50%';c.style.top='86px';} });                        // cursor moves to it
    vtT(2450,function(){ var b=$id('vtBtn'); if(b)b.classList.add('clicked'); });                                     // click
    vtT(2800,function(){                                                                                              // → the explainer plays
      var p1=$id('vtP1'),p2=$id('vtP2'); if(p1)p1.style.display='none'; if(p2)p2.style.display='block';
      teaserDraw($id('vtStage'),0); var cap=$id('vtCap'); if(cap)cap.textContent=vtCap(_tzBP,0);
      var n=(_tzBP.narration_steps||[]).length;
      if(_tzT)clearInterval(_tzT);
      _tzT=setInterval(function(){ var e=$id('vtStage'); if(!e){clearInterval(_tzT);_tzT=null;return;}
        _tzK++; if(_tzK>=n){clearInterval(_tzT);_tzT=null; return;} teaserDraw(e,_tzK); var cp=$id('vtCap'); if(cp)cp.textContent=vtCap(_tzBP,_tzK); },1600);
    });
  }catch(e){} };

  /* ===== One-time onboarding: the first time a student opens a note, show the scripted
     "highlight → Visualize → diagram" moment once (skippable), then never again. ===== */
  window.showVizOnboarding=function(){ try{
    if(!window.localStorage) return; if(localStorage.getItem('mb_onboard_viz')==='1') return;
    if(document.getElementById('obov')) return;
    if(window.hasUsedViz&&window.hasUsedViz()){ localStorage.setItem('mb_onboard_viz','1'); return; }   // already knows the feature
    localStorage.setItem('mb_onboard_viz','1');
    var obBP={layout:"cell",anode:{label:"Zinc anode (−)",half:"Zn → Zn²⁺ + 2e⁻",sol:"ZnSO₄"},cathode:{label:"Copper cathode (+)",half:"Cu²⁺ + 2e⁻ → Cu",sol:"CuSO₄"},bridge:"salt bridge (KNO₃)",
      narration_steps:[{reveal:["anode","cathode"],active:[],point:"anode"},{reveal:["anode"],active:["anode"],point:"anode"},{reveal:["cathode"],active:["cathode"],point:"cathode"},{reveal:["wire"],active:["wire"],point:"wire"},{reveal:["bridge"],active:["bridge"],point:"bridge"},{reveal:["ions"],active:["ions"],point:"ions"}]};
    var caps=["Meet <b>Visualize</b> — turn any sentence in your notes into a short, narrated explainer.","Zinc is oxidised at the <b>anode</b> — the negative electrode.","Copper ions are reduced at the <b>cathode</b> — positive.","Electrons flow through the wire, <b>anode → cathode</b>.","The <b>salt bridge</b> keeps both sides neutral.","A steady <b>current</b> flows. Now you try — highlight any sentence!"];
    var ov=document.createElement("div"); ov.className="obov"; ov.id="obov";
    ov.innerHTML='<div class="obcard live"><div class="obhd"><b>🎬 Visualize</b><span class="obq">a 10-second tour</span><button class="obx" id="obSkip">Skip</button></div>'
      +'<div class="obsrc">Highlighted: “…oxidation at the <b>anode</b>, reduction at the <b>cathode</b>, and a <b>salt bridge</b> keeps both sides neutral.”</div>'
      +'<div class="obstage"><div id="obSvg"></div></div>'
      +'<div class="obcap"><div class="obtxt" id="obCap"></div><div class="obeq"><i></i><i></i><i></i><i></i><i></i></div></div>'
      +'<button class="obgot" id="obGot">Got it — let me try ✨</button></div>';
    document.body.appendChild(ov);
    var k=0; function draw(){ BP=obBP; var el=document.getElementById("obSvg"); if(el)try{el.innerHTML=cellSVG(k);}catch(e){}
      var c=document.getElementById("obCap"); if(c)c.innerHTML='<span class="oblab">STEP '+(k+1)+' / 6</span>'+caps[k]; }
    draw();
    var t=setInterval(function(){ if(!document.getElementById("obov")){clearInterval(t);return;} k++; if(k>=6){clearInterval(t);return;} draw(); },1900);
    function close(){ clearInterval(t); var o=document.getElementById("obov"); if(o)o.remove(); }
    document.getElementById("obGot").onclick=close; document.getElementById("obSkip").onclick=close;
    ov.addEventListener("click",function(e){ if(e.target===ov)close(); });
  }catch(e){} };
  function recordViz(topicId,text){
    if(!topicId){ try{ topicId=(location.hash.match(/#\/topic\/([^\/?#]+)/)||[])[1]||''; }catch(e){} }   // recover the topic id from the URL if it wasn't passed — never silently drop the video
    if(!topicId||!window.DATA)return; try{ DATA.viz=DATA.viz||{}; var a=DATA.viz[topicId]=DATA.viz[topicId]||[]; var t=(text||'').trim();
    if(t && !a.some(function(x){return x.text===t;})){ a.push({text:t,ts:Date.now()}); if(window.persist)persist();
      try{ if(window.MB_SYNC&&MB_SYNC.flush) MB_SYNC.flush(); }catch(e){} }   // push immediately — never let a reload beat the 1500ms debounce and lose the video
    if(window.markWatchedNote) setTimeout(window.markWatchedNote,60);   // show the highlight/▶watch chip right away, without re-opening the note
  }catch(e){} }
  window.markWatchedNote=function(){ try{
    var host=document.querySelector('#main .notebody'); if(!host)return;
    var tid=window.currentTopicId(); var list=(window.DATA&&DATA.viz&&DATA.viz[tid])||[]; if(!list.length)return;
    var name=(window.currentTopicName?currentTopicName():'');
    list.forEach(function(item){ wrapPhrase(host,item.text,tid,name); });
  }catch(e){} };
  function wrapPhrase(host,phrase,tid,name){ if(!phrase||phrase.length<4)return;
    // the full highlight often spans several DOM nodes (bold words split it), so match a
    // shortening prefix — sentence, first words, first chars — until one fits inside a single text node
    var s=phrase.trim(), cands=[], dot=s.search(/[.:;]\s/);
    if(dot>12) cands.push(s.slice(0,dot));
    cands.push(s.split(/\s+/).slice(0,8).join(' '));
    cands.push(s.slice(0,46).trim());
    cands.push(s.split(/\s+/).slice(0,5).join(' '));
    cands=cands.filter(function(c){return c&&c.length>=6;});
    var walker=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,null),node;
    while(node=walker.nextNode()){
      var pe=node.parentElement; if(pe&&pe.closest&&pe.closest('.vizmark'))continue;
      for(var ci=0;ci<cands.length;ci++){ var cand=cands[ci], idx=node.nodeValue.indexOf(cand); if(idx<0)continue;
        var before=node.nodeValue.slice(0,idx), match=node.nodeValue.slice(idx,idx+cand.length), after=node.nodeValue.slice(idx+cand.length);
        var span=document.createElement('span'); span.className='vizmark'; span.textContent=match;
        var chip=document.createElement('span'); chip.className='vizwatch'; chip.textContent='▶ watch'; chip.title='Replay this visualization';
        chip.onclick=(function(ph){return function(e){ e.stopPropagation(); window.aiVisualize(ph,name,tid); };})(phrase);
        var frag=document.createDocumentFragment();
        if(before)frag.appendChild(document.createTextNode(before));
        frag.appendChild(span); frag.appendChild(chip);
        if(after)frag.appendChild(document.createTextNode(after));
        node.parentNode.replaceChild(frag,node); return;   // mark first occurrence only
      }
    }
  }
})();
