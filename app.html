      +'<td style="padding:3px 6px;color:'+col(x.status)+';font-weight:600">'+esc(x.status||'')+'</td>'
      +'<td align="center" style="padding:3px 6px">'+(x.confidence!=null?x.confidence:'')+'</td>'
      +'<td align="center" style="padding:3px 6px">'+esc(x.matched_via||'')+'</td>'
      +'<td style="padding:3px 6px;color:#c0392b">'+esc(x.reason||'')+'</td>'
      +'<td align="center" style="padding:3px 6px">'+(x.served_count||0)+'</td>'
      +'<td style="padding:3px 6px;color:#666">'+esc((x.stem||'').slice(0,64))+'</td>'
      +'<td style="padding:3px 6px">'+((x.status==='candidate'||x.status==='served')?('<a href="#" onclick="taQuarantine(event,\''+esc(x.target_id||'')+'\',\''+esc(x.qh||'')+'\')" title="Withhold this retest" style="color:#b7791f">⚑ flag</a>'):'')+'</td></tr>';
  }).join('');
  el.innerHTML='<div class="sub" style="margin-bottom:8px"><b>'+(d.candidate||0)+'</b> candidate · <b>'+(d.served||0)+'</b> served · <b>'+(d.invalid||0)+'</b> invalid · <b>'+(d.quarantined||0)+'</b> quarantined · <b>'+(d.expired||0)+'</b> expired'
    +' &nbsp;|&nbsp; reject reasons: '+esc(reasons)
    +' &nbsp;|&nbsp; today: '+(b.generatedToday_allAccounts!=null?b.generatedToday_allAccounts:'?')+' generated (cap '+(b.dailyMaxPerAccount||'?')+'/account/day)</div>'
    +(rows?'<table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr style="text-align:left;color:#888"><th style="padding:3px 6px">target</th><th>status</th><th>conf</th><th>via</th><th style="padding:3px 6px">reason</th><th>served</th><th style="padding:3px 6px">stem</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<p class="sub">Pool is empty.</p>');
}catch(e){ if(btn){btn.disabled=false;btn.textContent='↻ Load retest pool';} var el=$('#taRetest'); if(el) el.textContent='Error: '+(e.message||e); } }
async function taQuarantine(ev, target_id, qh){ if(ev&&ev.preventDefault)ev.preventDefault();

  }catch(e){ alert('Failed: '+(e.message||e)); } }

/* ===== one engine, many filters — greedy time-budget over any card pool ===== */
function greedyBudget(ordered, budgetMin){
  const budget=budgetMin||DATA.daily.budget||15;
  let capped=ordered, over=0, estMs=0;
  if(budget>0){ const budgetMs=budget*60000; let cut=ordered.length;
    for(let k=0;k<ordered.length;k++){ const t=estCardMs(ordered[k].id,false);
      if(estMs+t<=budgetMs || k===0){ estMs+=t; } else { cut=k; break; } }
    capped=ordered.slice(0,cut); over=ordered.length-cut;
  } else { estMs=ordered.reduce((a,x)=>a+estCardMs(x.id,false),0); }
  return {capped, over, estMs, budget};
}

    return ((sb.lapses||0)-(sa.lapses||0)) || ((sa.due||0)-(sb.due||0)); });   // most-failed, then most-overdue
  const g=greedyBudget(pool, budgetMin);
  const items=g.capped.map(x=>({t:x.t,c:x.c,id:x.id,deck:'recall'}));
  if(!items.length) return 0;
  S={mode:'daily',key:key||'filtered',label:label||'',items,order:items.map((_,k)=>k),i:0,show:false,
     session:{done:0,correct:0,total:items.length,over:g.over}};

/* Habit-loop reminder copy: benefit-driven, specific, never guilt. Picks the right kind by context.
   Returns {title, body, url, kind}. kind 'save' = the single streak-rescue; 'pull' = the daily nudge. */
function habitNudge(){
  const hr=new Date().getHours();
  const st=curStreak(), met=streakMet(), due=dueCount(), frz=freezeState();
  const budget=DATA.daily.budget||15, sess=buildRecallSession(), sessN=sess.capped.length;
  const sTop={}; sess.capped.forEach(x=>{ if(x&&x.t) sTop[x.t.id]=1; }); const sTopics=Object.keys(sTop).length||1;
  const sMin=Math.max(1,Math.min(budget,Math.round((sess.estMs||0)/60000)));
  const lN=(DATA.streak&&DATA.streak.lastN!=null)?DATA.streak.lastN:(DATA.streak&&DATA.streak.last?dayNum(new Date(DATA.streak.last+'T00:00')):-1);
  const gap=lN<0?99:(dayNum()-lN);
  const exs=DB.subjects.map(sb=>({sb,d:examDays(sb.id)})).filter(x=>x.d!=null&&x.d>=0).sort((a,b)=>a.d-b.d);
  const ex=exs[0], url='./app.html#/today';
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  // Comeback — a freeze just bridged a missed day (morning-after "welcome back")
  if(DATA.streak && DATA.streak.freezeUsedOn===dstr()){
    return {title:`Streak freeze used — your ${st} days are safe`, body:`Welcome back. Keep it rolling — today's ${sMin}-minute session is ready.`, url, kind:'pull'};
  }
  // B — streak at risk: evening, streak alive, not yet met today. Always offer the off-ramp when a freeze is ready.
  if(st>=1 && !met && hr>=18){
    return frz==='ready'
      ? {title:`Your ${st}-day streak ends at midnight`, body:`2 minutes keeps it alive — and if today gets away from you, a streak freeze covers it automatically. No pressure.`, url, kind:'save'}
      : {title:`Your ${st}-day streak ends at midnight`, body:`Just 2 minutes keeps it alive. You've come too far to stop.`, url, kind:'save'};
  }
  // C — re-engagement: away 2+ days
  if(gap>=2){
    return (ex && ex.d<=120)
      ? {title:`${esc(ex.sb.name)} exam in ${ex.d} days`, body:`A little today beats cramming later. Start small — ~${sMin} min.`, url, kind:'pull'}
      : {title:`Your cards missed you`, body:`${due} are due. Pick up right where you left off — ~${sMin} min.`, url, kind:'pull'};
  }
  // D — positive reinforcement: morning, occasional, after a good day yesterday
  const yc=(DATA.log[dstr(new Date(Date.now()-864e5))]||{}).cards||0;
  if(hr<12 && yc>=5 && Math.random()<0.34){
    return {title:`You reviewed ${yc} cards yesterday`, body:`Keep the momentum — today's ${sMin}-minute session is ready.`, url, kind:'pull'};
  }
  // A — the morning pull (default), rotate variants
  const A=[
    {title:`Your ${sMin}-minute session is ready`, body:`${sessN} card${sessN===1?'':'s'} · ${sTopics} topic${sTopics===1?'':'s'}. Start your day one step ahead.`},
    {title:`${sTopics} topic${sTopics===1?'':'s'} ${sTopics===1?'is':'are'} fading from memory`, body:`Catch ${sTopics===1?'it':'them'} now before they slip. ~${sMin} min.`},
    {title:`Coffee + ${sMin} min = today's session done`, body:`Tap to start while it's fresh.`},
  ];
  const a=pick(A); return {title:a.title, body:a.body, url, kind:'pull'};
}

    const ac=new AC();
    [0,0.45,0.9].forEach(dt=>{ const o=ac.createOscillator(), g=ac.createGain();
      o.type='square'; o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime+dt;

      g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);

  }catch(e){}
}

/* Idle Detection (Android/Chrome): nudge sooner when the phone is unlocked & in use.

let _idleDet=null;
async function startIdle(requestIfNeeded){
  try{
    if(!DATA.settings.useIdle || !('IdleDetector' in window)) return;
    let state='denied';
    try{ state=(await navigator.permissions.query({name:'idle-detection'})).state; }catch(e){}
    if(state!=='granted'){
      if(!requestIfNeeded) return;
      const p=await window.IdleDetector.requestPermission();
      if(p!=='granted'){ DATA.settings.useIdle=false; persist(); return; }
    }
    if(_idleDet) return;                       // already watching
    _idleDet=new window.IdleDetector();
    _idleDet.addEventListener('change',()=>{
      // fire when the user is active AND the screen is unlocked = phone in use
      if(_idleDet.userState==='active' && _idleDet.screenState==='unlocked') nudgeTick(false);
    });
    await _idleDet.start({threshold:60000});
  }catch(e){}
}

/* the recurring check — fires a nudge every N minutes while conditions are met */
let _lastTickShown=0;
function nudgeTick(force){
  try{
    const s=DATA.settings;
    if(!s.remindOn) return;
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    const hr=new Date().getHours();
    /* SET-05: the active-hours window can legitimately wrap past midnight (a night-shift student
       sets 22 → 7). The old `hr<start || hr>=end` test was TRUE for all 24 hours in that case, so
       every nudge was silently suppressed forever. `start||7` also mis-read a valid midnight (0). */
    const qs=(s.quietStart==null?7:s.quietStart)|0, qe=(s.quietEnd==null?22:s.quietEnd)|0;
    const awake = (qs===qe) ? true : (qs<qe ? (hr>=qs && hr<qe) : (hr>=qs || hr<qe));
    if(!force && !awake) return;   // outside the student's active hours
    const every=Math.max(5,(s.remindMins||120))*60e3;
    const now=Date.now();
    if(!force && now-(s.lastNudge||0) < every) return;
    const items=nudgeItems(10);
    if(!items.length) return;                     // nothing to review — no nag
    const today=dstr(), n=habitNudge();
    // guardrail: at most one daily pull + one streak-save per day (never guilt-nag)
    if(!force){
      if(n.kind==='save'){ if(s.savedDay===today) return; }
      else { if(s.nudgedDay===today) return; }
    }

/* a card can only be an exam question if it has ≥2 options AND a valid integer answer index.
   `ans` is compared with === everywhere (pickOpt), so a string/undefined ans is unanswerable-forever. */
function examUsable(c){ return !!(c && c.opts && c.opts.length>1 && Number.isInteger(c.ans) && c.ans>=0 && c.ans<c.opts.length); }
function examPool(scope){                        // MCQ-capable recall cards for a scope
  let items=[];
  if(scope==='clinical') items=clinItems();      // clinItems() is NOT MCQ-filtered — the shared filter below handles it
  else if(scope==='all'){ allTopics.forEach(t=>{ if(!t.ready) return;
      (t.recall||[]).forEach(c=>{ items.push({t,c,id:cid(t.id,'recall',c),deck:'recall'}); }); }); }
  else { const s=subjById(scope); if(s) s.modules.flatMap(m=>m.topics).forEach(t=>{ if(!t.ready) return;
      (t.recall||[]).forEach(c=>{ items.push({t,c,id:cid(t.id,'recall',c),deck:'recall'}); }); }); }
  // one gate for EVERY scope: usable MCQ + honour "reported wrong → hide it from my studying" (REV-04)
  items=items.filter(it=>examUsable(it.c) && !isFlagged(it.id));
  // dedupe by question (twin syllabus decks)
  const seen={}, out=[]; items.forEach(it=>{ const k=hstr(it.c.q); if(seen[k])return; seen[k]=1; out.push(it); });
  return out;
}
function startExam(scope,count){
  const n=Math.max(1, Math.floor(+count)||20);
  const pool=shuf(examPool(scope)); const items=pool.slice(0,Math.min(n,pool.length));
  if(!items.length){ alert('No exam questions yet.\n\nMock exams are built from the multiple-choice cards in your lectures — add a lecture (Import) and let it finish building, then come back.'); return; }   // BUG: was a silent no-op on an empty account; and it used to point at 🧠 Q-bank, which never feeds this pool
  S={mode:'exam',key:'exam',items,order:items.map((_,k)=>k),i:0,scope,
     answers:new Array(items.length).fill(null), started:Date.now(), finished:0,
     session:{total:items.length}};
  go('exam'); render();   // BUG: we are ALWAYS already on #/exam here, so go() fired no hashchange and "▶ Start exam" did nothing
}
function examPick(i){ if(!S||S.mode!=='exam'||S.finished) return; S.answers[S.order[S.i]]=i; render(); }
function examNav(d){ if(!S||S.mode!=='exam')return; const n=S.i+d; if(n<0||n>=S.items.length)return; S.i=n; render(); window.scrollTo(0,0); }
function examSubmit(){ if(!S||S.mode!=='exam'||S.finished)return;
  const blank=S.answers.filter(a=>a==null).length;   // submitting is irreversible — confirm like qbEndEarly does
  if(blank && !confirm('Submit now? '+blank+' question'+(blank>1?'s are':' is')+' still blank and will be marked wrong.')) return;
  S.finished=Date.now(); render(); window.scrollTo(0,0); }

function pageStudy(topicId,deck){
  const t=topById(topicId); if(!t) return pageHome();
  /* `#/study/<id>` with no deck segment (a typed/shared/bookmarked link) passed deck=undefined
   * into startDeck, where cid() does `deck[0]` and throws. render() has no try/catch, so #main
   * was never written and the app sat frozen on the previous screen — the REV-03 / TOP-04
   * symptom. Anything that isn't the primer deck is the recall deck. */
  deck = (deck==='primer') ? 'primer' : 'recall';
  IMGBASE = t.imgBase || '';
  if(!S || S.mode!=='deck' || S.t.id!==topicId || S.deck!==deck) startDeck(topicId,deck);
  const nClin = deck==='recall' ? clinInDeck(t) : 0;
  const filterBar = deck==='recall' ? `<div class="clinbar">
      <button class="btn ${S.weakOnly?'primary':''}" onclick="toggleWeakFilter()">${S.weakOnly?'✓ Weak only — show all':'⚡ Weak only'}</button>

      <span class="clinlbl" style="margin-left:auto">${S.items.length} card${S.items.length===1?'':'s'}</span>
    </div>` : '';
  const head = crumbs([{label:'Anki Cards',route:'cards'},{label:t.subject.name,route:'cards/'+t.subject.id},{label:t.name,route:'topic/'+t.id}]);
  if(!S.items.length){
    /* "This deck is empty." was also shown when the deck is full but every card has been
     * reported wrong (startDeck drops isFlagged cards) — and there is no un-flag UI (LIB-01),
     * so the student was told the lecture has no cards. Say which it is, and never dead-end
     * an empty screen with no way out. */
    const nDeck = deckN(deck==='primer'?t.primer:t.recall);
    const msg = S.weakOnly ? "No weak cards here — you've mastered them all. 🎉"
      : S.clinOnly ? 'No clinical cards in this deck.'
      : nDeck ? `All ${nDeck} card${nDeck===1?'':'s'} in this deck are reported as wrong, so none are being shown.`

    return head+filterBar+`<div class="empty">${msg}</div>
      <div class="btnrow" style="justify-content:center;margin-top:14px">
        <button class="btn primary" onclick="go('topic/${t.id}')">← Back to this lecture</button></div>`;
  }
  return head + filterBar + cardView(false);
}

/* MCQ renderer for Recall (Deck B) cards that carry options */
function mcqView(session){
  const it=S.items[S.order[S.i]], c=effCard(it.id,it.c), t=it.t;
  if(EDITING===it.id) return '<div class="studywrap">'+cardEditor(it.id,'recall',c)+'</div>';
  const col='var(--recall)';
  const n=S.items.length, pctBar=((S.i+1)/n*100).toFixed(1), star=isStar(it.id);
  const _sa=(S.answered&&S.answered[it.id]!=null)?S.answered[it.id]:null;                       // answered earlier this session
  const _pa=(S.mode==='deck'&&DATA.cardAns&&DATA.cardAns[it.id]!=null)?DATA.cardAns[it.id]:null; // topic quiz: answered on a previous day
  const storedPick = _sa!=null?_sa:_pa;
  const picked = S.pick!=null || storedPick!=null;
  const pickIdx = S.pick!=null?S.pick:storedPick;
  const correct = picked && pickIdx===c.ans;
  const isHard = !!(DATA.starred[it.id] || (DATA.cards[it.id]&&DATA.cards[it.id].box<0));
  let body;
  if(!S.opts && !picked){
    body = `<div class="taphint">Think of your answer first — then reveal the options.</div>`;
  }else{
    const optsHtml = c.opts.map((o,i)=>{
      let cls='mcqopt';
      const removed = (!picked && S.hint && S.hintHide && S.hintHide.indexOf(i)>=0);
      if(picked){ if(i===c.ans) cls+=' correct'; else if(i===pickIdx) cls+=' wrong'; else cls+=' dim'; }
      else if(removed) cls+=' removed';
      const mark = picked ? (i===c.ans?'<span class="mcqmark">✓</span>':(i===pickIdx?'<span class="mcqmark">✗</span>':'')) : '';

          <span class="mcqtag">${String.fromCharCode(65+i)}</span><span class="mcqtext">${esc(o)}</span>${mark}</button>`;
    }).join('');
    body = `<div class="mcqopts">${optsHtml}</div>`;
    if(!picked && isHard && !S.hint && c.opts.length>2){
      body += `<button class="hintbtn" onclick="event.stopPropagation();mcqHint()">💡 Hint · remove two wrong options</button>`;
    }
    if(picked){
      const revTxt=reviewIntervalText(it.id);
      body += `<div class="mcqresult ${correct?'ok':'no'}" id="mcqAnswerTop">${correct?'✓ Correct':'✗ Not quite — added to your hard cards ★'}</div>`
            + `<div class="nextrev ${correct?'ok':'no'}">↻ You'll see this again <b>${revTxt}</b>${correct?'':' · it\'s now a hard card (also in your reminders)'}</div>`
            + `<div class="ansblock"><div class="seg"><div class="seglabel" style="background:#3ecf8e22;color:var(--recall)">Answer — explained</div><div class="body">${para(c.a)}</div></div></div>`
            + `<div class="vizmiss" onclick="event.stopPropagation()">${(window.DATA&&DATA.cardViz&&DATA.cardViz[it.id])
                 ? `<button class="vizsavedbtn" onclick="event.stopPropagation();vizWatchSaved()">▶ Watch your explainer <span class="vsaved">saved for this card</span></button>`
                 : `<button class="vizmissbtn" onclick="event.stopPropagation();vizFromCard()">🎬 Visualize how to get this answer</button>`}<div id="vizInlineHost" class="vizinlinehost"></div></div>`;
    }
  }
  const deck=S.mode==='deck';
  const navRow = `<div class="btnrow" style="margin-top:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="event.stopPropagation();step(-1)" ${S.i===0?'disabled':''}>← Prev</button>
      ${!picked?`<button class="btn" onclick="event.stopPropagation();mcqNext()" ${S.i>=n-1?'disabled':''}>Skip →</button>`:''}
      <button class="btn" onclick="event.stopPropagation();shuffle()">⇄ Shuffle</button>
      ${deck?`<button class="btn" onclick="event.stopPropagation();restartDeck()">↺ Restart</button>`:''}
    </div>`;
  let controls;

    controls = `<div class="navbtns"><button class="btn primary" onclick="event.stopPropagation();showOpts()">Show options</button></div>${navRow}
      <div class="kbd">Space/O options · you can Skip, Prev or Shuffle without answering · ←/→ move · S shuffle</div>`;
  }else if(!picked){
    controls = `<div class="kbd">Tap an option · keys 1–4 · or Skip / Prev / Shuffle below</div>${navRow}`;
  }else{
    const last=S.i>=n-1;
    controls = `<div class="navbtns">
        <button class="btn ${star?'':'got'}" onclick="event.stopPropagation();toggleStar('${it.id}')">${star?'★ In hard cards':'★ Add to hard'}</button>
        <button class="btn primary" onclick="event.stopPropagation();mcqNext()" ${(!session&&last)?'disabled':''}>${session&&last?'Finish':'Next →'}</button></div>${navRow}
      <div class="kbd">Space → next · ← Prev · S shuffle</div>`;
  }
  return `<div class="studywrap">
    <div class="studytop">
      <span class="pill" style="background:${col}22;color:${col};margin:0">${session?esc(t.name):'Recall · Deck B'}</span>
      <span class="name">${session?'◎ Recall (MCQ)':esc(t.name)}</span>
      ${ttsBtn()}<span class="counter">${S.i+1} / ${n}</span></div>
    <div class="bar"><div style="width:${pctBar}%;background:${col}"></div></div>
    ${masteryChips(sessionRecallIds())}
    <div class="flash" onclick="cardTap()">
      <button class="starbtn ${star?'on':''}" title="Add to hard cards" onclick="event.stopPropagation();toggleStar('${it.id}')">${star?'★':'☆'}</button>
      <div class="qlabel">${c.img?'Look at this — then answer':'Question'}${session?' · '+esc(t.subject.short):''}</div>
      <div class="q">${esc(c.q)}</div>
      ${c.img?`<div onclick="event.stopPropagation()">${imgBlock(c.img,c.imgCaption||'')}</div>`:''}
      ${body}</div>
    ${picked?noteBlock(it):''}
    ${(c.src&&picked)?`<div style="text-align:center;margin-top:10px"><button onclick="event.stopPropagation();try{MB_DOCK_SOURCE()}catch(e){}" style="border:1px solid var(--line);background:var(--panel2);color:var(--accent);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12.5px;cursor:pointer">${c.src_t!=null?('🎙 '+Math.floor(c.src_t/60)+':'+String(c.src_t%60).padStart(2,'0')+' · in the lecture'):'📄 Show in the note'}</button></div>`:''}
    ${cardActionsRow(it.id,it.deck)}

}

/* ---- MCQ interaction (Recall cards with options) ---- */
function isMcqCard(it){ return it && it.deck!=='primer' && it.c && it.c.opts && it.c.opts.length; }
function cardTap(){
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it) return;
  if(isMcqCard(it)){ if(!S.opts) showOpts(); else if(S.pick!=null) mcqNext(); return; }   // options first; after answering, tap anywhere to continue
  reveal();
}
function showOpts(){
  if(!S) return; if(S.opts) return; S.opts=true;
  markActive(); const it=S.items[S.order[S.i]]; if(it) touchTopic(it.t.id);
  render();
}
function mcqHint(){                             // 50-50: knock out two wrong options on a hard card
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it||!isMcqCard(it)||S.pick!=null) return;
  const c=it.c, wrong=[]; for(let k=0;k<c.opts.length;k++) if(k!==c.ans) wrong.push(k);
  for(let k=wrong.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[wrong[k],wrong[j]]=[wrong[j],wrong[k]];}
  S.hintHide=wrong.slice(0,2); S.hint=true; render();
}
function pickOpt(i){
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it||S.pick!=null||!isMcqCard(it)) return;
  if(S.hint && S.hintHide && S.hintHide.indexOf(i)>=0) return;   // removed by the hint — not selectable
  S.answered=S.answered||{};
  const alreadyAns = S.answered[it.id]!=null || (S.mode==='deck'&&DATA.cardAns&&DATA.cardAns[it.id]!=null);
  if(alreadyAns){ S.pick=null; render(); return; }              // answered before → just show it, never re-rate
  const c=it.c, ok=(i===c.ans);
  S.answered[it.id]=i; if(S.mode==='deck'){ DATA.cardAns=DATA.cardAns||{}; DATA.cardAns[it.id]=i; }   // remember the choice
  S.pick=i; S.show=true;
  const beforeCards=todayLog().cards, beforeLvl=levelInfo().i, beforeStreak=curStreak(), goal=DATA.daily.goal, floor=DATA.daily.floor, beforeMet=streakMet();
  markActive();
  const _pt=cardTimeState(it.id,false), _ms=S._shownAt?Date.now()-S._shownAt:0;
  if(it.conf){ if(!ok) rateSRS(it.id,false); }          // confidence check: miss re-enters pipeline
  else rateSRS(it.id,ok);
  if(_ms>=1200) recordAnswerMs(it.id,_pt,_ms);           // measure real answer time → rolling median
  // a first-ever exposure is a NEW card whichever pool served it — only planNew tags isNew, so a topic-deck /
  // weak / cram card would otherwise be logged as a *review* and never count toward the new-card total or streak.
  // (_pt was computed BEFORE rateSRS, so 'new' here means "had no SRS state a moment ago". Primer is excluded:
  //  planNew's per-course budget is recall-only.)
  logRate(ok); logDaily(!!it.isNew || (_pt==='new' && it.deck!=='primer'), it.t.subject.id); touchTopic(it.t.id);
  S.session.done++; if(ok) S.session.correct++;
  if(!ok && !it.conf){                                   // failed → auto-add to hard cards + mistakes log
    DATA.starred[it.id]=1; logMiss(it.id);
    try{ if(typeof swPing==='function') swPing('hardcount',{n:starCount()}); }catch(e){}
  }
  if(S.mode==='deck' && !S.clinOnly && !S.weakOnly) DATA.pos['pos:'+S.t.id+S.deck]=Math.min(S.i+1,S.items.length-1);   // saved place belongs to the FULL deck — a filtered pass writes an index into 4 cards, not 60
  persist();
  const afterCards=todayLog().cards, afterLvl=levelInfo().i, afterStreak=curStreak();
  if(afterLvl>beforeLvl)                          celebrate('level','Level up · '+LEVELS[afterLvl].n);
  else if(beforeCards<goal && afterCards>=goal)   celebrate('goal','🎉 Daily goal complete!');
  else if(!beforeMet && streakMet())              celebrate('floor','✓ Day’s target met — streak safe!');
  else if(afterStreak>beforeStreak && afterStreak%7===0) celebrate('streak','🔥 '+afterStreak+'-day streak!');
  render();
  if(window.innerWidth<=720){ setTimeout(function(){ var el=document.getElementById('mcqAnswerTop'); if(el)el.scrollIntoView({behavior:'smooth',block:'start'}); },60); }   // phone: drop straight to the explanation
  else window.scrollTo(0,0);
}
function vizFromCard(){                        // build an inline explainer for the current card — how to reason to the answer
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it) return;
  const c=effCard(it.id,it.c), t=it.t;
  const correct=(c.opts&&c.opts[c.ans]!=null)?c.opts[c.ans]:'';
  const text=(c.q||'')+(correct?(' The correct answer is: '+correct+'.'):'')+(c.a?(' '+c.a):'');
  const btn=document.querySelector('.vizmissbtn'); if(btn)btn.style.display='none';
  if(window.aiVisualizeInline) window.aiVisualizeInline(text,(t&&t.name)||'',(t&&t.id)||'','vizInlineHost', it.id);
}
function vizWatchSaved(){                       // replay the explainer already saved to this card
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it) return;
  const btn=document.querySelector('.vizsavedbtn'); if(btn)btn.style.display='none';
  if(window.aiVisualizeInlineSaved) window.aiVisualizeInlineSaved(it.id,(it.t&&it.t.id)||'','vizInlineHost');
}
function mcqNext(){
  if(!S) return; if(window.vizInlineStop)vizInlineStop();
  if(_mbViaSwipe){ _mbViaSwipe=false; } else bumpNext();
  if(S.i>=S.items.length-1){
    if(S.mode!=='deck'){ S.i=S.items.length; render(); window.scrollTo(0,0); return; }
    S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); return;   // deck: stay on last card
  }
  S.i++; S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); window.scrollTo(0,0);
}

function reveal(){
  if(!S) return;
  const it=S.items[S.order[S.i]];
  if(isMcqCard(it)){ if(!S.opts) showOpts(); else if(S.pick!=null) mcqNext(); return; }
  if(!S.show){ markActive(); if(it) touchTopic(it.t.id); }
  S.show=!S.show; render();
}
function step(d){ if(!S)return; _mbViaSwipe=false; if(window.vizInlineStop)vizInlineStop(); const n=S.i+d; if(n<0||n>=S.items.length)return;
  S.i=n; S.show=false; S.opts=false; S.pick=null; S.hint=false; S.hintHide=null;
  if(S.mode==='deck' && !S.clinOnly && !S.weakOnly){ DATA.pos['pos:'+S.t.id+S.deck]=S.i; persist(); }   // see rateCard: filtered indices must not overwrite the full deck's place
  render(); window.scrollTo(0,0);
}
function shuffle(){ if(!S)return; for(let i=S.order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];} S.i=0;S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null;render(); }
function restartDeck(){ if(!S)return; S.i=0;S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null;S.order=S.items.map((_,k)=>k);
  S.answered={};                                                             // Reset wipes your answers → questions show as unanswered again
  if(S.mode==='deck'){ DATA.cardAns=DATA.cardAns||{}; S.items.forEach(function(x){ delete DATA.cardAns[x.id]; });
    if(!S.clinOnly && !S.weakOnly) DATA.pos['pos:'+S.t.id+S.deck]=0;   // restarting a 4-card weak pass must not rewind the 60-card deck
    persist(); }
  render(); }
/* classify a session item for the remaining-mix bar */
function classifyItem(it){
  if(!it) return 'rev';
  if(it.isNew) return 'new';
  if(it.conf) return 'rev';
  const s=DATA.cards[it.id];
  if(!s) return 'new';
  if(DATA.starred[it.id] || s.box<0) return 'hard';
  return 'rev';
}
function sessionMix(){                         // counts of what's still AHEAD (from current card to the end)
  let h=0,r=0,n=0;
  if(S&&S.items){ for(let k=S.i;k<S.items.length;k++){ const cl=classifyItem(S.items[S.order[k]]); if(cl==='hard')h++; else if(cl==='new')n++; else r++; } }
  return {hard:h,rev:r,new:n};
}
function endSession(){                        // leave a session gracefully → results if any progress, else back to the hub
  if(window.vizInlineStop)vizInlineStop();
  if(!S){ go('today'); return; }
  if(S.session && S.session.done>0){ S.i=S.items.length; render(); window.scrollTo(0,0); }
  else go('today');
}
function sessionNext(){                       // advance a non-rated (primer) card inside a session
  if(!S) return; if(_mbViaSwipe){ _mbViaSwipe=false; } else bumpNext();
  S.session.done++;
  if(S.i>=S.items.length-1){ S.i=S.items.length; S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); window.scrollTo(0,0); return; }
  S.i++; S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); window.scrollTo(0,0);
}
function flashReview(id,ok){
  const txt=reviewIntervalText(id);
  const host=document.createElement('div'); host.className='revtoast';
  host.innerHTML=`<span class="rt ${ok?'':'no'}">${ok?'✓':'✗ hard card ·'}</span> next review <b>${txt}</b>`;
  document.body.appendChild(host);
  setTimeout(()=>{ host.style.transition='opacity .4s'; host.style.opacity='0'; setTimeout(()=>host.remove(),400); }, 1600);
}
function celebrate(kind,text){
  try{ if(navigator.vibrate) navigator.vibrate(kind==='goal'||kind==='level'?[30,40,30]:20); }catch(e){}
  const host=document.createElement('div'); host.className='celebrate';
  const emo = kind==='level'?['🎓','⭐','🎉','✨']:kind==='streak'?['🔥','🔥','✨','🎉']:['🎉','✨','🎊','⭐','💪'];
  let bits='';
  for(let i=0;i<18;i++){ const e=emo[i%emo.length];
    bits+=`<span style="left:${Math.random()*100}%;animation-delay:${(Math.random()*0.3).toFixed(2)}s;font-size:${(14+Math.random()*16)|0}px">${e}</span>`; }
  host.innerHTML=`<div class="celebits">${bits}</div>${text?`<div class="celebanner">${esc(text)}</div>`:''}`;
  document.body.appendChild(host);
  setTimeout(()=>host.remove(),1900);
}
function rateCard(ok){
  if(!S) return; if(window.vizInlineStop)vizInlineStop(); const it=S.items[S.order[S.i]]; if(!it) return;
  S.answered=S.answered||{}; if(S.answered[it.id]!=null) return;   // REV-05: this card was already rated this sitting — a second tap must not re-mutate SRS/streak/mistakes
  S.answered[it.id]=ok?1:0;
  const beforeCards=todayLog().cards, beforeLvl=levelInfo().i, beforeStreak=curStreak(), goal=DATA.daily.goal, floor=DATA.daily.floor, beforeMet=streakMet();
  markActive();
  const _pt=cardTimeState(it.id,false), _ms=S._shownAt?Date.now()-S._shownAt:0;
  if(it.conf){ if(!ok) rateSRS(it.id,false); }   // confidence check: correct = no change, miss = re-enter pipeline
  else rateSRS(it.id,ok);

  logRate(ok); logDaily(!!it.isNew || (_pt==='new' && it.deck!=='primer'), it.t.subject.id); touchTopic(it.t.id);   // see :4877 — first exposure counts as new whichever pool served it

  else if(ok && DATA.missLog && DATA.missLog[it.id]!=null){ delete DATA.missLog[it.id]; }   // MIS-04/SIDE-03: a now-correct card leaves the recent-mistakes pool (was append-only forever)
  if(S.mode==='deck' && !S.clinOnly && !S.weakOnly) DATA.pos['pos:'+S.t.id+S.deck]=Math.min(S.i+1,S.items.length-1);   // saved place belongs to the FULL deck — a filtered pass writes an index into 4 cards, not 60
  persist();

  const afterCards=todayLog().cards, afterLvl=levelInfo().i, afterStreak=curStreak();
  if(afterLvl>beforeLvl)                         celebrate('level','Level up · '+LEVELS[afterLvl].n);
  else if(beforeCards<goal && afterCards>=goal)  celebrate('goal','🎉 Daily goal complete!');
  else if(!beforeMet && streakMet())             celebrate('floor','✓ Day’s target met — streak safe!');
  else if(afterStreak>beforeStreak && afterStreak%7===0) celebrate('streak','🔥 '+afterStreak+'-day streak!');
  if(S.i>=S.items.length-1){
    if(S.mode!=='deck'){ S.i=S.items.length; render(); window.scrollTo(0,0); return; }
    S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); return;            // deck: stay on last card
  }
  S.i++; S.show=false;S.opts=false;S.pick=null;S.hint=false;S.hintHide=null; render(); window.scrollTo(0,0);
}

var PREV_BASE='';

function markSwipeUsed(){ SWIPE_USED++; try{ localStorage.setItem('mb_swipe_used',String(SWIPE_USED)); }catch(e){} hideSwipeHint(); }
function bumpNext(){ if(!swipeHintEligible()) return; SWIPE_NEXTS++; if(SWIPE_NEXTS%3===0) showSwipeHint(); }   // still tapping Next after 3 → remind them they can swipe

function swipeAct(dir){
  if(!/^#\/(study|review|hard|nudge|hardnudge)/.test(location.hash)||!S) return;
  const it=S.items[S.order[S.i]]; if(!it) return;
  if(dir==='up') return;                                                  // up does nothing — starring by accident was too easy
  markSwipeUsed();                                                        // a left/right swipe = feature learned
  if(dir==='right'){ if(S.i>0){ _mbViaSwipe=true; step(-1); } return;
  }   // previous
  if(dir==='left'){                                                       // next / skip
    if(isMcqCard(it)){ _mbViaSwipe=true; mcqNext(); }
    else if(!S.show){ reveal(); }                                         // flip: first swipe reveals (not a "next", so don't arm _mbViaSwipe)
    else if(S.i<S.items.length-1){ _mbViaSwipe=true; step(1); }
    else if(S.mode!=='deck'){ _mbViaSwipe=true; sessionNext(); }          // SWP-02: last card in a session → reach the results screen (was a silent no-op)

(function(){
  var sx=0,sy=0,st=0,live=false;
  document.addEventListener('touchstart',function(e){
    live=false; if(window.innerWidth>720) return;
    if(!/^#\/(study|review|hard|nudge|hardnudge)/.test(location.hash)) return;
    if(e.touches.length!==1) return;
    var t=e.target;
    if(t&&t.closest&&t.closest('.vizmiss,.vizinlinehost,.vizctrl,input,select,textarea,.mcqopt,.ratebtns,.navbtns')) return;   // don't hijack controls/answers/video
    live=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now();
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!live) return; live=false;
    var t=e.changedTouches[0]; var dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>700) return;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ swipeAct(dx<0?'left':'right'); }
    else if(dy<-70 && Math.abs(dy)>Math.abs(dx)*1.5){ swipeAct('up'); }
  },{passive:true});
})();
document.addEventListener('keydown',e=>{
  const h=location.hash;
  if(/^#\/exam/.test(h) && S && S.mode==='exam' && !S.finished && S.items.length){   // exam keys
    if(e.target && (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable)) return;
    const c=S.items[S.order[S.i]].c, nOpt=(c.opts||[]).length;
    if(/^[1-9]$/.test(e.key)){ const idx=+e.key-1; if(idx<nOpt) examPick(idx); return; }
    if(/^[a-z]$/i.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey){   // the on-screen hint says "Pick A–D", so A–D must actually work
      const idx=e.key.toUpperCase().charCodeAt(0)-65; if(idx>=0&&idx<nOpt){ examPick(idx); return; } }
    if(e.key==='ArrowRight'){ examNav(1); return; }
    if(e.key==='ArrowLeft'){ examNav(-1); return; }
    return;
  }
  if(!/^#\/(study|review|hard|nudge|hardnudge)/.test(h)) return;
  if(e.target && (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable)) return;   // typing in a card note / inline editor must not rate or flip the card
  if(!S) return;
  const it=S.items[S.order[S.i]], canRate=it && it.deck!=='primer';
  if(isMcqCard(it)){                                   // MCQ keyboard flow
    if(e.code==='Space'){ e.preventDefault(); if(!S.opts) showOpts(); else if(S.pick!=null) mcqNext(); return; }
    if((e.key==='o'||e.key==='O') && !S.opts){ showOpts(); return; }
    if(S.opts && S.pick==null && /^[1-9]$/.test(e.key)){ const idx=+e.key-1; if(idx<it.c.opts.length) pickOpt(idx); return; }
    if(e.key==='ArrowRight'){ mcqNext(); return; }     // skip (or next after answering)
    if(e.key==='ArrowLeft'){ step(-1); return; }       // previous
    if(e.key==='s'||e.key==='S'){ shuffle(); return; } // shuffle
    return;
  }
  if(e.code==='Space'){ e.preventDefault(); reveal(); return; }
  if(canRate && S.show){ if(e.key==='1')rateCard(false); if(e.key==='2')rateCard(true); return; }
  if(!canRate && (S.mode==='daily'||S.mode==='hard') && S.show){ if(e.key==='ArrowRight')sessionNext(); return; }
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
});

/* ---------- jump back in / weekly progress ---------- */
function weekDayStrs(){                       // dates of the current week (Sun→today), oldest→newest
  const today=new Date(); const start=new Date(today); start.setDate(start.getDate()-start.getDay());
  const out=[]; for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)) out.push(dstr(new Date(d)));
  return out;
}
function weekProgress(){
  const days=weekDayStrs(), touched=new Set();
  days.forEach(d=>Object.keys(DATA.dayTopics[d]||{}).forEach(id=>touched.add(id)));
  let complete=0, inprog=0;
  touched.forEach(id=>{ if(status(id)==='complete') complete++; else inprog++; });
  const notStarted = allTopics.filter(t=>t.ready && status(t.id)==='notstarted').length;
  return {touched:touched.size, complete, inprog, notStarted};
}

/* ---- automatic backup to a file (File System Access API) ---- */
function idbSet(k,v){ return new Promise((res,rej)=>{ const o=indexedDB.open('medbank_fs',1);
  o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains('h')) o.result.createObjectStore('h'); };
  o.onsuccess=()=>{ const tx=o.result.transaction('h','readwrite'); tx.objectStore('h').put(v,k);
    tx.oncomplete=()=>{o.result.close();res();}; tx.onerror=()=>rej(tx.error); }; o.onerror=()=>rej(o.error); }); }
function idbGet(k){ return new Promise((res,rej)=>{ const o=indexedDB.open('medbank_fs',1);
  o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains('h')) o.result.createObjectStore('h'); };
  o.onsuccess=()=>{ const tx=o.result.transaction('h','readonly'); const r=tx.objectStore('h').get(k);
    r.onsuccess=()=>{o.result.close();res(r.result);}; r.onerror=()=>rej(r.error); }; o.onerror=()=>rej(o.error); }); }
let _bakHandle=null,_bakTimer=null,_bakBusy=false,_bakPaused=false;

async function _perm(h,req){ if(!h||!h.queryPermission) return false; const o={mode:'readwrite'};
  if((await h.queryPermission(o))==='granted') return true;
  if(req && (await h.requestPermission(o))==='granted') return true; return false; }

      const ws=await _bakHandle.createWritable(); await ws.write(JSON.stringify(DATA)); await ws.close();
      _bakPaused=false; DATA.settings.lastBackup=Date.now();
      try{ localStorage.setItem(SKEY,JSON.stringify(DATA)); }catch(e){}   // persist timestamp without re-scheduling
    } else { _bakPaused=true; }

}

/* SET-01: Reset only ever cleared the LOCAL copy. For a signed-in student sync.js re-adopts the
   cloud state on the very next load, so "Cannot be undone" was exactly backwards — the reset
   undoes ITSELF and the student is left thinking the button is broken. A true account wipe needs a
   server-side delete (logged as SET-01, proposed). Until then, say what actually happens. */
function mbResetAll(){
  let signedIn=false;
  try{ signedIn=!!(window.MB_SYNC && MB_SYNC.currentProfileId && MB_SYNC.currentProfileId()); }catch(e){}
  let msg='Reset ALL your progress on this device?';
  if(signedIn) msg+='\n\nYou are signed in, so your progress is also saved to your account and will sync back down after the reload. Sign out first if you want this device left empty.';
  if(!confirm(msg)) return;
  try{ localStorage.removeItem(SKEY); }catch(e){}
  location.reload();
}
function backupRel(){ const t=DATA.settings.lastBackup; if(!t) return 'not yet';
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago';
  if(s<86400) return Math.floor(s/3600)+' h ago'; return Math.floor(s/86400)+' d ago'; }
async function setUseIdle(on){ DATA.settings.useIdle=!!on; persist(); if(on) await startIdle(true); render(); }
function setQuiet(which,v){ v=Math.max(0,Math.min(23,parseInt(v)||0)); if(which==='start')DATA.settings.quietStart=v; else DATA.settings.quietEnd=v; persist(); render(); }
function testNudge(){
  if(!('Notification' in window)){ alert('Notifications are not supported here.'); return; }
  if(Notification.permission!=='granted'){ enableReminders(); return; }
  const items=nudgeItems(10);
  if(!items.length){ alert('No hard or due cards to show yet — study a topic first, then star a few cards.'); return; }
  DATA.settings.lastNudge=Date.now(); persist();
  const n=habitNudge();
  swPing('notify',{title:n.title,body:n.body,url:n.url,strict:DATA.settings.strict});
  swPing('payload',{title:n.title,body:n.body,url:n.url});
  playAlarm();
}
/* SET-04: remindOn used to be set BEFORE the permission prompt and was never reverted on a
   denial — the panel then said "Turn off" and offered interval/quiet-hours/strict settings while
   nudgeTick bailed at its permission check on every single tick. Only turn on if it can actually fire. */
async function enableReminders(){
  if(!('Notification' in window)){
    alert("This browser can't show notifications. Install MedBank to your home screen (Settings → App) and try again — MedBank will still nudge you in-app while it's open.");
    return;
  }
  let perm='denied';
  try{ perm=await Notification.requestPermission(); }catch(e){ perm='denied'; }
  if(perm!=='granted'){
    DATA.settings.remindOn=false; persist(); render();
    alert("Notifications are blocked for MedBank, so reminders can't be turned on. Allow notifications for this site in your browser (or phone) settings, then tap Turn on again.");
    return;
  }
  DATA.settings.remindOn=true; persist();
  try{ setupReminder(); }catch(e){}
  try{ new Notification('MedBank reminders on',{body:'You’ll get a nudge when cards are due.'}); }catch(e){}
  render();
}
function disableReminders(){ DATA.settings.remindOn=false; persist(); render();
  /* SET-03: the service worker's periodicsync handler (sw.js maybeRemind) checks NEITHER remindOn
     NOR quiet hours — it just replays the last staged payload. Leaving the registration in place
     kept nudging a student who had just turned reminders off, at any hour, with no way to stop it. */
  (async function(){
    try{ if(navigator.serviceWorker){ const reg=await navigator.serviceWorker.ready;
      if(reg && reg.periodicSync){ try{ await reg.periodicSync.unregister('medbank-nudge'); }catch(e){} } } }catch(e){}
    try{ swPing('payload',{title:'',body:'',url:''}); }catch(e){}
  })();
}

async function loadPlanBadge(){
  var el=document.getElementById('planBadge'); if(!el) return;
  try{
    var CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API||!window.__mbSB){ el.textContent='—'; return; }
    var ses=await window.__mbSB.auth.getSession(); var tok=ses.data.session&&ses.data.session.access_token; if(!tok){ el.textContent='—'; return; }
    var r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/me',{headers:{'Authorization':'Bearer '+tok}});
    var j=await r.json().catch(function(){return{};}); el=document.getElementById('planBadge'); if(!el)return;
    if(r.ok && j.premium){ el.className='planbadge prem'; el.textContent=j.test?'★ Premium · test':'★ Premium'; }
    else if(r.ok){ el.className='planbadge free'; el.textContent='Basic · Upgrade →';
      /* ENT-07: the Plan row used to describe Premium with no way to buy it — the only subscribe
         route in the app was paywall.js, reachable only by hitting a wall. Same target as that nudge. */
      el.style.cursor='pointer'; el.title='See plans and subscribe';
      el.onclick=function(){ try{ var C=window.MEDBANK_CONFIG||{}; window.open((C.WEBSITE_URL||(C.DOWNLOAD&&C.DOWNLOAD.pwa)||'#')+'#pricing','_blank'); }catch(e){} }; }
    else { el.textContent='—'; }
  }catch(e){ if(el)el.textContent='—'; }
}

/* ---------- Leeches ---------- */
function pageLeeches(){
  const items=leechItems();
  const head=`<h1>🩸 Leeches</h1><p class="sub">Cards you've missed ${LEECH_LAPSES} times or more — the ones quietly costing you marks. Drill or rewrite them.</p>`;
  if(!items.length) return head+`<div class="alldone"><div class="big">✓</div><b>No leeches — well done.</b>
      <p>When a card gets missed ${LEECH_LAPSES}+ times it shows up here so you can attack it directly.</p>
      <div class="btnrow" style="justify-content:center"><button class="btn primary" onclick="go('today')">Back to Active Recall</button></div></div>`;
  const rows=items.slice(0,60).map(it=>`<div class="leechrow">
      <span class="lcount">${it.lapses}×</span>
      <div class="lmid"><b>${esc(it.c.q)}</b><span>${esc(it.t.name)} · ${esc(it.t.subject.short)}</span></div>
      <button class="btn" onclick="openCardAt('${it.t.id}','${it.deck||'recall'}','${it.id}')">Open</button></div>`).join('')
      + (items.length>60?`<div class="leechrow" style="justify-content:center;color:var(--dim)">…and ${items.length-60} more — use “Drill all” above</div>`:'');   // LCH-06
  return head+`<div class="btnrow" style="margin:4px 0 16px"><button class="btn primary" onclick="startLeeches();go('review')">▶ Drill all ${items.length} leech${items.length===1?'':'es'}</button></div>${rows}`;
}

function pageCram(topicId){
  const t=topById(topicId); if(!t||!t.ready) return pageHome();
  const cards=(t.recall||[]);
  const rows=cards.map((c,i)=>{ const {ans,take}=cramLine(c);
    return `<div class="cramrow">
      <div class="cq"><span class="cn">${i+1}</span>${esc(c.q)}</div>
      ${ans?`<div class="ca">${esc(ans)}</div>`:''}

  const v=el.value.trim(); if(!v)return;
  if(typeof AIBUSY!=='undefined' && AIBUSY) return;   // SCA-04: tutor still replying — leave the message in the box instead of clearing + dropping it
  el.value=''; aiSend(topicId, v); }
function clearAI(topicId){ if((AICHAT[topicId]||[]).length && !confirm('Clear this tutor chat?')) return;   // SCA-08: confirm the one-tap wipe (it sits right next to "Start voice quiz")

function aiRedo(topicId){ const a=AICHAT[topicId]||[];

  render();
  if(VOICE.on && sttSupported()) aiListen(topicId);

}

let _selText='', _explBtn=null;
function currentTopicName(){ const p=(location.hash.slice(2)||'').split('/');
  if((p[0]==='topic'||p[0]==='cram'||p[0]==='study') && p[1]){ const t=topById(p[1]); if(t) return t.name; }
  try{ if(S && S.items && S.items[S.order[S.i]]) return S.items[S.order[S.i]].t.name; }catch(e){}
  return ''; }
function inReadable(node){ let el=node&&(node.nodeType===1?node:node.parentElement);
  while(el){ if(el.classList&&(el.classList.contains('md')||el.classList.contains('cramsheet')||el.classList.contains('ansblock'))) return true; el=el.parentElement; } return false; }
function inNoteBody(node){ let el=node&&(node.nodeType===1?node:node.parentElement);
  while(el){ if(el.classList&&el.classList.contains('notebody')) return true; el=el.parentElement; } return false; }
function onSelChange(){ try{
  const sel=window.getSelection(); const txt=sel&&sel.toString().trim();
  if(txt && txt.length>=3 && sel.rangeCount && inReadable(sel.anchorNode) && currentTopicName()){
    _selText=txt; const r=sel.getRangeAt(0).getBoundingClientRect(); showExplainBtn(r, inNoteBody(sel.anchorNode));
  } else hideExplainBtn();
}catch(e){} }
function showExplainBtn(r, canViz){
  if(!_explBtn){ _explBtn=document.createElement('div'); _explBtn.className='selpop';
    _explBtn.addEventListener('mousedown',e=>e.preventDefault());
    document.body.appendChild(_explBtn); }
  var html='<button class="explbtn" data-a="explain">✨ Let AI explain</button>';
  if(canViz) html+='<button class="explbtn vizbtn2" data-a="viz">🎬 Visualize this</button>';
  /* 3D only appears when the highlighted words actually resolve to a structure we can show — never a
     button that opens onto "nothing here". */
  var m3=null; try{ if(mb3dOn()) m3=MB3D.partForTermSync(_selText); }catch(e){}
  if(m3) html+='<button class="explbtn mb3dbtn" data-a="mb3d">🧬 See it in 3D</button>';
  _explBtn.innerHTML=html;
  _explBtn.querySelector('[data-a=explain]').onclick=function(){ const t=_selText; hideExplainBtn(); if(t) aiExplain(t, currentTopicName()); };
  var vb=_explBtn.querySelector('[data-a=viz]'); if(vb) vb.onclick=function(){ const t=_selText; hideExplainBtn(); if(t) aiVisualize(t, currentTopicName(), (window.currentTopicId?currentTopicId():'')); };
  var m3b=_explBtn.querySelector('[data-a=mb3d]'); if(m3b) m3b.onclick=function(){ const t=_selText; hideExplainBtn(); try{ MB3D.open(m3.scene,{part:m3.key,title:t,subtitle:'matched: '+m3.label}); }catch(e){} };
  const bw=168, bh=(canViz?90:42)+(m3?48:0);
  let top=r.bottom+8; if(top+bh > window.innerHeight-10) top=Math.max(8, r.top-bh-8);
  let left=r.left + r.width/2 - bw/2; left=Math.max(8, Math.min(window.innerWidth-bw-8, left));
  _explBtn.style.top=top+'px'; _explBtn.style.left=left+'px'; _explBtn.style.display='flex';
}
function hideExplainBtn(){ if(_explBtn) _explBtn.style.display='none'; }

function explainPrompt(snippet, topicName){
  return `A 500-level medical student in Nigeria is reading a lecture note on "${topicName}" and highlighted this passage to be taught:

"""${snippet}"""

Teach the meaning and content of this passage, in the context of "${topicName}", as if I have ZERO prior knowledge. Never assume I already understand any medical, scientific or technical term. Your goal is not just to answer but to build my understanding from the ground up. Follow this teaching method every time:

1. Start from first principles — begin with the absolute basics; explain what it is before how or why it works.
2. Explain every unfamiliar term the moment you use it (e.g. atrium, ventricle, thrombus, preload, stenosis, myocardium): what the word literally means, where it comes from (prefix/suffix roots) if helpful, and why it matters here. Never leave a technical word unexplained.
3. Build gradually in small logical steps that each lead into the next (Step 1: What is it? Step 2: Why does it exist? Step 3: How does it normally work? Step 4: What goes wrong? Step 5: What happens next? Step 6: Why does that lead to the symptoms, investigation or treatment?). Don't jump ahead.
4. Spell out the cause-and-effect chain — for every concept explain WHY each event causes the next, link by link, skipping nothing (use arrow chains like: heart failure -> pumps less blood -> blood backs up -> pressure rises -> fluid leaks into lungs -> shortness of breath).
5. Use simple everyday analogies (water pipes, pumps, balloons, traffic jams, rivers, plumbing, doors, filters) so I can visualise what is happening.
6. Connect everything together — at the end of each section, explain how it fits the big picture of the topic.
7. For any test mentioned (ECG, echo, BNP, CT, MRI, blood tests, etc.): what the test actually measures, why it was invented, what abnormality it looks for, why it is useful, what a positive/abnormal result means, and how that result changes diagnosis or treatment.
8. For diseases, always go normal -> abnormal: normal anatomy, normal physiology, what changes in disease, why those changes occur, and the consequences of those changes.
9. If the passage is an MCQ: explain why the correct answer is correct AND why every incorrect option is wrong and what each wrong option would actually indicate instead.
10. Finish with memory aids: a one-line exam answer, a simple summary, an easy mnemonic, a few high-yield exam points, and common exam traps with how to avoid them.
11. Use simple ASCII diagrams, arrows, flowcharts or tables (in markdown — use fenced code blocks for ASCII diagrams and pipe tables for tables) whenever they help me visualise the process.
12. Never assume prior knowledge — teach an intelligent beginner who has never studied this before, layer by layer, until even complex concepts feel obvious.
13. Prioritise understanding over memorisation — don't just tell me facts, help me understand WHY they are true, so I can reason out the answer even if I forget the exact wording.
14. Make me think — occasionally ask a short question ("If the valve is narrowed, what do you think happens to the blood behind it?") and then explain the answer so I actively learn.

Writing style: be patient and conversational, use plain English, avoid unnecessary jargon, never rush, build one concept at a time, and assume I know nothing at first — like a great professor teaching one student. The goal is deep understanding, not memorising for an exam. Make the explanation as long and detailed as necessary. Format with markdown: headings, bold, bullet points, pipe tables, and fenced code blocks for any ASCII diagrams or flowcharts.`;
}
let _explSnippet='', _explTopic='';
function aiExplain(snippet, topicName){ _explSnippet=snippet; _explTopic=topicName||currentTopicName(); openExplainPanel(snippet); }
function briefPrompt(s,t){ return `In the context of a lecture on "${t}", give a BRIEF, simple explanation of this passage — just a short, clear paragraph or two, defining any hard term in a few plain words. Keep it concise. Passage:\n"""${s}"""\nPlain markdown allowed.`; }
function askPrompt(s,t,q){ return `Here is a passage from a lecture note on "${t}":\n"""${s}"""\n\nThe student asks: "${q}"\n\nAnswer their question about this passage directly and clearly. If they ask for a synonym, an opposite, a definition, or a translation, give it straight away with a short note. Keep the answer only as long as the question needs. Plain markdown allowed.`; }
function runExplain(mode){
  const s=_explSnippet, t=_explTopic||currentTopicName();
  let prompt;
  if(mode==='ask'){ const el=document.getElementById('explask'); const q=(el&&el.value||'').trim(); if(!q){ el&&el.focus(); return; } prompt=askPrompt(s,t,q); }
  else if(mode==='brief') prompt=briefPrompt(s,t);
  else prompt=explainPrompt(s,t);
  setExplBody('<div class="explload"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span> thinking…</div>');
  aiRun(prompt);
}
async function aiRun(prompt){
  // Primary: our own backend running DeepSeek V4 Flash — no Puter, no browser sign-in.
  try{
    const CFG=window.MEDBANK_CONFIG||{};
    if(CFG.IMPORT_API && window.__mbSB){
      const ses=await window.__mbSB.auth.getSession();
      const tok=ses.data.session && ses.data.session.access_token;
      if(tok){
        const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/explain',{method:'POST',
          headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
          body:JSON.stringify({prompt})});
        const j=await r.json().catch(()=>({}));
        if(r.ok && j && j.text && j.text.trim()){ setExplBodyMd(j.text); return; }
      }
    }
  }catch(e){ /* fall through to offline fallback */ }
  // Offline / not-signed-in fallback: Puter (free, browser SDK).
  loadPuter(async ()=>{
    if(window.puter && window.puter.ai && window.puter.ai.chat){
      try{
        const model=DATA.settings.explainModel||'deepseek-v4-flash';
        const resp=await window.puter.ai.chat(prompt, {model, stream:true});
        let acc=''; setExplBody('');
        for await (const part of resp){ const t=(part&&part.text)||''; if(t){ acc+=t; setExplBodyMd(acc); } }
        if(acc.trim()) return;
        const r2=await window.puter.ai.chat(prompt, {model});
        const txt=(r2&&r2.message&&r2.message.content&&r2.message.content[0]&&r2.message.content[0].text)||(typeof r2==='string'?r2:'');
        if(txt.trim()){ setExplBodyMd(txt); return; }
      }catch(e){ /* fall through to error */ }
    }
    setExplBody('<p>Could not reach the AI service. Check your internet and try again.</p>');
  });
}
async function geminiExplain(prompt){
  try{
    const key=(DATA.settings.geminiKey||'').trim(), model=DATA.settings.geminiModel||'gemini-2.5-flash-lite';
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}]})});
    const j=await r.json();
    if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    const txt=(((j.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||'(no explanation returned)';
    setExplBodyMd(txt);
  }catch(e){ setExplBody('<p>Explanation failed: '+esc(e.message||String(e))+'</p>'); }
}
function setExplainModel(v){ DATA.settings.explainModel=v||'deepseek-v4-flash'; persist(); render(); }
function setTutorEngine(v){ DATA.settings.tutorEngine=v||'deepseek-v4-flash'; persist(); loadPuter(); render(); }

/* ---------- weekly topic plan (source of daily NEW cards) ---------- */
function unseenCount(t){ return (t.recall||[]).filter(c=>{ const id=cid(t.id,'recall',c); return !DATA.cards[id] && !isFlagged(id); }).length; }   // must match planNew's pool: a flagged card is never served, so it is not "N new left"
function planAdd(id){ DATA.plan=DATA.plan||[]; if(!DATA.plan.includes(id)) DATA.plan.unshift(id); persist(); render(); }
function planRemove(id){ DATA.plan=(DATA.plan||[]).filter(x=>x!==id); persist(); render(); }
function planTop(id){ DATA.plan=[id].concat((DATA.plan||[]).filter(x=>x!==id)); persist(); render(); }
function pagePlan(){
  const head=`<h1>🗓 This week's topics</h1><p class="sub">Choose where your daily <b>new cards</b> come from. Only the <b>top 5 per course</b> are active at a time (newest at the top); the rest wait. Each topic's cards come in order, interleaved with the others, ${DATA.daily.courseGoal||20} new per course a day. Finished topics drop off; unfinished ones stay for next week — add new topics anytime and they go to the top.</p>`;
  let out='';
  DB.subjects.filter(sb=>sb.readyCount>0).forEach(sb=>{
    const planTopics=(DATA.plan||[]).map(topById).filter(t=>t&&t.ready&&t.subject.id===sb.id);
    let activeShown=0;
    const rows=planTopics.map(t=>{ const un=unseenCount(t), active=(un>0 && activeShown<5); if(active) activeShown++;
      const chip=un===0?'<span class="pchip done">✓ finished</span>':active?'<span class="pchip act">● active</span>':'<span class="pchip">waiting</span>';
      return `<div class="leechrow"><div class="lmid"><b>${t.sn?t.sn+'. ':''}${esc(t.name)}</b><span>${chip} · ${un} new left</span></div>
        <div class="btnrow">${(active||un===0)?'':`<button class="btn tiny" onclick="planTop('${t.id}')">↑ Top</button>`}<button class="btn tiny" onclick="planRemove('${t.id}')">✕</button></div></div>`;
    }).join('');
    const avail=allTopics.filter(t=>t.ready&&t.subject.id===sb.id&&!(DATA.plan||[]).includes(t.id));
    const add=avail.length?`<details class="notewrap"><summary>＋ Add a ${esc(sb.short)} topic</summary>
       <div class="vchips" style="padding:8px 0">${avail.map(t=>`<div class="vchip" onclick="planAdd('${t.id}')">${t.sn?t.sn+'. ':''}${esc(t.name)}</div>`).join('')}</div></details>`
       :`<p class="sub">All built ${esc(sb.short)} topics are already in your plan.</p>`;
    out+=`<h2><span style="color:${COLOR[sb.id]}">●</span> ${esc(sb.name)} <span style="font-size:13px;color:var(--dim);font-weight:400">${planTopics.length} selected</span></h2>${rows||'<p class="sub">No topics selected yet — add some below.</p>'}${add}`;
  });
  if(!out.trim()) return head+`<div class="alldone" style="margin-top:20px"><div class="big">🗓</div><b>No built topics yet.</b>
    <p>Add a lecture and once it finishes building it will appear here, ready to go into this week's plan.</p>
    <div class="btnrow" style="justify-content:center;margin-top:12px"><button class="btn primary" onclick="try{MB_openImport&&MB_openImport()}catch(e){}">＋ Add a lecture</button></div></div>`;
  return head+out;
}

/* ---------- clickable home stats: in progress / completed / due now ---------- */
function pageStatusList(kind){
  if(kind==='duenow'){
    const q=buildQueue(), due=q.due.concat(q.neu), by={};
    due.forEach(x=>{ (by[x.t.id]=by[x.t.id]||{t:x.t,n:0}).n++; });
    const rows=Object.values(by).sort((a,b)=>b.n-a.n);
    const list=rows.length? rows.map(r=>`<div class="leechrow"><span class="lcount">${r.n}</span>
        <div class="lmid"><b>${esc(r.t.name)}</b><span>${esc(r.t.subject.short)}</span></div>
        <button class="btn" onclick="startTopicDue('${r.t.id}')">Open</button></div>`).join('')   // SL-01
      : `<div class="alldone"><div class="big">✓</div><b>Nothing due right now.</b><p>You're caught up — learn a new topic or come back later.</p></div>`;
    return `<h1>◎ Due now</h1><p class="sub">${rows.length?rows.reduce((s,r)=>s+r.n,0)+' cards due across '+rows.length+' topic'+(rows.length===1?'':'s'):'All caught up.'}</p>
      ${rows.length?`<div class="btnrow" style="margin:2px 0 14px"><button class="btn primary" onclick="startRecallSession();go('review')">▶ Start Active Recall</button></div>`:''}${list}`;
  }
  const st = kind==='completed'?'complete':'inprogress';
  const title = kind==='completed'?'✅ Completed':'📖 In progress';
  const rows=DB.subjects.map(sb=>{ const ts=allTopics.filter(t=>t.ready && t.subject.id===sb.id && status(t.id)===st);
    if(!ts.length) return '';
    return `<h2><span style="color:${COLOR[sb.id]}">●</span> ${esc(sb.name)} <span style="font-size:13px;color:var(--dim);font-weight:400">${ts.length}</span></h2>`+
      ts.map(t=>`<div class="leechrow"><div class="lmid"><b>${t.sn?t.sn+'. ':''}${esc(t.name)}</b><span>${esc(t.lecturer)}</span></div>
        <button class="btn" onclick="go('topic/${t.id}')">Open</button></div>`).join('');
  }).join('');
  return `<h1>${title}</h1>`+(rows.trim()?rows:`<div class="alldone"><div class="big">${kind==='completed'?'🎓':'📖'}</div><b>Nothing here yet.</b>
    <p>${kind==='completed'?'Mark a topic Complete on its page once you have mastered it.':'Open any topic and start studying — it will show here while in progress.'}</p></div>`);
}

/* ---- edge-swipe to open/close the sidebar on touch devices ---- */
(function(){
  let x0=null,y0=null,t0=0,tracking=false;
  const isMobile=()=>window.matchMedia('(max-width:820px)').matches;
  document.addEventListener('touchstart',e=>{
    if(!isMobile()||e.touches.length!==1){tracking=false;return;}
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now();
    const open=document.body.classList.contains('navopen');
    // track an open-swipe only if it begins near the left edge, or any swipe while the menu is open
    tracking = open || x0 < Math.min(46, window.innerWidth*0.12);
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!tracking||x0==null){x0=y0=null;return;}
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    const open=document.body.classList.contains('navopen');
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6 && (Date.now()-t0)<700){
      if(dx>0 && !open) document.body.classList.add('navopen');    // swipe right → open
      else if(dx<0 && open) document.body.classList.remove('navopen'); // swipe left → close
    }
    x0=y0=null; tracking=false;
  },{passive:true});
})();
