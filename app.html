/* ===== one-tap study-mode switcher + the two new modes (Fill-blank, Written) ===== */
function modeSwitcher(t){
  const sw=(label,onclick,active)=>`<button onclick="${onclick}" style="flex:none;border:1px solid ${active?'var(--accent)':'var(--line)'};background:${active?'var(--accent)':'var(--panel)'};color:${active?'#fff':'var(--text)'};border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap">${label}</button>`;
  return `<div style="display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px;margin:8px 0 16px">
    ${sw('📖 Notes',"topicTab='note';render()",topicTab==='note')}
    ${sw('📝 Simplified',"topicTab='simplified';render()",topicTab==='simplified')}
    ${sw('🃏 Flashcards',"go('study/"+t.id+"/primer')",false)}
    ${sw('✓ Quiz',"go('study/"+t.id+"/recall')",false)}
    ${sw('📄 Cram',"go('cram/"+t.id+"')",false)}
    ${sw('✍ Fill-blank',"topicTab='fill';render()",topicTab==='fill')}
    ${sw('🧪 Written',"topicTab='written';render()",topicTab==='written')}
    ${sw('🎧 Podcast',"topicTab='podcast';render()",topicTab==='podcast')}
  </div>`;
}
function genPrompt(topicId,kind,label){
  return `<div class="empty" style="text-align:center">
    <b style="color:var(--text)">${label} isn't built for this lecture yet.</b>
    <p style="color:var(--dim);margin:8px 0 16px">Build it once from your note — takes a few seconds, then it's saved to your account.</p>
    <button class="btn primary" onclick="genExtra('${topicId}','${kind}',this)">✨ Build ${label}</button></div>`;
}
async function buildExtraNow(topicId,kind){
  const t=topById(topicId); if(!t) return null;
  const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API) throw new Error('Not configured yet.');
  let token=null; if(window.__mbSB){ const ses=await window.__mbSB.auth.getSession(); token=ses.data.session&&ses.data.session.access_token; }
  const level=(window.MB_SYNC&&MB_SYNC.currentLevel&&MB_SYNC.currentLevel())||null;
  const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/build-extra',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({topic_id:topicId,kind,level})});
  const out=await r.json();
  if(!r.ok||!out.items) throw new Error(out.reason||out.error||'Could not build this.');
  t.extras=t.extras||{}; t.extras[kind]=out.items;   // cache locally → instant next time (server also saved it)
  return out.items;
}
async function genExtra(topicId,kind,btn){
  if(btn){ btn.disabled=true; btn.textContent='Preparing… ~5s'; }
  try{ await buildExtraNow(topicId,kind); render(); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent='Try again'; } alert(e.message||'Could not build — check your internet and try again.'); }
}

let FIBITEMS=[];
function renderFillBlank(t){
  const items=(t.extras&&t.extras.fill_blank)||null;
  if(!items||!items.length) return genPrompt(t.id,'fill_blank','Fill-in-the-blank');
  FIBITEMS=items;
  return items.map((it,i)=>{
    const q=esc(it.text||'').replace(/_{2,}/,`<input id="fib_${i}" placeholder="answer" onkeydown="if(event.key==='Enter')fibCheck(${i})" style="border:none;border-bottom:2px solid var(--recall);background:transparent;color:var(--text);font-size:15px;min-width:90px;padding:0 4px;outline:none">`);
    return `<div class="card" style="cursor:default;margin-bottom:12px">
      <div style="font-size:15px;line-height:1.6">${q}</div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn primary" onclick="fibCheck(${i})">Check</button>
        ${it.hint?`<button class="btn" onclick="fibHint(${i})">Need a hint?</button>`:''}</div>
      <div id="fibr_${i}" style="margin-top:10px;font-size:14px"></div></div>`;
  }).join('');
}
function fibNorm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
function fibCheck(i){
  const it=FIBITEMS[i]; if(!it) return;
  const el=document.getElementById('fib_'+i), res=document.getElementById('fibr_'+i);
  const val=el?el.value:''; const ok=fibNorm(val)===fibNorm(it.answer);
  if(el){ el.style.borderColor= ok?'var(--recall)':'#ff6b81'; }
  res.innerHTML = ok
    ? `<span style="color:var(--recall);font-weight:700">✓ Correct</span>`
    : `<span style="color:#ff9db1;font-weight:700">✗ Not quite</span> — the answer is <b>${esc(it.answer)}</b>`;
}
function fibHint(i){ const it=FIBITEMS[i]; if(!it) return; document.getElementById('fibr_'+i).innerHTML=`<span style="color:var(--dim)">💡 ${esc(it.hint||'No hint for this one.')}</span>`; }

let WRITTENITEMS=[];
function renderWritten(t){
  const items=(t.extras&&t.extras.written)||null;
  if(!items||!items.length) return genPrompt(t.id,'written','Written test');
  WRITTENITEMS=items;
  return `<p class="sub" style="margin-bottom:14px">Write your answer, then get instant AI feedback marked against the key points. Needs internet.</p>`+
    items.map((it,i)=>`<div class="card" style="cursor:default;margin-bottom:14px">
      <div style="font-weight:700;font-size:15px;margin-bottom:10px">${i+1}. ${esc(it.prompt||'')}</div>
      <textarea id="wt_${i}" rows="4" class="notebox" placeholder="Write your answer…"></textarea>
      <div class="btnrow" style="margin-top:10px"><button class="btn primary" onclick="wtGrade(${i})">Submit for AI feedback</button></div>
      <div id="wtr_${i}" style="margin-top:10px;font-size:14px"></div></div>`).join('');
}
async function wtGrade(i){
  const it=WRITTENITEMS[i]; if(!it) return;
  const el=document.getElementById('wt_'+i), res=document.getElementById('wtr_'+i);
  const ans=(el&&el.value||'').trim();
  if(!ans){ res.innerHTML='<span style="color:var(--dim)">Write an answer first.</span>'; return; }
  res.innerHTML='<span style="color:var(--dim)">Marking…</span>';
  const prompt='Question: '+it.prompt+'\nIdeal answer: '+(it.model_answer||'')+'\nKey marking points: '+((it.points||[]).join('; '))+'\n\nStudent answer: '+ans+'\n\nGive brief feedback (2–4 sentences): what is correct, what is missing, then a score like "3/4 key points". Be encouraging but honest.';
  try{
    const txt=await claudeTutor('You are a fair, concise medical examiner marking a short answer.', [{role:'user',text:prompt}], DATA.settings.explainModel||DATA.settings.tutorEngine||'deepseek-v4-flash');
    res.innerHTML='<div class="md" style="background:var(--panel2,#f1eefb);border-radius:10px;padding:11px 13px">'+md(txt)+'</div>';
  }catch(e){ res.innerHTML='<span style="color:#ff9db1">Couldn\'t reach the AI to mark this — check your internet'+((''+e).indexOf('sign in')>=0?' (approve the one-time Puter sign-in)':'')+'.</span>'; }
}

/* ===== #4/#5 AI Podcast — two-host episode + character voices + Raise Hand ===== */
const POD_FALLBACK=[
 {voice_id:'21m00Tcm4TlvDq8ikWAM',name:'Rachel',gender:'female'},
 {voice_id:'EXAVITQu4vr4xnSDxMaL',name:'Sarah',gender:'female'},
 {voice_id:'AZnzlk1XvdvUeBnXmlld',name:'Domi',gender:'female'},
 {voice_id:'MF3mGyEYCl7XYWbV9V6O',name:'Elli',gender:'female'},
 {voice_id:'pNInz6obpgDQGcFmaJgB',name:'Adam',gender:'male'},
 {voice_id:'ErXwobaYiN019PkySvjV',name:'Antoni',gender:'male'},
 {voice_id:'TxGEqnHWrfWFTfGW9XjX',name:'Josh',gender:'male'},
 {voice_id:'VR6AewLTigWG4xSOukaG',name:'Arnold',gender:'male'}
];
const POD_OPENAI=[{voice_id:'nova',name:'Nova',gender:'female'},{voice_id:'shimmer',name:'Shimmer',gender:'female'},{voice_id:'alloy',name:'Alloy',gender:'neutral'},{voice_id:'fable',name:'Fable',gender:'male'},{voice_id:'echo',name:'Echo',gender:'male'},{voice_id:'onyx',name:'Onyx',gender:'male'}];
let POD={topicId:null};
async function podApi(path,opts){
  const CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API) throw new Error('Not configured yet.');
  let token=null; if(window.__mbSB){ const ses=await window.__mbSB.auth.getSession(); token=ses.data.session&&ses.data.session.access_token; }
  opts=opts||{}; opts.headers=Object.assign({'Authorization':'Bearer '+token},opts.headers||{});
  const r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+path,opts); return {ok:r.ok,data:await r.json()};
}
function podLevel(){ return (window.MB_SYNC&&MB_SYNC.currentLevel&&MB_SYNC.currentLevel())||null; }
function podName(id){ const v=(POD.voices||[]).find(x=>x.voice_id===id); return v?v.name:'Host'; }
function podAudioEl(){
  let a=document.getElementById('podAudio');
  if(!a){ a=document.createElement('audio'); a.id='podAudio'; a.preload='auto'; document.body.appendChild(a);
    a.addEventListener('ended',function(){ podNext(); });
    a.addEventListener('timeupdate',podTick);
  }
  return a;
}
function podStopAudio(){ const a=document.getElementById('podAudio'); if(a){ try{a.pause();}catch(e){} a.removeAttribute('src'); } }
function renderPodcast(t){
  if(POD.topicId!==t.id) setTimeout(function(){ podEnter(t.id,t.name); },30); else setTimeout(podPaint,30);
  return `<div id="podRoot" style="min-height:120px"><div class="empty">Loading the podcast…</div></div>`;
}
function podEnter(id,name){
  podAudioEl();
  if(POD.topicId!==id){ podStopAudio(); POD={ topicId:id, topicName:name||'', lines:null, urls:null, voices:POD.voices||null, voiceA:POD.voiceA||null, voiceB:POD.voiceB||null, i:0, playing:false, speed:1, phase:'load', raise:false }; podLoadScript(id); return; }
  podPaint();
}
async function podLoadScript(id){
  POD.phase='load'; podPaint();
  try{
    const r=await podApi('/podcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic_id:id,level:podLevel()})});
    if(!r.ok||!r.data.lines) throw new Error((r.data&&(r.data.reason||r.data.error))||'Could not write the script.');
    POD.lines=r.data.lines;
    let saved=null; try{ saved=localStorage.getItem('pod_combo_'+id); }catch(e){}
    if(saved){ const p=saved.split('|'); if(p.length===3){ await podSetProvider(p[0],true); POD.voiceA=p[1]; POD.voiceB=p[2]; podGenAudio(); return; } }
    await podSetProvider('openai');
  }catch(e){ POD.phase='error'; POD.err=e.message; podPaint(); }
}
async function podLoadVoices(){
  try{ const r=await podApi('/podcast-voices'); POD.elevenVoices=(r.ok&&r.data.voices&&r.data.voices.length)?r.data.voices:POD_FALLBACK.slice(); }
  catch(e){ POD.elevenVoices=POD_FALLBACK.slice(); }
}
function podDefaults(){
  const fem=(POD.voices||[]).filter(v=>/female|woman/i.test((v.gender||'')+' '+(v.name||'')));
  const list=fem.length>=2?fem:(POD.voices||[]);
  POD.voiceA=(list[0]||{}).voice_id; POD.voiceB=(list[1]||list[0]||{}).voice_id;
}
async function podSetProvider(p,keep){
  // engine (Kokoro / Fish) is now chosen automatically server-side; these are just host labels
  POD.provider = 'auto';
  POD.voices = POD_OPENAI.slice();
  if(!keep) podDefaults();
  POD.phase='voices'; podPaint();
}
async function podGenAudio(){
  POD.phase='gen'; podPaint();
  try{
    const r=await podApi('/podcast-audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic_id:POD.topicId,provider:POD.provider||'openai',voiceA:POD.voiceA,voiceB:POD.voiceB,level:podLevel()})});
    if(!r.ok||!r.data.urls) throw new Error((r.data&&(r.data.reason||r.data.error))||'Could not generate the audio.');
    POD.urls=r.data.urls; POD.lines=r.data.lines||POD.lines;
    try{ localStorage.setItem('pod_combo_'+POD.topicId, (POD.provider||'openai')+'|'+POD.voiceA+'|'+POD.voiceB); }catch(e){}
    let pos=0; try{ pos=parseInt(localStorage.getItem('pod_pos_'+POD.topicId)||'0',10)||0; }catch(e){}
    POD.i=Math.min(pos,POD.urls.length-1); POD.phase='ready'; podSetupMedia(); podLoadLine(POD.i,false); podPaint();
  }catch(e){ POD.phase='voices'; POD.err=e.message; podPaint(); alert(e.message||'Could not generate the audio.'); }
}
function podLoadLine(i,autoplay){
  const a=podAudioEl(); POD.i=Math.max(0,Math.min(i,(POD.urls||[]).length-1));
  a.src=POD.urls[POD.i]; a.playbackRate=POD.speed;
  if(autoplay){ a.play().then(function(){POD.playing=true;podPaint();}).catch(function(){}); }
  try{ localStorage.setItem('pod_pos_'+POD.topicId, String(POD.i)); }catch(e){}
  podPaint();
}
function podToggle(){ const a=podAudioEl(); if(!POD.urls) return; if(a.paused){ if(!a.getAttribute('src')) podLoadLine(POD.i,true); else a.play().then(function(){POD.playing=true;podPaint();}).catch(function(){}); } else { a.pause(); POD.playing=false; podPaint(); } }
function podNext(){ if(!POD.urls) return; if(POD.i<POD.urls.length-1) podLoadLine(POD.i+1,true); else { POD.playing=false; podPaint(); } }
function podPrev(){ if(!POD.urls) return; podLoadLine(Math.max(0,POD.i-1),true); }
function podJump(i){ podLoadLine(i,true); }
function podSpeed(){ const arr=[1,1.25,1.5,0.75]; POD.speed=arr[(arr.indexOf(POD.speed)+1)%arr.length]||1; podAudioEl().playbackRate=POD.speed; podPaint(); }
function podTick(){ const a=document.getElementById('podAudio'); if(!a||!POD.urls) return; const frac=(POD.i+((a.currentTime/(a.duration||1))||0))/POD.lines.length; const p=document.getElementById('podProg'); if(p) p.style.width=Math.min(100,frac*100)+'%'; }
function podRaise(){ podAudioEl().pause(); POD.playing=false; POD.raise=true; podPaint(); }
function podResume(){ POD.raise=false; podPaint(); }
async function podAsk(){
  const qEl=document.getElementById('podQ'), out=document.getElementById('podAns'); const q=(qEl&&qEl.value||'').trim(); if(!q){ return; }
  out.innerHTML='<span style="color:var(--dim)">Thinking…</span>';
  const t=topById(POD.topicId), line=(POD.lines[POD.i]||{}).text||'';
  const prompt='A student is listening to a study podcast on "'+(t?t.name:'')+'" and raised their hand here: "'+line+'". Their question: '+q+'\n\nAnswer clearly and briefly, exam-relevant.';
  try{ const txt=await claudeTutor('You are a friendly medical study tutor answering a quick question during a podcast.', [{role:'user',text:prompt}], DATA.settings.explainModel||'deepseek-v4-flash'); out.innerHTML='<div class="md">'+md(txt)+'</div>'; }
  catch(e){ out.innerHTML='<span style="color:#ff9db1">Couldn\'t reach the AI — check your internet'+((''+e).indexOf('sign in')>=0?' (approve the one-time Puter sign-in)':'')+'.</span>'; }
}
function podSetupMedia(){
  if(!('mediaSession' in navigator)) return;
  try{
    const t=topById(POD.topicId);
    navigator.mediaSession.metadata=new MediaMetadata({ title:((t&&t.name)||'Lecture')+' — Podcast', artist:'MedBank', album:(t&&t.subject&&t.subject.name)||'' });
    navigator.mediaSession.setActionHandler('play',podToggle);
    navigator.mediaSession.setActionHandler('pause',podToggle);
    navigator.mediaSession.setActionHandler('nexttrack',podNext);
    navigator.mediaSession.setActionHandler('previoustrack',podPrev);
  }catch(e){}
}
function podPaint(){
  const root=document.getElementById('podRoot'); if(!root) return;
  if(POD.phase==='load'){ root.innerHTML='<div class="empty">✍️ Writing the podcast script from your note…</div>'; return; }
  if(POD.phase==='error'){ root.innerHTML='<div class="empty">'+esc(POD.err||'Something went wrong')+'<br><br><button class="btn primary" onclick="podLoadScript(POD.topicId)">Try again</button></div>'; return; }
  if(POD.phase==='gen'){ root.innerHTML='<div class="empty">🎙️ Recording the voices… ~30–60s<br><span style="color:var(--dim);font-size:13px">Made once, then it\'s saved for instant replay.</span></div>'; return; }
  if(POD.phase==='voices'){
    const opts=(POD.voices||[]).map(function(v){ return '<option value="'+v.voice_id+'">'+esc(v.name)+(v.gender?' · '+esc(v.gender):'')+'</option>'; }).join('');
    root.innerHTML='<div class="card" style="cursor:default"><div style="font-weight:800;margin-bottom:10px">🎧 Choose your hosts</div>'
      +'<label style="font-size:12.5px;color:var(--dim)">Host A</label><select id="podVA" class="sbox">'+opts+'</select>'
      +'<label style="font-size:12.5px;color:var(--dim);margin-top:8px;display:block">Host B</label><select id="podVB" class="sbox">'+opts+'</select>'
      +'<div class="btnrow" style="margin-top:14px"><button class="btn primary" onclick="POD.voiceA=document.getElementById(\'podVA\').value;POD.voiceB=document.getElementById(\'podVB\').value;podGenAudio()">▶ Generate &amp; play</button></div>'
      +'<div style="font-size:11.5px;color:var(--dim);margin-top:8px">Two natural hosts, generated once and saved for instant replay.</div></div>'
      +'<div style="margin-top:14px;font-weight:700">Script preview</div>'
      +'<div class="card" style="cursor:default;margin-top:6px">'+POD.lines.map(function(l){ return '<div style="margin:6px 0"><b style="color:'+(l.speaker==='A'?'var(--primer)':'var(--recall)')+'">'+(l.speaker==='A'?'A':'B')+'</b> '+esc(l.text)+'</div>'; }).join('')+'</div>';
    setTimeout(function(){ const a=document.getElementById('podVA'),b=document.getElementById('podVB'); if(a&&POD.voiceA)a.value=POD.voiceA; if(b&&POD.voiceB)b.value=POD.voiceB; },0);
    return;
  }
  if(POD.raise){
    root.innerHTML='<div class="card" style="cursor:default"><div style="font-weight:800;margin-bottom:8px">✋ Ask the hosts</div>'
      +'<textarea id="podQ" class="notebox" rows="3" placeholder="Your question about this bit…"></textarea>'
      +'<div class="btnrow" style="margin-top:10px;gap:8px"><button class="btn primary" onclick="podAsk()">Ask</button><button class="btn" onclick="podResume()">↩ Back to the podcast</button></div>'
      +'<div id="podAns" style="margin-top:12px;font-size:14px"></div></div>';
    return;
  }
  const nA=podName(POD.voiceA), nB=podName(POD.voiceB), t=topById(POD.topicId);
  root.innerHTML='<div class="card" style="cursor:default">'
    +'<div style="display:flex;align-items:center;gap:10px"><div style="font-size:26px">🎧</div><div><div style="font-weight:800">'+esc((t&&t.name)||'Podcast')+'</div><div style="font-size:12px;color:var(--dim)">Hosts: '+esc(nA)+' &amp; '+esc(nB)+' · '+POD.lines.length+' lines</div></div></div>'
    +'<div style="height:8px;background:var(--panel2,#eee);border-radius:5px;overflow:hidden;margin:14px 0 6px"><div id="podProg" style="height:100%;width:0;background:var(--accent)"></div></div>'
    +'<div id="podTime" style="font-size:12px;color:var(--dim)">Line '+(POD.i+1)+' / '+POD.lines.length+'</div>'
    +'<div class="btnrow" style="justify-content:center;gap:16px;margin:14px 0"><button class="btn" onclick="podPrev()">⏮</button><button class="btn primary" style="min-width:100px" onclick="podToggle()">'+(POD.playing?'⏸ Pause':'▶ Play')+'</button><button class="btn" onclick="podNext()">⏭</button></div>'
    +'<div class="btnrow" style="justify-content:center;gap:10px"><button class="btn" onclick="podSpeed()">⚡ '+POD.speed+'×</button><button class="btn" onclick="podRaise()">✋ Raise hand</button></div></div>'
    +'<div style="margin-top:14px;font-weight:700">Transcript</div>'
    +'<div class="card" style="cursor:default;margin-top:6px">'+POD.lines.map(function(l,idx){ return '<div onclick="podJump('+idx+')" id="podL'+idx+'" style="margin:2px -6px;padding:7px 8px;border-radius:8px;cursor:pointer;background:'+(idx===POD.i?'var(--panel2,#eee)':'transparent')+'"><b style="color:'+(l.speaker==='A'?'var(--primer)':'var(--recall)')+'">'+esc(l.speaker==='A'?nA:nB)+'</b> '+esc(l.text)+'</div>'; }).join('')+'</div>';
  const cur=document.getElementById('podL'+POD.i); if(cur) cur.scrollIntoView({block:'center',behavior:'smooth'});
}

async function admApi(path,opts){

    startedTopics().forEach(t=>(t.recall||[]).forEach(c=>{ const id=cid(t.id,'recall',c), s=DATA.cards[id];
      if(s&&s.box>=3&&s.due>today) out.push({t,c,id,deck:'recall',conf:true}); }));

    if(s&&s.due<=today){ if(reviewBucket(s.box,!!DATA.starred[id])===k) out.push({t,c,id,deck:'recall',box:s.box,isNew:false}); } }));

}

/* ---- notification nudge: a MIX of hard + due cards ---- */
function nudgeItems(max){
  max=max||8; const today=dayNum();
  const hard=starItems();
  const due=[];
  startedTopics().forEach(t=>(t.recall||[]).forEach(c=>{ const id=cid(t.id,'recall',c), s=DATA.cards[id];
    if(s && s.due<=today && !DATA.starred[id]) due.push({t,c,id,deck:'recall'}); }));
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
  sh(hard); sh(due);
  const out=[]; let hi=0,di=0;                    // interleave ~1 hard : 2 due
  while(out.length<max && (hi<hard.length||di<due.length)){
    if(hi<hard.length) out.push(Object.assign({hard:true},hard[hi++]));
    if(out.length<max && di<due.length) out.push(due[di++]);
    if(out.length<max && di<due.length) out.push(due[di++]);
  }
  return out;
}

/* build the notification body carrying the actual card Q&A */
function nudgeBody(items){
  const clip=(s,n)=>{ s=(s||'').replace(/\s+/g,' ').trim(); return s.length>n?s.slice(0,n-1)+'…':s; };
  const lines=items.slice(0,3).map(it=>{
    const ic=it.hard?'🔴':'🔵';
    const a=it.deck==='primer'?(it.c.lecturer||''):it.c.a;
    return `${ic} ${clip(it.c.q,90)}\n     ↳ ${clip(a,100)}`;
  });
  const more=items.length-3;
  return lines.join('\n\n') + (more>0?`\n\n+ ${more} more · tap to drill`:`\n\nTap to drill`);
}
/* short in-app beep alarm (only works while the app is open) */
function playAlarm(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC();
    [0,0.45,0.9].forEach(dt=>{ const o=ac.createOscillator(), g=ac.createGain();
      o.type='square'; o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime+dt;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
      o.start(t); o.stop(t+0.34);
    });
    setTimeout(()=>{ try{ac.close();}catch(e){} },1600);
  }catch(e){}
}

/* Idle Detection (Android/Chrome): nudge sooner when the phone is unlocked & in use.
   Only runs while MedBank's worker is alive; unsupported/blocked on iPhone. */
let _idleDet=null;
async function startIdle(requestIfNeeded){
  try{
    if(!DATA.settings.useIdle || !('IdleDetector' in window)) return;
    let state='denied';
    try{ state=(await navigator.permissions.query({name:'idle-detection'})).state; }catch(e){}
    if(state!=='granted'){
      if(!requestIfNeeded) return;
      const p=await window.IdleDetector.requestPermission();
      if(p!=='granted'){ DATA.settings.useIdle=false; persist(); return; }
    }
    if(_idleDet) return;                       // already watching
    _idleDet=new window.IdleDetector();
    _idleDet.addEventListener('change',()=>{
      // fire when the user is active AND the screen is unlocked = phone in use
      if(_idleDet.userState==='active' && _idleDet.screenState==='unlocked') nudgeTick(false);
    });
    await _idleDet.start({threshold:60000});
  }catch(e){}
}

/* the recurring check — fires a nudge every N minutes while conditions are met */
let _lastTickShown=0;
function nudgeTick(force){
  try{
    const s=DATA.settings;
    if(!s.remindOn) return;
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    const hr=new Date().getHours();
    if(!force && (hr<(s.quietStart||7) || hr>=(s.quietEnd||22))) return;   // quiet hours
    const every=Math.max(5,(s.remindMins||120))*60e3;
    const now=Date.now();
    if(!force && now-(s.lastNudge||0) < every) return;
    if(todayLog().cards>0 && (now-(s.lastNudge||0)) < every) { /* studied recently is fine */ }
    const items=nudgeItems(10);
    if(!items.length) return;                     // nothing to review — no nag
    s.lastNudge=now; persist();
    const body=nudgeBody(items), url='./app.html#/nudge';
    swPing('notify',{body,url,strict:s.strict});
    swPing('payload',{body,url});
    if(document.visibilityState==='visible' && now-_lastTickShown>5000){
      _lastTickShown=now; playAlarm();
      if(s.strict) strictOverlay(items.length);
    }
  }catch(e){}
}

function examPool(scope){                        // MCQ-capable recall cards for a scope
  let items=[];
  if(scope==='clinical') items=clinItems();
  else if(scope==='all'){ allTopics.forEach(t=>{ if(!t.ready) return;
      (t.recall||[]).forEach(c=>{ if(c.opts&&c.opts.length) items.push({t,c,id:cid(t.id,'recall',c),deck:'recall'}); }); }); }
  else { const s=subjById(scope); if(s) s.modules.flatMap(m=>m.topics).forEach(t=>{ if(!t.ready) return;
      (t.recall||[]).forEach(c=>{ if(c.opts&&c.opts.length) items.push({t,c,id:cid(t.id,'recall',c),deck:'recall'}); }); }); }
  // dedupe by question (twin syllabus decks)
  const seen={}, out=[]; items.forEach(it=>{ const k=hstr(it.c.q); if(seen[k])return; seen[k]=1; out.push(it); });
  return out;
}

    controls = `<div class="kbd">Tap an option · keys 1–4 · or Skip / Prev / Shuffle below</div>${navRow}`;
  }else{
    const last=S.i>=n-1;

/* ---- MCQ interaction (Recall cards with options) ---- */
function isMcqCard(it){ return it && it.deck!=='primer' && it.c && it.c.opts && it.c.opts.length; }
function cardTap(){
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it) return;
  if(isMcqCard(it)){ if(!S.opts) showOpts(); return; }   // options come first; don't leak the answer
  reveal();
}
function showOpts(){
  if(!S) return; if(S.opts) return; S.opts=true;
  markActive(); const it=S.items[S.order[S.i]]; if(it) touchTopic(it.t.id);
  render();
}
function pickOpt(i){
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it||S.pick!=null||!isMcqCard(it)) return;
  const c=it.c, ok=(i===c.ans);
  S.pick=i; S.show=true;
  const beforeCards=todayLog().cards, beforeLvl=levelInfo().i, beforeStreak=curStreak(), goal=DATA.daily.goal, floor=DATA.daily.floor, beforeMet=streakMet();
  markActive();
  if(it.conf){ if(!ok) rateSRS(it.id,false); }          // confidence check: miss re-enters pipeline
  else rateSRS(it.id,ok);
  logRate(ok); logDaily(!!it.isNew, it.t.subject.id); touchTopic(it.t.id);
  S.session.done++; if(ok) S.session.correct++;
  if(!ok && !it.conf){                                   // failed → auto-add to hard cards + mistakes log
    DATA.starred[it.id]=1; logMiss(it.id);
    try{ if(typeof swPing==='function') swPing('hardcount',{n:starCount()}); }catch(e){}
  }
  if(S.mode==='deck') DATA.pos['pos:'+S.t.id+S.deck]=Math.min(S.i+1,S.items.length-1);
  persist();
  const afterCards=todayLog().cards, afterLvl=levelInfo().i, afterStreak=curStreak();
  if(afterLvl>beforeLvl)                          celebrate('level','Level up · '+LEVELS[afterLvl].n);
  else if(beforeCards<goal && afterCards>=goal)   celebrate('goal','🎉 Daily goal complete!');
  else if(!beforeMet && streakMet())              celebrate('floor','✓ Day’s target met — streak safe!');
  else if(afterStreak>beforeStreak && afterStreak%7===0) celebrate('streak','🔥 '+afterStreak+'-day streak!');
  render(); window.scrollTo(0,0);
}
function mcqNext(){
  if(!S) return;
  if(S.i>=S.items.length-1){
    if(S.mode!=='deck'){ S.i=S.items.length; render(); window.scrollTo(0,0); return; }
    S.show=false;S.opts=false;S.pick=null; render(); return;   // deck: stay on last card
  }
  S.i++; S.show=false;S.opts=false;S.pick=null; render(); window.scrollTo(0,0);
}

function reveal(){
  if(!S) return;
  const it=S.items[S.order[S.i]];
  if(isMcqCard(it)){ if(!S.opts) showOpts(); else if(S.pick!=null) mcqNext(); return; }
  if(!S.show){ markActive(); if(it) touchTopic(it.t.id); }
  S.show=!S.show; render();
}
function step(d){ if(!S)return; const n=S.i+d; if(n<0||n>=S.items.length)return;
  S.i=n; S.show=false; S.opts=false; S.pick=null;
  if(S.mode==='deck'){ DATA.pos['pos:'+S.t.id+S.deck]=S.i; persist(); }
  render(); window.scrollTo(0,0);
}
function shuffle(){ if(!S)return; for(let i=S.order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];} S.i=0;S.show=false;S.opts=false;S.pick=null;render(); }
function restartDeck(){ if(!S)return; S.i=0;S.show=false;S.opts=false;S.pick=null;S.order=S.items.map((_,k)=>k);
  if(S.mode==='deck'){DATA.pos['pos:'+S.t.id+S.deck]=0;persist();} render(); }
function sessionNext(){                       // advance a non-rated (primer) card inside a session
  if(!S) return; S.session.done++;
  if(S.i>=S.items.length-1){ S.i=S.items.length; S.show=false;S.opts=false;S.pick=null; render(); window.scrollTo(0,0); return; }
  S.i++; S.show=false;S.opts=false;S.pick=null; render(); window.scrollTo(0,0);
}
function flashReview(id,ok){
  const txt=reviewIntervalText(id);
  const host=document.createElement('div'); host.className='revtoast';
  host.innerHTML=`<span class="rt ${ok?'':'no'}">${ok?'✓':'✗ hard card ·'}</span> next review <b>${txt}</b>`;
  document.body.appendChild(host);
  setTimeout(()=>{ host.style.transition='opacity .4s'; host.style.opacity='0'; setTimeout(()=>host.remove(),400); }, 1600);
}
function celebrate(kind,text){
  try{ if(navigator.vibrate) navigator.vibrate(kind==='goal'||kind==='level'?[30,40,30]:20); }catch(e){}
  const host=document.createElement('div'); host.className='celebrate';
  const emo = kind==='level'?['🎓','⭐','🎉','✨']:kind==='streak'?['🔥','🔥','✨','🎉']:['🎉','✨','🎊','⭐','💪'];
  let bits='';
  for(let i=0;i<18;i++){ const e=emo[i%emo.length];
    bits+=`<span style="left:${Math.random()*100}%;animation-delay:${(Math.random()*0.3).toFixed(2)}s;font-size:${(14+Math.random()*16)|0}px">${e}</span>`; }
  host.innerHTML=`<div class="celebits">${bits}</div>${text?`<div class="celebanner">${esc(text)}</div>`:''}`;
  document.body.appendChild(host);
  setTimeout(()=>host.remove(),1900);
}
function rateCard(ok){
  if(!S) return; const it=S.items[S.order[S.i]]; if(!it) return;
  const beforeCards=todayLog().cards, beforeLvl=levelInfo().i, beforeStreak=curStreak(), goal=DATA.daily.goal, floor=DATA.daily.floor, beforeMet=streakMet();
  markActive();
  if(it.conf){ if(!ok) rateSRS(it.id,false); }   // confidence check: correct = no change, miss = re-enter pipeline
  else rateSRS(it.id,ok);
  logRate(ok); logDaily(!!it.isNew, it.t.subject.id); touchTopic(it.t.id);
  S.session.done++; if(ok)S.session.correct++;
  if(!ok && !it.conf){ DATA.starred[it.id]=1; logMiss(it.id); try{ if(typeof swPing==='function') swPing('hardcount',{n:starCount()}); }catch(e){} }  // failed → hard card + mistakes log
  if(S.mode==='deck') DATA.pos['pos:'+S.t.id+S.deck]=Math.min(S.i+1,S.items.length-1);
  persist();
  if(!it.conf) flashReview(it.id, ok);
  // micro-celebrations
  const afterCards=todayLog().cards, afterLvl=levelInfo().i, afterStreak=curStreak();
  if(afterLvl>beforeLvl)                         celebrate('level','Level up · '+LEVELS[afterLvl].n);
  else if(beforeCards<goal && afterCards>=goal)  celebrate('goal','🎉 Daily goal complete!');
  else if(!beforeMet && streakMet())             celebrate('floor','✓ Day’s target met — streak safe!');
  else if(afterStreak>beforeStreak && afterStreak%7===0) celebrate('streak','🔥 '+afterStreak+'-day streak!');
  if(S.i>=S.items.length-1){
    if(S.mode!=='deck'){ S.i=S.items.length; render(); window.scrollTo(0,0); return; }
    S.show=false;S.opts=false;S.pick=null; render(); return;            // deck: stay on last card
  }
  S.i++; S.show=false;S.opts=false;S.pick=null; render(); window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  const h=location.hash;
  if(/^#\/exam/.test(h) && S && S.mode==='exam' && !S.finished && S.items.length){   // exam keys
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const c=S.items[S.order[S.i]].c;
    if(/^[1-9]$/.test(e.key)){ const idx=+e.key-1; if(idx<c.opts.length) examPick(idx); return; }
    if(e.key==='ArrowRight'){ examNav(1); return; }
    if(e.key==='ArrowLeft'){ examNav(-1); return; }
    return;
  }
  if(!/^#\/(study|review|hard)/.test(h)) return;
  if(!S) return;
  const it=S.items[S.order[S.i]], canRate=it && it.deck!=='primer';
  if(isMcqCard(it)){                                   // MCQ keyboard flow
    if(e.code==='Space'){ e.preventDefault(); if(!S.opts) showOpts(); else if(S.pick!=null) mcqNext(); return; }
    if((e.key==='o'||e.key==='O') && !S.opts){ showOpts(); return; }
    if(S.opts && S.pick==null && /^[1-9]$/.test(e.key)){ const idx=+e.key-1; if(idx<it.c.opts.length) pickOpt(idx); return; }
    if(e.key==='ArrowRight'){ mcqNext(); return; }     // skip (or next after answering)
    if(e.key==='ArrowLeft'){ step(-1); return; }       // previous
    if(e.key==='s'||e.key==='S'){ shuffle(); return; } // shuffle
    return;
  }
  if(e.code==='Space'){ e.preventDefault(); reveal(); return; }
  if(canRate && S.show){ if(e.key==='1')rateCard(false); if(e.key==='2')rateCard(true); return; }
  if(!canRate && (S.mode==='daily'||S.mode==='hard') && S.show){ if(e.key==='ArrowRight')sessionNext(); return; }
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
});

/* ---------- jump back in / weekly progress ---------- */
function weekDayStrs(){                       // dates of the current week (Sun→today), oldest→newest
  const today=new Date(); const start=new Date(today); start.setDate(start.getDate()-start.getDay());
  const out=[]; for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)) out.push(dstr(new Date(d)));
  return out;
}
function weekProgress(){
  const days=weekDayStrs(), touched=new Set();
  days.forEach(d=>Object.keys(DATA.dayTopics[d]||{}).forEach(id=>touched.add(id)));
  let complete=0, inprog=0;
  touched.forEach(id=>{ if(status(id)==='complete') complete++; else inprog++; });
  const notStarted = allTopics.filter(t=>t.ready && status(t.id)==='notstarted').length;
  return {touched:touched.size, complete, inprog, notStarted};
}
function dayLabel(ds){
  if(ds===dstr()) return 'Today';
  if(ds===yesterdayStr()) return 'Yesterday';
  return new Date(ds+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
}
function pageJumpback(){

                .sort().reverse().slice(0,14);

        <button class="btn" onclick="event.stopPropagation();go('study/${t.id}/recall')">Continue →</button></div>`;
    }).join('');

    return `<div class="jb-day"><div class="jb-dh"><b>${dayLabel(ds)}</b>

  return `<h1>↩ Jump back in</h1>

function searchRun(){

    ['primer','recall'].forEach(dk=>(t[dk]||[]).forEach(c=>{

  });

/* ---- automatic backup to a file (File System Access API) ---- */
function idbSet(k,v){ return new Promise((res,rej)=>{ const o=indexedDB.open('medbank_fs',1);
  o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains('h')) o.result.createObjectStore('h'); };
  o.onsuccess=()=>{ const tx=o.result.transaction('h','readwrite'); tx.objectStore('h').put(v,k);
    tx.oncomplete=()=>{o.result.close();res();}; tx.onerror=()=>rej(tx.error); }; o.onerror=()=>rej(o.error); }); }
function idbGet(k){ return new Promise((res,rej)=>{ const o=indexedDB.open('medbank_fs',1);
  o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains('h')) o.result.createObjectStore('h'); };
  o.onsuccess=()=>{ const tx=o.result.transaction('h','readonly'); const r=tx.objectStore('h').get(k);
    r.onsuccess=()=>{o.result.close();res(r.result);}; r.onerror=()=>rej(r.error); }; o.onerror=()=>rej(o.error); }); }
let _bakHandle=null,_bakTimer=null,_bakBusy=false,_bakPaused=false;
function fsSupported(){ return typeof window.showSaveFilePicker==='function'; }
async function _perm(h,req){ if(!h||!h.queryPermission) return false; const o={mode:'readwrite'};
  if((await h.queryPermission(o))==='granted') return true;
  if(req && (await h.requestPermission(o))==='granted') return true; return false; }
async function writeBackup(force){
  if(_bakBusy||!_bakHandle||!DATA.settings.autoBackup) return;
  _bakBusy=true;
  try{
    if(await _perm(_bakHandle,!!force)){
      const ws=await _bakHandle.createWritable(); await ws.write(JSON.stringify(DATA)); await ws.close();
      _bakPaused=false; DATA.settings.lastBackup=Date.now();
      try{ localStorage.setItem(SKEY,JSON.stringify(DATA)); }catch(e){}   // persist timestamp without re-scheduling
    } else { _bakPaused=true; }
  }catch(e){ _bakPaused=true; }
  _bakBusy=false;
}
function scheduleBackup(){ if(!DATA.settings.autoBackup||!_bakHandle) return;
  clearTimeout(_bakTimer); _bakTimer=setTimeout(()=>writeBackup(false),1200); }   // debounced auto-save
async function enableAutoBackup(){
  if(!fsSupported()){ alert('Automatic file backup needs Chrome or Edge (works on Android Chrome and desktop). On this browser, use Export / Import below instead.'); return; }
  try{
    const h=await window.showSaveFilePicker({suggestedName:'medbank-backup.json',
      types:[{description:'MedBank backup',accept:{'application/json':['.json']}}]});
    _bakHandle=h; _bakPaused=false; await idbSet('bakHandle',h);
    DATA.settings.autoBackup=true; persist(); await writeBackup(true); render();
  }catch(e){ /* user cancelled the file picker */ }
}
async function disableAutoBackup(){ DATA.settings.autoBackup=false; persist(); _bakHandle=null;
  try{ await idbSet('bakHandle',null); }catch(e){} render(); }
async function resumeAutoBackup(){ await writeBackup(true); render(); }
async function initAutoBackup(){
  if(!DATA.settings.autoBackup||!fsSupported()) return;
  try{ const h=await idbGet('bakHandle'); if(h){ _bakHandle=h; _bakPaused=!(await _perm(h,false));
    if(!_bakPaused) writeBackup(false); render(); } }catch(e){}
}
async function shareBackup(){
  try{
    const file=new File([JSON.stringify(DATA)],'medbank-backup-'+dstr()+'.json',{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file],title:'MedBank backup'});
    else exportData();
  }catch(e){ if(e&&e.name!=='AbortError') exportData(); }
}
async function copyBackup(){
  const txt=JSON.stringify(DATA);
  try{ await navigator.clipboard.writeText(txt);
    alert('Backup copied. Now open MedBank in the OTHER browser → Settings → "Restore from text" → paste → Restore.');
  }catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); alert('Backup copied. Paste it into "Restore from text" in the other browser.'); }
    catch(e2){ alert('Copy failed — use Export or Share instead.'); }
  }
}

function examResult(){
  const n=S.items.length, dur=Math.round((S.finished-S.started)/1000);

    const s=it.t.subject.short; (bySub[s]=bySub[s]||{n:0,c:0}); bySub[s].n++; if(ok)bySub[s].c++; });
  const pct=Math.round(correct/n*100), mm=Math.floor(dur/60), ss=dur%60;
  const grade=pct>=70?['Pass','#3ecf8e']:pct>=50?['Borderline','#ffb454']:['Needs work','#ff6b6b'];
  const subRows=Object.keys(bySub).map(k=>{ const b=bySub[k], p=Math.round(b.c/b.n*100);

  const missed=[]; S.items.forEach((it,k)=>{ if(S.answers[k]!==it.c.ans) missed.push({it,k}); });

  return `<div class="donecard ${pct>=70?'clear':''}">

function testCloudVoice(id){ const ent=CLOUD_VOICES.find(v=>v.id===id)||CLOUD_VOICES[0];
  unlockAudio();                                   // must run inside this tap for iOS
  const SAMPLE='Hello, I am your MedBank tutor. Let us begin the quiz.';
  let done=false;
  const devFallback=(msg)=>{ if(done)return; done=true;
    try{ if('speechSynthesis'in window){ const u=tuneUtter(new SpeechSynthesisUtterance(SAMPLE)); speechSynthesis.cancel(); speechSynthesis.speak(u); } }catch(e){}
    if(msg){ try{ alert(msg); }catch(e){} } };
  if(location.protocol==='file:'){ devFallback('Realistic online voices only work on the live site (medbank.com.ng), not when the app is opened as a local file. Playing your device voice for now.'); return; }
  loadPuter(()=>{
    if(!(window.puter&&window.puter.ai&&window.puter.ai.txt2speech)){ devFallback('Could not reach the online voice service — check your internet. Using your device voice instead.'); return; }
    try{ window.puter.ai.txt2speech(SAMPLE,{voice:ent.id,engine:'neural',language:ent.lang})
      .then(audio=>{ done=true; const src=audio&&audio.src; if(src) playCloudSrc(src,null); else { const p=audio.play&&audio.play(); if(p&&p.catch)p.catch(()=>devFallback()); } })
      .catch(err=>devFallback('The realistic voice needs a one-time free Puter sign-in (a popup) — approve it once, then tap ▶ again. Using your device voice for now.')); }catch(e){ devFallback('Voice error — using your device voice.'); } }); }
function testVoice(){ speak('Hello, I am your MedBank tutor. Let us begin. Name the four stages of inflammation in lobar pneumonia.'); }
function topVoices(){                       // up to 5 of the most natural English voices on this device
  const en=enVoices().filter(v=>!/siri/i.test(v.name));
  const score=v=>{ const n=v.name.toLowerCase(); let s=0;
    if(/enhanced|premium/.test(n)) s+=100;
    if(/samantha|allison|ava|serena|nicky|karen|moira|tessa|daniel|aaron|tom|alex|zoe|evan|nathan/.test(n)) s+=45;
    if(/google/.test(n)) s+=35; if(/microsoft/.test(n)) s+=30;
    if(/en[-_]us/i.test(v.lang)) s+=10; else if(/en[-_]gb/i.test(v.lang)) s+=7;
    if(v.localService) s+=4; return s; };
  const seen={}, out=[]; en.sort((a,b)=>score(b)-score(a));
  for(const v of en){ if(seen[v.name])continue; seen[v.name]=1; out.push(v); if(out.length>=5)break; }
  return out;
}
function testVoiceNamed(name){ try{ if(!ttsOn())return; const v=VOICES.find(x=>x.name===name);
  const u=new SpeechSynthesisUtterance('Hello, I am your MedBank tutor. What are the three C’s of measles?');
  if(v) u.voice=v; u.rate=1; u.pitch=1; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function deviceSpeakThen(text, cb){ try{ if(!('speechSynthesis'in window)){ cb&&cb(); return; }
  const u=tuneUtter(new SpeechSynthesisUtterance(stripMd(text)));
  u.onend=()=>cb&&cb(); u.onerror=()=>cb&&cb();
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}catch(e){ cb&&cb(); } }
function speakThen(text, cb){ voiceSpeak(text, cb, 'tutor'); }
function aiScroll(){ setTimeout(()=>{ const el=document.getElementById('aichat'); if(el) el.scrollTop=el.scrollHeight; },40); }
async function claudeTutor(sys, history, model){
  await new Promise(res=>loadPuter(res));
  if(!(window.puter&&window.puter.ai&&window.puter.ai.chat)) throw new Error('AI service unavailable — check your internet (and sign in to Puter once if asked).');
  const msgs=[{role:'system',content:sys}].concat(history.slice(-24).map(m=>({role:m.role==='user'?'user':'assistant', content:(m.role==='user'&&m.send)||m.text})));
  const r=await window.puter.ai.chat(msgs,{model});
  const txt=(r&&r.message&&r.message.content&&r.message.content[0]&&r.message.content[0].text)||(typeof r==='string'?r:'');
  if(!txt.trim()) throw new Error('No reply from the AI — try again.');

12. Never assume prior knowledge — teach an intelligent beginner who has never studied this before, layer by layer, until even complex concepts feel obvious.
13. Prioritise understanding over memorisation — don't just tell me facts, help me understand WHY they are true, so I can reason out the answer even if I forget the exact wording.
14. Make me think — occasionally ask a short question ("If the valve is narrowed, what do you think happens to the blood behind it?") and then explain the answer so I actively learn.

        const txt=(r2&&r2.message&&r2.message.content&&r2.message.content[0]&&r2.message.content[0].text)||(typeof r2==='string'?r2:'');
        if(txt.trim()){ setExplBodyMd(txt); return; }
      }catch(e){ /* fall through to error */ }
    }
    setExplBody('<p>Could not reach the AI service. Check your internet — and if Puter asks you to sign in (free), do that once, then try again.</p>');
  });
}

function unseenCount(t){ return (t.recall||[]).filter(c=>!DATA.cards[cid(t.id,'recall',c)]).length; }
function planAdd(id){ DATA.plan=DATA.plan||[]; if(!DATA.plan.includes(id)) DATA.plan.unshift(id); persist(); render(); }
function planRemove(id){ DATA.plan=(DATA.plan||[]).filter(x=>x!==id); persist(); render(); }
function planTop(id){ DATA.plan=[id].concat((DATA.plan||[]).filter(x=>x!==id)); persist(); render(); }
function pagePlan(){
  const head=`<h1>🗓 This week's topics</h1><p class="sub">Choose where your daily <b>new cards</b> come from. Only the <b>top 5 per course</b> are active at a time (newest at the top); the rest wait. Each topic's cards come in order, interleaved with the others, ${DATA.daily.courseGoal||20} new per course a day. Finished topics drop off; unfinished ones stay for next week — add new topics anytime and they go to the top.</p>`;
  let out='';
  DB.subjects.filter(sb=>sb.readyCount>0).forEach(sb=>{
    const planTopics=(DATA.plan||[]).map(topById).filter(t=>t&&t.ready&&t.subject.id===sb.id);
    let activeShown=0;
    const rows=planTopics.map(t=>{ const un=unseenCount(t), active=(un>0 && activeShown<5); if(active) activeShown++;
      const chip=un===0?'<span class="pchip done">✓ finished</span>':active?'<span class="pchip act">● active</span>':'<span class="pchip">waiting</span>';
      return `<div class="leechrow"><div class="lmid"><b>${t.sn?t.sn+'. ':''}${esc(t.name)}</b><span>${chip} · ${un} new left</span></div>
        <div class="btnrow">${(active||un===0)?'':`<button class="btn tiny" onclick="planTop('${t.id}')">↑ Top</button>`}<button class="btn tiny" onclick="planRemove('${t.id}')">✕</button></div></div>`;
    }).join('');
    const avail=allTopics.filter(t=>t.ready&&t.subject.id===sb.id&&!(DATA.plan||[]).includes(t.id));
    const add=avail.length?`<details class="notewrap"><summary>＋ Add a ${esc(sb.short)} topic</summary>
       <div class="vchips" style="padding:8px 0">${avail.map(t=>`<div class="vchip" onclick="planAdd('${t.id}')">${t.sn?t.sn+'. ':''}${esc(t.name)}</div>`).join('')}</div></details>`
       :`<p class="sub">All built ${esc(sb.short)} topics are already in your plan.</p>`;
    out+=`<h2><span style="color:${COLOR[sb.id]}">●</span> ${esc(sb.name)} <span style="font-size:13px;color:var(--dim);font-weight:400">${planTopics.length} selected</span></h2>${rows||'<p class="sub">No topics selected yet — add some below.</p>'}${add}`;

}

/* ---------- clickable home stats: in progress / completed / due now ---------- */
function pageStatusList(kind){
  if(kind==='duenow'){
    const q=buildQueue(), due=q.due.concat(q.neu), by={};
    due.forEach(x=>{ (by[x.t.id]=by[x.t.id]||{t:x.t,n:0}).n++; });
    const rows=Object.values(by).sort((a,b)=>b.n-a.n);
    const list=rows.length? rows.map(r=>`<div class="leechrow"><span class="lcount">${r.n}</span>
        <div class="lmid"><b>${esc(r.t.name)}</b><span>${esc(r.t.subject.short)}</span></div>

      : `<div class="alldone"><div class="big">✓</div><b>Nothing due right now.</b><p>You're caught up — learn a new topic or come back later.</p></div>`;
    return `<h1>◎ Due now</h1><p class="sub">${rows.length?rows.reduce((s,r)=>s+r.n,0)+' cards due across '+rows.length+' topic'+(rows.length===1?'':'s'):'All caught up.'}</p>
      ${rows.length?`<div class="btnrow" style="margin:2px 0 14px"><button class="btn primary" onclick="startRecallSession();go('review')">▶ Start Active Recall</button></div>`:''}${list}`;
  }
  const st = kind==='completed'?'complete':'inprogress';
  const title = kind==='completed'?'✅ Completed':'📖 In progress';
  const rows=DB.subjects.map(sb=>{ const ts=allTopics.filter(t=>t.ready && t.subject.id===sb.id && status(t.id)===st);
    if(!ts.length) return '';
    return `<h2><span style="color:${COLOR[sb.id]}">●</span> ${esc(sb.name)} <span style="font-size:13px;color:var(--dim);font-weight:400">${ts.length}</span></h2>`+

  }).join('');
  return `<h1>${title}</h1>`+(rows.trim()?rows:`<div class="alldone"><div class="big">${kind==='completed'?'🎓':'📖'}</div><b>Nothing here yet.</b>
    <p>${kind==='completed'?'Mark a topic Complete on its page once you have mastered it.':'Open any topic and start studying — it will show here while in progress.'}</p></div>`);
}

/* force the newest version: clear caches, update the worker, reload */
let _updating=false;
async function forceUpdate(){
  if(_updating) return; _updating=true;
  const b=document.getElementById('updbtn'); if(b){ b.textContent='Updating…'; }
  try{
    if('caches' in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){ try{ await reg.update(); }catch(e){} if(reg.waiting) reg.waiting.postMessage({type:'skipWaiting'}); }
    }
  }catch(e){}
  setTimeout(()=>{ try{ location.reload(); }catch(e){ location.href=location.href; } }, 250);
}
function showUpdateBanner(){
  if(document.getElementById('updbanner')) return;
  const b=document.createElement('div'); b.id='updbanner'; b.className='updbanner';
  b.innerHTML=`<span>🔄 A new version of MedBank is ready.</span>
     <button class="btn primary" onclick="forceUpdate()">Refresh now</button>
     <button class="btn" onclick="this.parentNode.remove()">Later</button>`;
  document.body.appendChild(b);
}

window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e;
  const b=document.getElementById('installbtn'); if(b) b.style.display='inline-flex'; });
async function doInstall(){
  if(!deferredInstall){ alert('To install: on iPhone use Share → “Add to Home Screen”; on Android use the browser menu → “Install app”.'); return; }
  deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(e){} deferredInstall=null;
  const b=document.getElementById('installbtn'); if(b) b.style.display='none';
}
function swPing(type,extra){ try{ if(navigator.serviceWorker&&navigator.serviceWorker.controller)
  navigator.serviceWorker.controller.postMessage(Object.assign({type},extra||{})); }catch(e){} }
async function setupReminder(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const every=Math.max(5,(DATA.settings.remindMins||120))*60e3;
    if('periodicSync' in reg){
      const st=await navigator.permissions.query({name:'periodic-background-sync'}).catch(()=>({state:'denied'}));
      if(st.state==='granted'){ try{ await reg.periodicSync.register('medbank-nudge',{minInterval:every}); }catch(e){} }
    }
    // pre-stage current cards so a background notification can carry them
    const items=nudgeItems(10); if(items.length) swPing('payload',{body:nudgeBody(items),url:'./app.html#/nudge'});
  }catch(e){}
}
if('serviceWorker' in navigator){
  // when a new worker takes control, reload once to load the fresh app
  let _swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_swReloaded)return; _swReloaded=true; location.reload(); });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(reg=>{
    // detect a newly downloaded version and offer to refresh
    reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw)return;
      nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBanner(); }); });
    if(DATA.settings.remindOn) setupReminder();
    if(DATA.settings.useIdle) startIdle(false);
    swPing('hardcount',{n:starCount()});     // keep the SW's hard-card count current
    // catch-up nudge on open, then a recurring check every minute
    setTimeout(()=>nudgeTick(false), 1500);
    setInterval(()=>nudgeTick(false), 60e3);
  }).catch(()=>{}); });
  // re-check whenever the app is brought back to the foreground
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') nudgeTick(false); });
}

/* ---- edge-swipe to open/close the sidebar on touch devices ---- */
(function(){
  let x0=null,y0=null,t0=0,tracking=false;
  const isMobile=()=>window.matchMedia('(max-width:820px)').matches;
  document.addEventListener('touchstart',e=>{
    if(!isMobile()||e.touches.length!==1){tracking=false;return;}
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now();
    const open=document.body.classList.contains('navopen');
    // track an open-swipe only if it begins near the left edge, or any swipe while the menu is open
    tracking = open || x0 < Math.min(46, window.innerWidth*0.12);
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!tracking||x0==null){x0=y0=null;return;}
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    const open=document.body.classList.contains('navopen');
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6 && (Date.now()-t0)<700){
      if(dx>0 && !open) document.body.classList.add('navopen');    // swipe right → open
      else if(dx<0 && open) document.body.classList.remove('navopen'); // swipe left → close
    }
    x0=y0=null; tracking=false;
  },{passive:true});
})();

.vizcap .lab{color:#c9b8f5;font-weight:800;font-size:10.5px;letter-spacing:.5px;display:block;margin-bottom:2px}.vizcap b{color:#a5f3e4}
.vizctrl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.vizctrl button{border:1px solid #e7e3f2;background:#fff;border-radius:9px;padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer}
.vizctrl button.pl{background:#6d28d9;color:#fff;border-color:transparent;min-width:92px}
.vizctrl input[type=range]{flex:1;min-width:120px;accent-color:#6d28d9}
.vizload{padding:40px;text-align:center;color:#5c5570;font-weight:700}
.vzglow{filter:drop-shadow(0 0 6px rgba(124,58,237,.95))}
.vzdim{opacity:.4}.vzpop{animation:vzpop .45s cubic-bezier(.3,1.4,.5,1)}@keyframes vzpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.vzflow{stroke-dasharray:9 6;animation:vzmarch 1s linear infinite}@keyframes vzmarch{to{stroke-dashoffset:-30}}
</style>
<script>
/* ===== Visualize Text — in-app engine (renders blueprints from /visualize, narrates via Kokoro) ===== */
(function(){
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function T(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.size||12)+'" font-weight="'+(o.w||600)+'" fill="'+(o.fill||'#2a2536')+'" text-anchor="'+(o.anchor||'middle')+'" font-family="Arial">'+esc(s)+'</text>';}
  var C={hormone:'#e0632b',receptor:'#0d9488',gprotein:'#9333ea',enzyme:'#6d28d9',messenger:'#7c3aed',kinase:'#9333ea',channel:'#14b8a6',water:'#2563eb',toxin:'#e0632b',neuron:'#6b7280',vesicle:'#14b8a6',snare:'#9333ea',danger:'#dc2626',effect:'#f59e0b'};
  function cL(x,y,r,l,f){return '<g><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'" stroke="#fff" stroke-width="2"/>'+T(x,y+4,l,{fill:'#fff',w:800,size:Math.min(12,r-3)})+'</g>';}
  var A={
    hormone_bubble:function(x,y,o){return cL(x,y,o.r||19,o.label||'',C.hormone);},
    toxin:function(x,y,o){return cL(x,y,o.r||16,o.label||'',C.toxin);},
    receptor:function(x,y,o){return '<rect x="'+(x-14)+'" y="'+(y-24)+'" width="28" height="48" rx="6" fill="'+C.receptor+'" stroke="#0b5f52" stroke-width="2"/>'+T(x,y+42,o.label||'',{size:10,fill:'#0d7a68',w:800});},
    gprotein:function(x,y,o){return cL(x,y,14,o.label||'Gs',C.gprotein);},
    enzyme:function(x,y,o){return cL(x,y,o.r||15,o.label||'',C.enzyme);},
    messenger:function(x,y,o){return cL(x,y,o.r||16,o.label||'',C.messenger);},
    kinase:function(x,y,o){return cL(x,y,19,o.label||'PKA',C.kinase);},
    vesicle:function(x,y,o){return '<circle cx="'+x+'" cy="'+y+'" r="'+(o.r||16)+'" fill="#eafaf6" stroke="'+C.vesicle+'" stroke-width="2.5"/>'+T(x,y+3,o.label||'',{size:9,fill:'#0d7a68',w:800});},
    channel:function(x,y,o){return '<rect x="'+(x-9)+'" y="'+(y-24)+'" width="18" height="48" rx="5" fill="'+C.channel+'" stroke="#0d5f52" stroke-width="2"/><rect x="'+(x-3)+'" y="'+(y-24)+'" width="6" height="48" fill="#c7f2ea"/>'+(o.label?T(x,y-32,o.label,{size:10,fill:'#0d7a68',w:800}):'');},
    water:function(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="7" fill="'+C.water+'" stroke="#1e3a8a" stroke-width="1.3"/>';},
    neuron_soma:function(x,y,o){return '<circle cx="'+x+'" cy="'+y+'" r="'+(o.r||24)+'" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/>'+T(x,y+3,o.label||'',{size:9,fill:'#4c1d95',w:800});},
    snare:function(x,y,o){ if(o.state==='cut')return '<path d="M'+(x-16)+','+y+' L'+(x-4)+','+y+'" stroke="'+C.danger+'" stroke-width="3"/><path d="M'+(x+4)+','+y+' L'+(x+16)+','+y+'" stroke="'+C.danger+'" stroke-width="3"/>';
      return '<path d="M'+(x-16)+','+y+' L'+(x-8)+','+(y-7)+' L'+x+','+(y+7)+' L'+(x+8)+','+(y-7)+' L'+(x+16)+','+y+'" stroke="'+C.snare+'" stroke-width="3" fill="none"/>';},
    muscle:function(x,y,o){var s='<rect x="'+(x-60)+'" y="'+(y-30)+'" width="120" height="60" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>';for(var i=-54;i<60;i+=12)s+='<line x1="'+(x+i)+'" y1="'+(y-28)+'" x2="'+(x+i)+'" y2="'+(y+28)+'" stroke="#d97706" stroke-width="2"/>';return s+T(x,y+48,o.label||'',{size:10,fill:'#b45309',w:800});},
    lightning:function(x,y){return '<polygon points="'+x+','+y+' '+(x+14)+','+y+' '+(x+4)+','+(y+16)+' '+(x+18)+','+(y+16)+' '+(x-2)+','+(y+40)+' '+(x+6)+','+(y+20)+' '+(x-6)+','+(y+20)+'" fill="'+C.effect+'" stroke="#b45309" stroke-width="1"/>';},
    node:function(x,y,o){return cL(x,y,o.r||22,o.label||'',o.color||C.danger);},
    blockx:function(x,y){return '<line x1="'+(x-24)+'" y1="'+(y-24)+'" x2="'+(x+24)+'" y2="'+(y+24)+'" stroke="'+C.danger+'" stroke-width="5"/><line x1="'+(x+24)+'" y1="'+(y-24)+'" x2="'+(x-24)+'" y2="'+(y+24)+'" stroke="'+C.danger+'" stroke-width="5"/>';},
    label:function(x,y,o){return T(x,y,o.label||'',{size:o.size||12,fill:o.fill||'#5c5570',w:700});}
  };
  function arrow(x1,y1,x2,y2,color,cls){var id='vm'+Math.abs(Math.round(x1*3+y1*7+x2*11+y2))+Math.round(Math.random()*9999);return '<defs><marker id="'+id+'" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="'+color+'"/></marker></defs><path class="'+(cls||'')+'" d="M'+x1+','+y1+' L'+x2+','+y2+'" stroke="'+color+'" stroke-width="3.2" fill="none" marker-end="url(#'+id+')"/>';}
  var TPL={
    membrane_cell:{vb:[960,560],
      backdrop:function(){return '<rect x="250" y="70" width="440" height="430" rx="16" fill="#faf7ff" stroke="#d9cff2" stroke-width="2"/><line x1="250" y1="70" x2="250" y2="500" stroke="#7c3aed" stroke-width="5"/><line x1="690" y1="70" x2="690" y2="500" stroke="#0d9488" stroke-width="5"/>'+T(150,52,'LUMEN',{w:800,fill:'#5c5570'})+T(470,52,'CELL',{w:800,fill:'#5b21b6'})+T(820,52,'BLOOD',{w:800,fill:'#0d7a68'});},
      zones:{lumen:{x:150,y:180,gap:120},apical:{x:250,y:180,gap:120},intra:{x:470,y:210,gap:78},baso:{x:690,y:250,gap:110},blood:{x:830,y:150,gap:70}}},
    neuro_pathway:{vb:[960,600],
      backdrop:function(){var s='<line x1="150" y1="150" x2="660" y2="150" stroke="#9aa2ad" stroke-width="12" stroke-linecap="round"/>';for(var mx=210;mx<=610;mx+=90)s+='<ellipse cx="'+mx+'" cy="150" rx="30" ry="12" fill="#f0e6cf" stroke="#d9c7a0" stroke-width="1.5"/>';s+=T(400,120,'motor axon',{size:11,fill:'#6b7280',w:700})+'<rect x="660" y="82" width="250" height="140" rx="20" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>'+T(785,104,'SPINAL CORD',{size:12,fill:'#3730a3',w:800})+'<rect x="60" y="255" width="840" height="300" rx="14" fill="#fff" stroke="#e7e3f2"/>'+T(92,278,'INHIBITORY SYNAPSE (zoom)',{size:11,fill:'#5b21b6',w:800,anchor:'start'})+'<ellipse cx="300" cy="405" rx="150" ry="112" fill="#f7f5fc" stroke="#7c3aed" stroke-width="2.5"/><line x1="452" y1="315" x2="452" y2="495" stroke="#7c3aed" stroke-width="5"/><rect x="560" y="300" width="150" height="205" rx="14" fill="#eef2ff" stroke="#6b7280" stroke-width="2"/>'+T(635,292,'motor / autonomic neuron',{size:10,fill:'#3730a3',w:700});return s;},
      zones:{peri:{x:120,y:150,gap:34},axon:{x:410,y:150,gap:0},cns:{x:790,y:158,gap:46},pre:{x:405,y:360,gap:50},cleft:{x:505,y:405,gap:0},post:{x:635,y:405,gap:0},eff:{x:800,y:360,gap:120}}}
  };
  var BP=null,T2=null,i=0,playing=false,elMap={};
  function coordOf(el){ if(el.at)return {x:el.at.x,y:el.at.y}; var z=T2.zones[el.zone]||{x:100,y:100,gap:60}; return {x:z.x,y:z.y+(el.lane||0)*(z.gap||60)}; }
  function posAt(el,step){ var p=coordOf(el); for(var s=0;s<=step;s++){var mv=(BP.narration_steps[s].move||[]);for(var k=0;k<mv.length;k++){if(mv[k].id===el.id){ if(mv[k].to_zone){var z=T2.zones[mv[k].to_zone];if(z)p={x:z.x,y:z.y+((mv[k].lane||0)*(z.gap||60))};} else if(mv[k].to)p={x:mv[k].to.x,y:mv[k].to.y}; }}} return p; }
  function introOf(id){ for(var s=0;s<BP.narration_steps.length;s++){ if((BP.narration_steps[s].reveal||[]).indexOf(id)>=0)return s; } return 0; }
  function cutFrom(id){ for(var s=0;s<BP.narration_steps.length;s++){ if((BP.narration_steps[s].cut||[]).indexOf(id)>=0)return s; } return -1; }
  function anchor(ref,step){ if(elMap[ref])return posAt(elMap[ref],step); var z=T2.zones[ref]; return z?{x:z.x,y:z.y}:{x:0,y:0}; }
  function sceneSVG(step){
    var vb=T2.vb,s=['<svg viewBox="0 0 '+vb[0]+' '+vb[1]+'" xmlns="http://www.w3.org/2000/svg">'];
    s.push(T2.backdrop());
    for(var st=0;st<=step;st++){var ars=BP.narration_steps[st].arrows||[];for(var a=0;a<ars.length;a++){var f=anchor(ars[a].from,step),t=anchor(ars[a].to,step);s.push(arrow(f.x,f.y,t.x,t.y,ars[a].color||'#7c3aed',st===step?'vzflow':'vzdim'));}}
    var act=BP.narration_steps[step].active||[];
    for(var e=0;e<BP.elements.length;e++){var el=BP.elements[e],intro=introOf(el.id),ever=false;
      for(var s2=0;s2<BP.narration_steps.length;s2++){if((BP.narration_steps[s2].reveal||[]).indexOf(el.id)>=0){ever=true;break;}}
      if(ever&&step<intro)continue;
      var p=posAt(el,step),cut=cutFrom(el.id),state=(cut>=0&&step>=cut)?'cut':null;
      var isA=act.indexOf(el.id)>=0,cls=isA?'vzglow vzpop':(step===intro?'vzpop':'vzdim');
      var d=A[el.type]||A.label;
      s.push('<g class="'+cls+'">'+d(p.x,p.y,{label:el.label,color:el.color,r:el.r,state:state})+'</g>');
    }
    s.push('</svg>');return s.join('');
  }
  function $(id){return document.getElementById(id);}
  function openModal(){ closeModal();
    var ov=document.createElement('div'); ov.className='vizov'; ov.id='vizov';
    ov.innerHTML='<div class="vizpanel" onclick="event.stopPropagation()"><div class="vizhd"><b>🎬 Visualize</b><button class="x" id="vizX">✕</button></div><div class="vizbody" id="vizBody"><div class="vizload"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span><br>Building your explainer… (first time only)</div></div></div>';
    ov.addEventListener('click',closeModal);
    document.body.appendChild(ov);
    $('vizX').onclick=closeModal;
  }
  function closeModal(){ playing=false; try{if(window.stopSpeak)stopSpeak();}catch(e){} var o=$('vizov'); if(o)o.remove(); }
  function mountPlayer(){
    $('vizBody').innerHTML=''
      +'<div class="vizrail" id="vizRail"></div>'
      +'<div class="vizstage"><div id="vizSvg"></div><div class="vizcur" id="vizCur"><svg viewBox="0 0 24 24"><path d="M5 2 L5 20 L10 15 L13 21.5 L15.6 20.4 L12.6 14 L19 14 Z" fill="#1c1830" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg></div><div class="vizcap" id="vizCap"></div></div>'
      +'<div class="vizctrl"><button class="pl" id="vizPlay">▶ Play</button><button id="vizPrev">← Prev</button><button id="vizNext">Next →</button><input type="range" id="vizScrub" min="0" max="1" value="0" step="1"></div>';
    var st=BP.narration_steps;
    $('vizRail').innerHTML=st.map(function(s,k){return '<span class="rc">'+esc(s.short||('S'+(k+1)))+'</span>'+(k<st.length-1?'<span class="rs">→</span>':'');}).join('');
    $('vizScrub').max=st.length-1;
    $('vizPlay').onclick=function(){ playing?stop():play(); };
    $('vizPrev').onclick=function(){ jump(Math.max(0,i-1)); };
    $('vizNext').onclick=function(){ jump(Math.min(st.length-1,i+1)); };
    $('vizScrub').oninput=function(){ jump(+this.value); };
    render(0);
  }
  function render(idx){ i=idx; var w=$('vizSvg'); if(!w)return; w.innerHTML=sceneSVG(i); move();
    var s=BP.narration_steps[i]; var term=s.term||'';
    $('vizCap').innerHTML='<span class="lab">STEP '+(i+1)+' / '+BP.narration_steps.length+(s.short?' · '+esc(s.short):'')+'</span>'+esc(s.narration_text||'').replace(esc(term),'<b>'+esc(term)+'</b>');
    $('vizScrub').value=i;
    Array.prototype.forEach.call(document.querySelectorAll('#vizRail .rc'),function(c,k){c.classList.toggle('on',k<i);});
  }
  function move(){ var s=BP.narration_steps[i],ref=s.point,p=ref?anchor(ref,i):null,c=$('vizCur'); if(!p||!c)return; c.style.left=(p.x/T2.vb[0]*100)+'%'; c.style.top=(p.y/T2.vb[1]*100)+'%'; }
  function say(text,cb){ try{ if(window.voiceSpeak){ window.voiceSpeak(text,cb,'read'); return; } }catch(e){} if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(text);u.onend=cb;speechSynthesis.cancel();speechSynthesis.speak(u);} else setTimeout(cb,2600); }
  function playStep(){ render(i); say(BP.narration_steps[i].narration_text||'',function(){ if(!playing)return; if(i<BP.narration_steps.length-1){i++;playStep();}else stop(); }); }
  function play(){ playing=true; var b=$('vizPlay'); if(b)b.textContent='❚❚ Pause'; playStep(); }
  function stop(){ playing=false; var b=$('vizPlay'); if(b)b.textContent='▶ Play'; try{if(window.stopSpeak)stopSpeak();}catch(e){} }
  function jump(x){ stop(); render(x); }
  async function fetchBlueprint(text,subject){
    var CFG=window.MEDBANK_CONFIG||{}; if(!CFG.IMPORT_API||!window.__mbSB) throw new Error('Visualize needs an internet connection.');
    var ses=await window.__mbSB.auth.getSession(); var token=ses.data.session&&ses.data.session.access_token; if(!token) throw new Error('Please sign in.');
    var r=await fetch(CFG.IMPORT_API.replace(/\/$/,'')+'/visualize',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({text:(text||'').slice(0,1200),subject:subject||''})});
    var j=await r.json().catch(function(){return {};}); if(!r.ok||!j.blueprint) throw new Error((j&&j.error)||'Could not build a visualization.');
    return j.blueprint;
  }
  window.aiVisualize=async function(text, topicName){
    openModal();
    try{
      var bp=await fetchBlueprint(text, topicName);
      if(!bp.narration_steps||!bp.narration_steps.length){ $('vizBody').innerHTML='<div class="vizload">Could not build this one — try a clearer single sentence.</div>'; return; }
      BP=bp; T2=TPL[bp.template]||TPL.membrane_cell; elMap={}; (bp.elements||[]).forEach(function(el){elMap[el.id]=el;});
      mountPlayer(); setTimeout(play,400);
    }catch(e){ var b=$('vizBody'); if(b) b.innerHTML='<div class="vizload">'+esc(e.message||'Something went wrong')+'</div>'; }
  };
})();
</script>
